name: Release rehearsal battery

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit to rehearse (defaults to the pushed SHA)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: release-rehearsal-battery-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse-twenty-consecutive:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      BATTERY_SOURCE_SHA: ${{ inputs.source_sha || github.sha }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.BATTERY_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # One exact candidate, twenty consecutive unique-namespace rehearsals,
      # zero tolerated flaky failures, one aggregate receipt digest (REL-004).
      # This lane holds no publication authority: it never writes a production
      # tag, release, package index, or registry.
      - name: Install hash-locked local build tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r config/python-build-bootstrap.txt
          python -m pip install --no-build-isolation -e '.[dev]'
          python -m pip check
      - name: Rehearse 20 consecutive unique-namespace releases of the exact candidate
        run: >-
          python scripts/run_release_rehearsal_battery.py
          --source-root .
          --commit "$BATTERY_SOURCE_SHA"
          --sandbox-root "${RUNNER_TEMP}/kestrel-rehearsal-battery"
          --output-dir "${RUNNER_TEMP}/kestrel-rehearsal-battery-output"
          --repeats 20
      - name: Upload the aggregate rehearsal battery receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-rehearsal-battery-${{ env.BATTERY_SOURCE_SHA }}
          path: ${{ runner.temp }}/kestrel-rehearsal-battery-output
          if-no-files-found: warn
          retention-days: 30
