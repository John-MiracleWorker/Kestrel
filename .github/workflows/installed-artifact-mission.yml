name: Installed artifact mission matrix

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact source commit (defaults to the pushed SHA)"
        required: false
        default: ""

permissions:
  contents: read

env:
  MISSION_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  RELEASE_EXTRAS: "memvid,openai,anthropic,gemini,server,mcp,keyring"

concurrency:
  group: installed-artifact-mission-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-payload:
    name: Build the exact release payload
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.MISSION_SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Derive the exact release version
        run: |
          RELEASE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Install hash-locked build and release tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r config/release-build-bootstrap.txt
          uv export --frozen --no-dev --no-emit-local \
            --group release \
            --extra dev \
            --format requirements.txt \
            --output-file "${RUNNER_TEMP}/requirements-validation.txt"
          python -m pip install --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/requirements-validation.txt"
      - name: Build the exact wheel and source distribution
        env:
          SOURCE_DATE_EPOCH: "1"
          PYTHONHASHSEED: "0"
        run: |
          mkdir -p dist
          python -m build --no-isolation --wheel --sdist --outdir dist
      - name: Export locked default release dependencies
        run: |
          IFS=',' read -ra extras <<< "$RELEASE_EXTRAS"
          extra_args=()
          for extra in "${extras[@]}"; do
            extra_args+=(--extra "$extra")
          done
          uv export --frozen --no-dev --no-emit-local \
            "${extra_args[@]}" \
            --format requirements.txt \
            --output-file dist/requirements-release.txt
      - name: Smoke-install the exact wheel for the release SBOM
        run: |
          python -m venv "${RUNNER_TEMP}/kestrel-mission-smoke"
          wheels=(dist/*.whl)
          test "${#wheels[@]}" -eq 1
          "${RUNNER_TEMP}/kestrel-mission-smoke/bin/python" -m pip install \
            --require-hashes \
            --only-binary=:all: \
            -r dist/requirements-release.txt
          "${RUNNER_TEMP}/kestrel-mission-smoke/bin/python" -m pip install \
            --no-deps \
            "${wheels[0]}[${RELEASE_EXTRAS}]"
          "${RUNNER_TEMP}/kestrel-mission-smoke/bin/python" -m pip check
      - name: Stage installers
        run: |
          cp install.sh dist/install.sh
          cp install.ps1 dist/install.ps1
      - name: Generate the release SBOM
        run: |
          cyclonedx-py environment "${RUNNER_TEMP}/kestrel-mission-smoke/bin/python" \
            --output-reproducible \
            --output-format JSON \
            --output-file dist/sbom.cdx.json
      - name: Generate the payload checksum manifest
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path

          root = Path("dist")
          wheels = sorted(root.glob("*.whl"))
          sdists = sorted(root.glob("*.tar.gz"))
          if len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"expected one wheel and one sdist: {wheels=} {sdists=}")
          names = [
              "install.sh",
              "install.ps1",
              "requirements-release.txt",
              wheels[0].name,
              sdists[0].name,
              "sbom.cdx.json",
          ]
          lines = []
          for name in names:
              digest = hashlib.sha256((root / name).read_bytes()).hexdigest()
              lines.append(f"{digest}  {name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Verify the complete exact release payload
        run: |
          python scripts/verify_release_payload.py dist \
            --expected-version "$RELEASE_VERSION"
      - name: Upload the validated exact release payload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-mission-payload-${{ env.MISSION_SOURCE_SHA }}
          path: dist
          if-no-files-found: error
          retention-days: 30

  installed-mission:
    name: Mission on ${{ matrix.os }} / Python ${{ matrix.python }}
    needs: build-payload
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
            machine: x86_64
          - os: ubuntu-latest
            python: "3.12"
            machine: x86_64
          - os: ubuntu-latest
            python: "3.13"
            machine: x86_64
          - os: macos-latest
            python: "3.11"
            machine: arm64
          - os: macos-latest
            python: "3.12"
            machine: arm64
          - os: macos-latest
            python: "3.13"
            machine: arm64
          - os: windows-latest
            python: "3.11"
            machine: AMD64
          - os: windows-latest
            python: "3.12"
            machine: AMD64
          - os: windows-latest
            python: "3.13"
            machine: AMD64
    permissions:
      actions: read
      contents: read
    env:
      PYTHONNOUSERSITE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ env.MISSION_SOURCE_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Derive the exact release version
        shell: bash
        run: |
          RELEASE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Verify runner architecture matches the matrix label
        run: >-
          python -c "import platform;
          actual=platform.machine().casefold();
          expected='${{ matrix.machine }}'.casefold();
          assert actual == expected, (actual, expected)"
      - name: Download the single validated candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kestrel-mission-payload-${{ env.MISSION_SOURCE_SHA }}
          path: dist
      - name: Install, launch, run a mock mission, and verify cleanup
        shell: bash
        run: >-
          python -m scripts.run_installed_artifact_mission dist
          --expected-version "$RELEASE_VERSION"
          --source-root .
          --work-root "${RUNNER_TEMP}/kestrel-installed-mission"
          --output installed-artifact-mission.json
      - name: Record the successful installed-artifact mission matrix cell
        shell: bash
        env:
          MATRIX_OS: ${{ matrix.os }}
          MATRIX_PYTHON: ${{ matrix.python }}
          MATRIX_MACHINE: ${{ matrix.machine }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(Path("installed-artifact-mission.json").read_text(encoding="utf-8"))
          record = {
              "schema": "kestrel.installed_artifact_mission_cell.v1",
              "source_sha": os.environ["MISSION_SOURCE_SHA"],
              "run_id": int(os.environ["GITHUB_RUN_ID"]),
              "run_attempt": int(os.environ["GITHUB_RUN_ATTEMPT"]),
              "os": os.environ["MATRIX_OS"],
              "python": os.environ["MATRIX_PYTHON"],
              "machine": os.environ["MATRIX_MACHINE"],
              "wheel_sha256": report["payload"]["wheel_sha256"],
              "mission_run_id": report["mission"]["run_id"],
              "readiness_ok": report["readiness"]["ok"],
              "mission_status": report["mission"]["terminal_status"],
              "cleanup_port_released": report["cleanup"]["port_released"],
              "cleanup_lock_released": report["cleanup"]["lock_released"],
              "status": "success",
          }
          Path("installed-artifact-mission-cell.json").write_text(
              json.dumps(record, sort_keys=True, separators=(",", ":")), encoding="utf-8"
          )
          PY
      - name: Upload immutable installed-artifact mission matrix cell
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-installed-mission-${{ matrix.os }}-${{ matrix.python }}-${{ matrix.machine }}-${{ env.MISSION_SOURCE_SHA }}
          path: installed-artifact-mission-cell.json
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
