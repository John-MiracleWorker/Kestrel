              transaction_authorization_digest=transaction_digest,
              execution_authorization_digest=execution_digest,
              recovery_capsule_digest=capsule_digest,
              github_ghcr_verification_digest=receipts._sha256(  # noqa: SLF001
                  github_verification_raw
              ),
          )
          PY
          "$KESTREL_PYTHON" - <<'PY'
          import hashlib
          import json
          import ssl
          import urllib.request
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/pypi")
          bundle = Path("transaction/candidate")
          staged_root = Path("transaction/pypi-dist")
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          expected = transaction._candidate_pypi_files(manifest)  # noqa: SLF001
          planned_state = json.loads(root.joinpath("pre-state.json").read_bytes())
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          request = urllib.request.Request(
              "https://pypi.org/pypi/nested-memvid-agent/json",
              headers={"Accept": "application/json", "User-Agent": "kestrel/0.6"},
          )
          with opener.open(request, timeout=30) as response:
              fresh_raw = response.read(receipts.MAX_SOURCE_BODY_BYTES + 1)
          if len(fresh_raw) > receipts.MAX_SOURCE_BODY_BYTES:
              raise SystemExit("fresh PyPI project observation exceeds the evidence boundary")
          fresh_project = receipts.parse_external_json_bytes(
              fresh_raw, label="immediate pre-publication PyPI project observation"
          )
          fresh_state = transaction._classify_pypi_project_observation(  # noqa: SLF001
              fresh_project, version=manifest["version"], expected_files=expected
          )
          root.joinpath("fresh-project.json").write_bytes(
              receipts.canonical_external_json_bytes(fresh_project)
          )
          if fresh_state != planned_state:
              raise SystemExit("PyPI state changed after publication planning")

          staged_names = sorted(
              item.name
              for item in staged_root.iterdir()
              if item.is_file() and not item.is_symlink()
          )
          if staged_names != planned_state["missing"] or len(staged_names) != len(
              list(staged_root.iterdir())
          ):
              raise SystemExit("staged PyPI distribution inventory changed after planning")
          for filename in staged_names:
              item = expected[filename]
              raw = staged_root.joinpath(filename).read_bytes()
              if (
                  len(raw) != item["size_bytes"]
                  or "sha256:" + hashlib.sha256(raw).hexdigest() != item["sha256"]
              ):
                  raise SystemExit("staged PyPI distribution changed after planning")
          PY

      - name: Publish only the missing exact PyPI distributions
        id: publish-pypi-files
        if: ${{ steps.pypi-plan.outputs.publish == 'create' }}
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247
        with:
          packages-dir: transaction/pypi-dist

      - name: Record PyPI outcome from public post-state and verified provenance
        id: record-pypi
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          PUBLISHER_OUTCOME: ${{ steps.publish-pypi-files.outcome }}
        run: |
          test -f transaction/pypi/pypi-pre-observation.json
          "$KESTREL_PYTHON" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import ssl
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/pypi")
          bundle = Path("transaction/candidate")
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          expected = transaction._candidate_pypi_files(manifest)  # noqa: SLF001
          pre_state = json.loads(root.joinpath("pre-state.json").read_bytes())
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          request = urllib.request.Request(
              "https://pypi.org/pypi/nested-memvid-agent/json",
              headers={"Accept": "application/json", "User-Agent": "kestrel/0.6"},
          )
          with opener.open(request, timeout=30) as response:
              project_raw = response.read(receipts.MAX_SOURCE_BODY_BYTES + 1)
          if len(project_raw) > receipts.MAX_SOURCE_BODY_BYTES:
              raise SystemExit("PyPI post-observation exceeds the evidence boundary")
          project = receipts.parse_external_json_bytes(
              project_raw, label="PyPI post-publication project observation"
          )
          post_state = transaction._classify_pypi_project_observation(  # noqa: SLF001
              project, version=manifest["version"], expected_files=expected
          )
          observed = {
              item["filename"]: item
              for item in project["releases"].get(manifest["version"], [])
          }
          integrity_files = []
          verification_files = []
          for filename in post_state["present"]:
              item = expected[filename]
              local_path = root / "persisted" / filename
              local_path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              with opener.open(
                  urllib.request.Request(
                      observed[filename]["url"],
                      headers={
                          "Accept": "application/octet-stream",
                          "User-Agent": "kestrel/0.6",
                      },
                  ),
                  timeout=120,
              ) as response:
                  distribution_raw = response.read(item["size_bytes"] + 1)
              if (
                  len(distribution_raw) != item["size_bytes"]
                  or "sha256:" + hashlib.sha256(distribution_raw).hexdigest()
                  != item["sha256"]
              ):
                  raise SystemExit("persisted PyPI distribution conflicts with candidate")
              local_path.write_bytes(distribution_raw)
              provenance_url = (
                  "https://pypi.org/integrity/nested-memvid-agent/"
                  f"{manifest['version']}/{urllib.parse.quote(filename, safe='')}/provenance"
              )
              with opener.open(
                  urllib.request.Request(
                      provenance_url,
                      headers={"Accept": "application/json", "User-Agent": "kestrel/0.6"},
                  ),
                  timeout=30,
              ) as response:
                  provenance_raw = response.read(receipts.MAX_SOURCE_BODY_BYTES + 1)
              if len(provenance_raw) > receipts.MAX_SOURCE_BODY_BYTES:
                  raise SystemExit("PyPI provenance exceeds the evidence boundary")
              provenance = receipts.parse_external_json_bytes(
                  provenance_raw, label="persisted PyPI Integrity provenance"
              )
              provenance_path = root / "persisted" / f"{filename}.provenance.json"
              provenance_path.write_bytes(provenance_raw)
              # Exact policy command: pypi-attestations verify pypi --offline
              verified = subprocess.run(
                  [
                      os.environ["PYPI_ATTESTATIONS"],
                      "verify",
                      "pypi",
                      "--offline",
                      "--repository",
                      "https://github.com/John-MiracleWorker/Kestrel",
                      "--provenance-file",
                      str(provenance_path),
                      str(local_path),
                  ],
                  capture_output=True,
                  check=False,
                  env={"LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "PYTHONNOUSERSITE": "1"},
              )
              if verified.returncode != 0:
                  raise SystemExit("pinned PyPI verifier rejected persisted provenance")
              transaction._verify_pypi_integrity_provenance(  # noqa: SLF001
                  provenance, filename=filename, expected_digest=item["sha256"]
              )
              integrity_files.append(
                  {
                      "filename": filename,
                      "provenance_response_base64": base64.b64encode(
                          provenance_raw
                      ).decode("ascii"),
                  }
              )
              verification_files.append(
                  {
                      "filename": filename,
                      "distribution_sha256": item["sha256"],
                      "provenance_sha256": receipts._sha256(  # noqa: SLF001
                          provenance_raw
                      ),
                      "exit_code": 0,
                  }
              )
          integrity = {
              "schema": "pypi.integrity_observations.v1",
              "files": integrity_files,
          }
          provenance_verifications = {
              "schema": "pypi.provenance_verifications.v1",
              "tool": {"name": "pypi-attestations", "version": "0.0.30"},
              "files": verification_files,
          }
          root.joinpath("pypi-post-project.json").write_bytes(
              receipts.canonical_external_json_bytes(project)
          )
          root.joinpath("pypi-integrity-observations.json").write_bytes(
              receipts.canonical_json_bytes(integrity)
          )
          root.joinpath("pypi-provenance-verifications.json").write_bytes(
              receipts.canonical_json_bytes(provenance_verifications)
          )

          execution_path = (
              Path("transaction/release-execution-authorization.json")
              if Path("transaction/release-execution-authorization.json").is_file()
              else None
          )
          candidate, transaction_digest, execution_digest, capsule_digest, _sources = (
              transaction._stage_candidate_and_authority(  # noqa: SLF001
                  manifest_path=bundle / "candidate-manifest.json",
                  bundle_root=None,
                  transaction_authorization_path=Path(
                      "transaction/release-authorization.json"
                  ),
                  execution_authorization_path=execution_path,
                  recovery_capsule_verification_path=Path(
                      "transaction/prepare-authority/recovery-capsule-verification.json"
                  ),
              )
          )
          request_files = [
              {
                  "filename": filename,
                  "path": expected[filename]["path"],
                  "sha256": expected[filename]["sha256"],
                  "size_bytes": expected[filename]["size_bytes"],
              }
              for filename in pre_state["missing"]
          ]
          request_digest = receipts._sha256(  # noqa: SLF001
              receipts.canonical_json_bytes(
                  {
                      "candidate": candidate,
                      "transaction_authorization_digest": transaction_digest,
                      "execution_authorization_digest": execution_digest,
                      "recovery_capsule_digest": capsule_digest,
                      "operation": "publish_pypi_missing_files",
                      "files": request_files,
                  }
              )
          )
          publisher_outcome = os.environ.get("PUBLISHER_OUTCOME", "skipped")
          outcome = transaction._pypi_publication_outcome(  # noqa: SLF001
              pre_missing=pre_state["missing"],
              post_missing=post_state["missing"],
              publisher_outcome=publisher_outcome,
          )
          response_digest = receipts._sha256(  # noqa: SLF001
              receipts.canonical_json_bytes(
                  {
                      "integrity": integrity,
                      "project": project,
                      "provenance_verifications": provenance_verifications,
                  }
              )
          )
          operation_outcomes = [
              {
                  "operation": "publish_pypi_missing_files",
                  "request_digest": request_digest,
                  "response_observation_digest": response_digest,
                  "outcome": outcome,
              }
          ]
          completed = not post_state["missing"] and outcome in {
              "created",
              "existing_exact",
          }
          uncertain = outcome == "unknown"
          pending = bool(post_state["missing"]) and not uncertain
          captured_at = (
              datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          )

          def envelope(*, name, provider, locator, raw, authenticated_as):
              return receipts.canonical_json_bytes(
                  {
                      "schema": receipts.SOURCE_OBSERVATION_SCHEMA,
                      "name": name,
                      "provider": provider,
                      "locator": locator,
                      "authenticated_as": authenticated_as,
                      "freshness_class": "current",
                      "captured_at": captured_at,
                      "page_count": 1,
                      "record_count": 1,
                      "complete": True,
                      "body_encoding": "base64",
                      "body": base64.b64encode(raw).decode("ascii"),
                  }
              )

          source_values = [
              envelope(
                  name="final-pypi-integrity-observations",
                  provider="pypi.org",
                  locator=(
                      "GET https://pypi.org/integrity/nested-memvid-agent/"
                      "{version}/{filename}/provenance"
                  ),
                  raw=receipts.canonical_json_bytes(integrity),
                  authenticated_as=None,
              ),
              envelope(
                  name="final-pypi-project-observation",
                  provider="pypi.org",
                  locator="GET https://pypi.org/pypi/nested-memvid-agent/json",
                  raw=receipts.canonical_external_json_bytes(project),
                  authenticated_as=None,
              ),
              envelope(
                  name="final-pypi-provenance-verifications",
                  provider="local",
                  locator="pypi-attestations 0.0.30 offline verification output",
                  raw=receipts.canonical_json_bytes(provenance_verifications),
                  authenticated_as=None,
              ),
          ]
          post = {
              "schema": "kestrel.release_stage_execution.v1",
              "stage": 4,
              "observations": sorted(
                  [receipts.source_snapshot(raw) for raw in source_values],
                  key=lambda item: item["name"],
              ),
              "operation_outcomes": operation_outcomes,
              "completed": completed,
              "uncertain": uncertain,
              "pending": pending,
              "project": project,
          }
          root.joinpath("pypi-post-observation.json").write_bytes(
              receipts.canonical_json_bytes(post)
          )
          PY
          execution_arguments=()
          if test "$PROMOTION_MODE" = recover_committed; then
            execution_arguments=(
              --execution-authorization
              transaction/release-execution-authorization.json
            )
          fi
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            record-pypi transaction/candidate/candidate-manifest.json \
            --transaction-authorization transaction/release-authorization.json \
            "${execution_arguments[@]}" \
            --recovery-capsule-verification \
              transaction/prepare-authority/recovery-capsule-verification.json \
            --commit-outcome transaction/stages/release-commit-outcome.json \
            --github-ghcr-verification \
              transaction/stages/release-github-ghcr-verification.json \
            --pypi-authority-verification \
              transaction/pypi-authority/pypi-authority-verification.json \
            --pre-observation transaction/pypi/pypi-pre-observation.json \
            --post-observation transaction/pypi/pypi-post-observation.json \
            --integrity-observations \
              transaction/pypi/pypi-integrity-observations.json \
            --provenance-verifications \
              transaction/pypi/pypi-provenance-verifications.json \
            --approval-history-observation \
              transaction/pypi-authority/approval-history-observation.json \
            --output transaction/stages/release-pypi-outcome.json

      - name: Upload preserved PyPI evidence
        id: upload-pypi
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-release-pypi-${{ github.run_id }}-1
          path: |
            transaction
            !transaction/capsule/**
            transaction/stages/release-pypi-outcome.json
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate the preserved stage result
        if: ${{ always() }}
        shell: bash
        env:
          PUBLISH_ACTION: ${{ steps.pypi-plan.outputs.publish }}
          PUBLISH_OUTCOME: ${{ steps.publish-pypi-files.outcome }}
          RECORD_OUTCOME: ${{ steps.record-pypi.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-pypi.outcome }}
        run: |
          if test "$PUBLISH_ACTION" = create; then
            test "$PUBLISH_OUTCOME" = success
          else
            test "$PUBLISH_OUTCOME" = skipped
          fi
          test "$RECORD_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success

  reconcile-final:
    needs:
      - identity-admission
      - authorize-release
      - prepare-github-ghcr
      - commit-github-release
      - verify-github-ghcr
      - publish-pypi
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out the dispatch-pinned transaction source
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Initialize fail-closed reconciliation evidence
        shell: bash
        run: |
          install -d -m 0700 reconciliation/input reconciliation/stages reconciliation/final
          printf '%s\n' \
            '{"lock_release_permitted":false,"reason":"terminal success not yet proven","schema":"kestrel.release_reconciliation_fallback.v1"}' \
            > reconciliation/reconciliation-fallback.json

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify the pinned recovery Python identity
        shell: bash
        run: |
          python_executable="$(readlink -f -- "$(command -v python)")"
          test -f "$python_executable"
          test ! -L "$python_executable"
          test "$(sha256sum "$python_executable" | cut -d ' ' -f 1)" = \
            "dcd2d22a91c5adb37fa3f54a3a16d2ed7616b84931eb606c0fdfbca38395dab8"
          test "$(python --version)" = "Python 3.11.14"

      - name: Bootstrap pinned GitHub CLI
        continue-on-error: true
        shell: bash
        run: |
          scripts/bootstrap_workflow_tools.sh "${RUNNER_TEMP}/kestrel-workflow-tools"
          pinned_gh="${RUNNER_TEMP}/kestrel-workflow-tools/gh"
          test "$($pinned_gh --version | head -n 1)" = \
            "gh version 2.97.0 (2026-02-26)"
          printf 'PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"
          printf 'KESTREL_PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"

      - name: Download every preserved transaction artifact
        id: download-reconciliation-inputs
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: reconcile-artifacts

      - name: Activate immutable recovery capsule for reconciliation
        id: activate-reconciliation-capsule
        continue-on-error: true
        shell: bash
        run: |
          install -d -m 0700 \
            transaction \
            reconciliation/capsule-input \
            reconciliation/input \
            reconciliation/stages \
            reconciliation/final
          printf '%s\n' \
            '{"lock_release_permitted":false,"reason":"terminal success not yet proven","schema":"kestrel.release_reconciliation_fallback.v1"}' \
            > reconciliation/reconciliation-fallback.json
          python -I -S -B - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          source_root = Path("reconcile-artifacts")
          output_root = Path("reconciliation/capsule-input")
          required = (
              "recovery-bootstrap.py",
              "recovery-capsule-manifest.json",
              "recovery-capsule-publication.json",
              "recovery-capsule-verification.json",
              "recovery-capsule.tar",
          )

          def select(name: str) -> bytes:
              matches = sorted(
                  (
                      path
                      for path in source_root.rglob(name)
                      if path.is_file() and not path.is_symlink()
                  ),
                  key=lambda path: path.as_posix(),
              )
              if not matches:
                  raise SystemExit(f"preserved recovery capsule input is missing: {name}")
              values = [path.read_bytes() for path in matches]
              if len({hashlib.sha256(raw).digest() for raw in values}) != 1:
                  raise SystemExit(f"preserved recovery capsule copies conflict: {name}")
              destination = output_root / name
              destination.write_bytes(values[0])
              destination.chmod(0o600)
              return values[0]

          selected = {name: select(name) for name in required}
          publication = json.loads(selected["recovery-capsule-publication.json"])
          signed = json.loads(selected["recovery-capsule-verification.json"])
          claim = signed["verification"]
          tag = publication["tag"]
          if (
              publication.get("schema") != "kestrel.recovery_capsule_publication.v1"
              or publication.get("immutable") is not True
              or publication.get("validation_status") != "validated"
              or signed.get("schema")
              != "kestrel.recovery_capsule_verification.v1"
              or signed.get("validation_status") != "validated"
              or claim.get("schema")
              != "kestrel.recovery_capsule_verification_claim.v1"
              or claim.get("verified") is not True
              or claim.get("confidence") != 1
              or claim.get("validation_status") != "validated"
              or not isinstance(tag, str)
              or re.fullmatch(r"recovery-[1-9][0-9]*-1", tag) is None
              or claim.get("release", {}).get("tag") != tag
              or claim.get("release", {}).get("id") != publication.get("release_id")
              or claim.get("repository", {}).get("full_name")
              != publication.get("repository")
              or claim.get("repository", {}).get("id")
              != publication.get("repository_id")
          ):
              raise SystemExit("preserved recovery capsule publication binding is invalid")
          assets = claim.get("assets")
          asset_fields = {"id", "name", "size_bytes", "sha256"}
          if (
              not isinstance(assets, list)
              or len(assets) != 3
              or any(not isinstance(item, dict) or set(item) != asset_fields for item in assets)
          ):
              raise SystemExit("preserved recovery capsule asset claim is invalid")
          expected = {item["name"]: item for item in assets}
          if len(expected) != 3 or set(expected) != {
              "recovery-bootstrap.py",
              "recovery-capsule-manifest.json",
              "recovery-capsule.tar",
          }:
              raise SystemExit("preserved recovery capsule asset inventory is invalid")
          for name in expected:
              raw = selected[name]
              if (
                  expected[name].get("size_bytes") != len(raw)
                  or expected[name].get("sha256")
                  != "sha256:" + hashlib.sha256(raw).hexdigest()
              ):
                  raise SystemExit(f"preserved recovery capsule asset changed: {name}")
          if (
              publication.get("manifest_digest")
              != expected["recovery-capsule-manifest.json"]["sha256"]
              or publication.get("archive_digest")
              != expected["recovery-capsule.tar"]["sha256"]
              or claim.get("capsule_manifest_digest")
              != expected["recovery-capsule-manifest.json"]["sha256"]
          ):
              raise SystemExit("preserved recovery capsule digest binding is invalid")
          PY
          readarray -t capsule_inputs < <(python -I -S -B - <<'PY'
          import json
          from pathlib import Path

          root = Path("reconciliation/capsule-input")
          publication = json.loads(
              root.joinpath("recovery-capsule-publication.json").read_bytes()
          )
          signed = json.loads(
              root.joinpath("recovery-capsule-verification.json").read_bytes()
          )
          claim = signed["verification"]
          assets = {item["name"]: item for item in claim["assets"]}
          print(publication["archive_digest"])
          print(claim["capsule_manifest_digest"])
          print(claim["signing_key_fingerprint"])
          print(assets["recovery-bootstrap.py"]["sha256"])
          PY
          )
          test "${#capsule_inputs[@]}" -eq 4
          cmp --silent scripts/bootstrap_recovery.py \
            "reconciliation/capsule-input/recovery-bootstrap.py"
          test "$(sha256sum \
            "reconciliation/capsule-input/recovery-bootstrap.py" | cut -d ' ' -f 1)" = \
            "${capsule_inputs[3]#sha256:}"
          recovery_tcb_python="$(bash scripts/bootstrap_recovery_tcb.sh \
            "${RUNNER_TEMP}/kestrel-recovery-bootstrap-tcb")"
          env -i LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 \
            "$recovery_tcb_python" -I -S -B \
            reconciliation/capsule-input/recovery-bootstrap.py \
            reconciliation/capsule-input/recovery-capsule.tar \
            --destination transaction/capsule \
            --expected-archive-digest "${capsule_inputs[0]}" \
            --expected-manifest-digest "${capsule_inputs[1]}" \
            --expected-owner-key-fingerprint "${capsule_inputs[2]}"
          capsule_root="$GITHUB_WORKSPACE/transaction/capsule"
          capsule_python="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/environment/bin/python")"
          capsule_runtime="$(readlink -f -- "$capsule_root/recovery/runtime")"
          capsule_base_lib="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/base/lib")"
          capsule_loader="$capsule_runtime/ld-linux-x86-64.so.2"
          capsule_library_path="$capsule_runtime:$capsule_base_lib"
          test ! -e /etc/ld.so.preload
          test -x "$capsule_python"
          test -x "$capsule_loader"
          test -z "$(find "$capsule_runtime" -mindepth 1 -type d -print -quit)"
          capsule_private_loader() {
            local loader_report loader_line dependency
            loader_report="$(env -i "$capsule_loader" --inhibit-cache \
              --library-path "$capsule_library_path" --list "$capsule_python")"
            case "$loader_report" in *"not found"*) return 1 ;; esac
            while IFS= read -r loader_line; do
              loader_line="${loader_line#"${loader_line%%[![:space:]]*}"}"
              if [[ "$loader_line" == *" => "* ]]; then
                dependency="${loader_line#* => }"
                dependency="${dependency%% *}"
              elif [[ "$loader_line" == /* ]]; then
                dependency="${loader_line%% *}"
              else
                continue
              fi
              case "$dependency" in
                "$capsule_runtime"/*|"$capsule_base_lib"/*) ;;
                *) return 1 ;;
              esac
            done <<< "$loader_report"
            (
              exec -c "$capsule_loader" --inhibit-cache \
                --library-path "$capsule_library_path" "$capsule_python" "$@"
            )
          }
          host_venv="${RUNNER_TEMP}/kestrel-reconcile-actuator-venv"
          test ! -e "$host_venv"
          python -I -m venv --copies "$host_venv"
          KESTREL_PYTHON="$host_venv/bin/python"
          test -x "$KESTREL_PYTHON"
          test ! -L "$KESTREL_PYTHON"
          "$KESTREL_PYTHON" -I -m pip --isolated install \
            --no-index \
            --find-links "$capsule_root/recovery/wheelhouse" \
            --require-hashes \
            --only-binary=:all: \
            --requirement "$capsule_root/recovery/requirements.txt"
          "$KESTREL_PYTHON" -I -m pip --isolated check
          host_verifier="$host_venv/bin/pypi-attestations"
          test -x "$host_verifier"
          test "$($host_verifier --version)" = "pypi-attestations 0.0.30"
          actuator_input_dir="$GITHUB_WORKSPACE/reconciliation/host-actuator/inputs"
          install -d -m 0700 "$actuator_input_dir"
          install -m 0500 "$KESTREL_PYTHON" "$actuator_input_dir/python"
          install -m 0500 "$PINNED_GH" "$actuator_input_dir/gh"
          host_binding="$GITHUB_WORKSPACE/reconciliation/host-actuator/host-actuator-binding.json"
          test ! -e "$host_binding"
          capsule_private_loader -I -S -B -c \
            'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
            "$capsule_root" \
            "$capsule_root/scripts/recovery_launcher.py" \
            launch "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --executable python -- \
            "$capsule_root/scripts/recovery_launcher.py" \
            bind-host-actuator "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --host-root "$GITHUB_WORKSPACE" \
            --host-python "$actuator_input_dir/python" \
            --host-gh "$actuator_input_dir/gh" \
            --output "$host_binding"
          grep -Fq '"method":"offline-authority-host-actuator-binding"' \
            "$host_binding"
          {
            printf 'KESTREL_PYTHON=%s\n' "$KESTREL_PYTHON"
            printf 'PYPI_ATTESTATIONS=%s\n' "$host_verifier"
            printf 'KESTREL_HOST_ACTUATOR_BINDING=%s\n' \
              "$host_binding"
          } >> "$GITHUB_ENV"
          printf '%s\n' 'active=1' >> "$GITHUB_OUTPUT"

      - name: Normalize unique role-specific reconciliation inputs
        id: normalize-reconciliation-inputs
        if: >-
          ${{
            always() &&
            steps.activate-reconciliation-capsule.outcome == 'success' &&
            steps.activate-reconciliation-capsule.outputs.active == '1'
          }}
        shell: bash
        run: |
          install -d -m 0700 reconciliation/input reconciliation/stages reconciliation/final
          "$KESTREL_PYTHON" - <<'PY'
          import hashlib
          import os
          from pathlib import Path

          source_root = Path("reconcile-artifacts")
          output_root = Path("reconciliation/input")
          stage_root = Path("reconciliation/stages")

          def select(name, destination):
              matches = sorted(
                  (
                      path
                      for path in source_root.rglob(name)
                      if path.is_file() and not path.is_symlink()
                  ),
                  key=lambda path: path.as_posix(),
              )
              if not matches:
                  return False
              values = [path.read_bytes() for path in matches]
              digests = {hashlib.sha256(raw).digest() for raw in values}
              if len(digests) != 1:
                  raise SystemExit(f"preserved reconciliation input conflicts: {name}")
              destination.write_bytes(values[0])
              return True

          def select_candidate_bundle():
              roots = sorted(
                  {
                      path.parent
                      for path in source_root.rglob("candidate-manifest.json")
                      if path.is_file()
                      and not path.is_symlink()
                      and path.parent.joinpath("containers/oci-descriptor.json").is_file()
                  },
                  key=lambda path: path.as_posix(),
              )
              if not roots:
                  return False
              inventories = []
              for root in roots:
                  inventory = []
                  for path in sorted(root.rglob("*"), key=lambda item: item.as_posix()):
                      if path.is_symlink():
                          raise SystemExit("preserved candidate bundle contains a symlink")
                      if path.is_file():
                          raw = path.read_bytes()
                          inventory.append(
                              (
                                  path.relative_to(root).as_posix(),
                                  hashlib.sha256(raw).hexdigest(),
                                  raw,
                              )
                          )
                      elif not path.is_dir():
                          raise SystemExit(
                              "preserved candidate bundle contains a special file"
                          )
                  inventories.append(inventory)
              identities = {
                  tuple((name, digest) for name, digest, _raw in inventory)
                  for inventory in inventories
              }
              if len(identities) != 1:
                  raise SystemExit("preserved candidate bundle copies conflict")
              for name, _digest, raw in inventories[0]:
                  destination = output_root / name
                  destination.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
                  destination.write_bytes(raw)
              return True

          input_names = (
              "dispatch-identity.json",
              "dispatch-intent.json",
              "dispatch-reconciliation.json",
              "release-authorization.json",
              "release-execution-authorization.json",
              "recovery-capsule-publication.json",
              "recovery-capsule-verification.json",
              "github-commit-authority-verification.json",
          )
          present = {
              name: select(name, output_root / name)
              for name in input_names
          }
          present["candidate-manifest.json"] = select_candidate_bundle()
          stage_names = (
              "release-preparation-outcome.json",
              "release-commit-outcome.json",
              "release-github-ghcr-verification.json",
              "release-pypi-outcome.json",
          )
          stage_present = {
              name: select(name, stage_root / name)
              for name in stage_names
          }
          if not present["release-authorization.json"]:
              present["release-execution-authorization.json"] = False
          if not (
              present["candidate-manifest.json"]
              and present["release-authorization.json"]
              and present["recovery-capsule-verification.json"]
          ):
              for name in stage_names:
                  path = stage_root / name
                  if path.exists():
                      path.unlink()
                  stage_present[name] = False
          flags = output_root / "availability.env"
          flags.write_text(
              "\n".join(
                  [
                      f"CORE_AVAILABLE={'1' if all(present[name] for name in ('dispatch-identity.json', 'dispatch-intent.json', 'dispatch-reconciliation.json')) else '0'}",
                      f"PRODUCT_AVAILABLE={'1' if all(present[name] for name in ('candidate-manifest.json', 'release-authorization.json', 'recovery-capsule-verification.json')) else '0'}",
                      f"EXECUTION_AVAILABLE={'1' if present['release-execution-authorization.json'] else '0'}",
                      f"STAGES_AVAILABLE={'1' if any(stage_present.values()) else '0'}",
                  ]
              )
              + "\n",
              encoding="utf-8",
          )
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              for line in flags.read_text(encoding="utf-8").splitlines():
                  key, value = line.split("=", 1)
                  stream.write(f"{key.lower()}={value}\n")
          PY
          cmp --silent \
            reconciliation/capsule-input/recovery-capsule-publication.json \
            reconciliation/input/recovery-capsule-publication.json
          cmp --silent \
            reconciliation/capsule-input/recovery-capsule-verification.json \
            reconciliation/input/recovery-capsule-verification.json

      - name: Verify capsule-bound reconciliation product authority
        id: verify-reconciliation-capsule-binding
        if: >-
          ${{
            always() &&
            steps.activate-reconciliation-capsule.outputs.active == '1' &&
            steps.normalize-reconciliation-inputs.outputs.product_available == '1'
          }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" - <<'PY'
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          root = Path("reconciliation/input")
          execution = root / "release-execution-authorization.json"
          transaction._stage_candidate_and_authority(  # noqa: SLF001
              manifest_path=root / "candidate-manifest.json",
              bundle_root=None,
              transaction_authorization_path=root / "release-authorization.json",
              execution_authorization_path=(execution if execution.is_file() else None),
              recovery_capsule_verification_path=(
                  root / "recovery-capsule-verification.json"
              ),
          )
          PY

      - name: Download the fresh terminal final authority boundary
        id: fetch-final-authority
        if: >-
          ${{
            always() &&
            steps.activate-reconciliation-capsule.outputs.active == '1' &&
            steps.normalize-reconciliation-inputs.outputs.product_available == '1' &&
            steps.verify-reconciliation-capsule-binding.outcome == 'success' &&
            needs.identity-admission.result == 'success' &&
            needs.authorize-release.result == 'success' &&
            needs.prepare-github-ghcr.result == 'success' &&
            needs.commit-github-release.result == 'success' &&
            needs.verify-github-ghcr.result == 'success' &&
            needs.publish-pypi.result == 'success'
          }}
        continue-on-error: true
        shell: bash
        env:
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            fetch-github-boundary-authority \
            --boundary final \
            --run-id "$PROMOTION_RUN_ID" \
            --output-dir reconciliation/final-authority

      - name: Verify both final credentials
        id: verify-final-authority
        if: ${{ always() && steps.fetch-final-authority.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
          RELEASE_GUARD_TOKEN_BYTES: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          for credential in recovery-reader release-guard; do
            if test "$credential" = recovery-reader; then
              token="$RELEASE_RECOVERY_READER_TOKEN_BYTES"
            else
              token="$RELEASE_GUARD_TOKEN_BYTES"
            fi
            printf '%s' "$token" | \
              "$KESTREL_PYTHON" -m scripts.release_control_receipt \
                verify-runtime-credential \
                --scope-authority \
                  "reconciliation/final-authority/${credential}-scope-authority.json" \
                --scope-authority-signature \
                  "reconciliation/final-authority/${credential}-scope-authority.json.sig" \
                --owner-signing-keys-observation \
                  reconciliation/final-authority/owner-signing-keys-observation.json \
                --identity-probe-observation \
                  "reconciliation/final-authority/${credential}-identity-probe.json" \
                --endpoint-probe-observations \
                  "reconciliation/final-authority/${credential}-endpoint-probes.json" \
                --output \
                  "reconciliation/final-authority/${credential}-runtime-verification.json"
          done

      - name: Capture the final live prerequisite boundary
        id: capture-final-boundary
        if: ${{ always() && steps.verify-final-authority.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" - <<'PY'
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          transaction.begin_final_reconciliation_freshness_budget(
              Path("reconciliation/final-freshness-budget.json")
          )
          PY
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            capture-prerequisite-boundary \
            --registry transaction/capsule/release-control-source-registry.json \
            --repository "$PROMOTION_REPOSITORY" \
            --recovery-repository "$PROMOTION_RECOVERY_REPOSITORY" \
            --candidate-ref "$PROMOTION_SHA" \
            --run-id "$PROMOTION_RUN_ID" \
            --output-dir reconciliation/final-boundary

      - name: Revalidate final credentials and authority before reconciliation
        id: revalidate-final-authority
        if: ${{ always() && steps.capture-final-boundary.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
          RELEASE_GUARD_TOKEN_BYTES: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          for credential in recovery-reader release-guard; do
            if test "$credential" = recovery-reader; then
              token="$RELEASE_RECOVERY_READER_TOKEN_BYTES"
            else
              token="$RELEASE_GUARD_TOKEN_BYTES"
            fi
            printf '%s' "$token" | \
              "$KESTREL_PYTHON" -m scripts.release_control_receipt \
                verify-runtime-credential \
                --scope-authority \
                  "reconciliation/final-authority/${credential}-scope-authority.json" \
                --scope-authority-signature \
                  "reconciliation/final-authority/${credential}-scope-authority.json.sig" \
                --owner-signing-keys-observation \
                  reconciliation/final-authority/owner-signing-keys-observation.json \
                --identity-probe-observation \
                  "reconciliation/final-authority/${credential}-identity-probe.json" \
                --endpoint-probe-observations \
                  "reconciliation/final-authority/${credential}-endpoint-probes.json" \
                --output \
                  "reconciliation/final-authority/${credential}-pre-reconcile-verification.json"
          done

      - name: Verify the exact terminal final transaction binding
        id: verify-final-binding
        if: ${{ always() && steps.revalidate-final-authority.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          if ! test -f reconciliation/stages/release-commit-outcome.json; then
            printf '%s\n' 'bound=0' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          input_root = Path("reconciliation/input")
          execution_path = input_root / "release-execution-authorization.json"
          candidate, transaction_digest, execution_digest, capsule_digest, _sources = (
              transaction._stage_candidate_and_authority(  # noqa: SLF001
                  manifest_path=input_root / "candidate-manifest.json",
                  bundle_root=None,
                  transaction_authorization_path=input_root / "release-authorization.json",
                  execution_authorization_path=(
                      execution_path if execution_path.is_file() else None
                  ),
                  recovery_capsule_verification_path=(
                      input_root / "recovery-capsule-verification.json"
                  ),
              )
          )
          commit = json.loads(
              Path("reconciliation/stages/release-commit-outcome.json").read_bytes()
          )
          transaction.validate_release_stage_record(commit)
          transaction._require_completed_stage_binding(  # noqa: SLF001
              commit,
              candidate=candidate,
              transaction_authorization_digest=transaction_digest,
              execution_authorization_digest=execution_digest,
              recovery_capsule_digest=capsule_digest,
              label="final reconciliation commit outcome",
          )
          PY
          printf '%s\n' 'bound=1' >> "$GITHUB_OUTPUT"

      - name: Observe the active lock, ingress, and every available release surface
        id: observe-final-surfaces
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          if test "${{ steps.activate-reconciliation-capsule.outputs.active }}" != 1; then
            exit 0
          fi
          if ! test -e reconciliation/final-freshness-budget.json; then
            "$KESTREL_PYTHON" - <<'PY'
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          transaction.begin_final_reconciliation_freshness_budget(
              Path("reconciliation/final-freshness-budget.json")
          )
          PY
          fi
          observation_budget="$("$KESTREL_PYTHON" - <<'PY'
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          print(
              transaction.remaining_final_reconciliation_observation_seconds(
                  Path("reconciliation/final-freshness-budget.json")
              )
          )
          PY
          )"
          timeout --signal=TERM --kill-after=5s "${observation_budget}s" \
            bash <<'kestrel-final-observation'
          set -euo pipefail
          "$PINNED_GH" api user > reconciliation/final/guard-identity.json
          "$PINNED_GH" api "repos/${PROMOTION_REPOSITORY}" \
            > reconciliation/final/repository.json
          "$PINNED_GH" api "repos/${PROMOTION_REPOSITORY}/actions/runs/${PROMOTION_RUN_ID}" \
            > reconciliation/final/run.json
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_REPOSITORY}/rulesets?per_page=100" \
            > reconciliation/final/rulesets-pages.json
          "$PINNED_GH" api "repos/${PROMOTION_REPOSITORY}/actions/workflows/release.yml" \
            > reconciliation/final/workflow-api.json
          "$PINNED_GH" api --paginate --slurp \
            "users/John-MiracleWorker/packages?package_type=container&per_page=100" \
            > reconciliation/final/ghcr-packages.json
          package_present="$("$KESTREL_PYTHON" - \
            reconciliation/final/ghcr-packages.json <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts import release_promotion_transaction as transaction
          value = json.loads(Path(sys.argv[1]).read_bytes())
          print("1" if transaction._ghcr_package_is_present(value) else "0")  # noqa: SLF001
          PY
          )"
          if test "$package_present" = 1; then
            "$PINNED_GH" api --paginate --slurp \
              "users/John-MiracleWorker/packages/container/kestrel/versions?per_page=100" \
              > reconciliation/final/ghcr-package-versions.json
          else
            printf '[[]]\n' > reconciliation/final/ghcr-package-versions.json
          fi
          "$KESTREL_PYTHON" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("reconciliation/final")
          input_root = Path("reconciliation/input")
          guard_identity_raw = root.joinpath("guard-identity.json").read_bytes()
          guard_identity = json.loads(guard_identity_raw)
          if guard_identity.get("login") != "John-MiracleWorker":
              raise SystemExit("final observations are not owner authenticated")
          repository = json.loads(root.joinpath("repository.json").read_bytes())
          run = json.loads(root.joinpath("run.json").read_bytes())
          workflow_api = json.loads(root.joinpath("workflow-api.json").read_bytes())
          ruleset_pages = json.loads(root.joinpath("rulesets-pages.json").read_bytes())
          lock_matches = [
              item
              for page in ruleset_pages
              for item in page
              if item.get("name") == "kestrel-release-transaction-main-lock"
          ]
          if len(lock_matches) != 1:
              raise SystemExit("active main transaction lock is not a singleton")

          github_opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "kestrel-release-transaction/1",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def github_get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/{path}", headers=github_headers
              )
              with github_opener.open(request, timeout=30) as response:
                  return json.loads(response.read(receipts.MAX_SOURCE_BODY_BYTES + 1))

          workflow_request = urllib.request.Request(
              (
                  "https://api.github.com/repos/"
                  f"{os.environ['PROMOTION_REPOSITORY']}/contents/"
                  ".github/workflows/release.yml?ref=main"
              ),
              headers={
                  **github_headers,
                  "Accept": "application/vnd.github.raw+json",
              },
          )
          with github_opener.open(workflow_request, timeout=30) as response:
              workflow_raw = response.read(receipts.MAX_SOURCE_BODY_BYTES + 1)
          if len(workflow_raw) > receipts.MAX_SOURCE_BODY_BYTES:
              raise SystemExit("default release workflow exceeds the evidence boundary")
          root.joinpath("default-release-workflow.yml").write_bytes(workflow_raw)

          lock = github_get(
              f"repos/{os.environ['PROMOTION_REPOSITORY']}/rulesets/"
              f"{lock_matches[0]['id']}"
          )
          workflow = {
              "id": workflow_api["id"],
              "path": workflow_api["path"],
              "state": workflow_api["state"],
              "default_branch": repository["default_branch"],
          }
          run_body = {
              "schema": "kestrel.promotion_run_observation.v1",
              "repository_id": int(os.environ["PROMOTION_REPOSITORY_ID"]),
              "workflow_id": run["workflow_id"],
              "workflow_path": ".github/workflows/release.yml",
              "run_id": run["id"],
              "run_attempt": run["run_attempt"],
              "event": run["event"],
              "ref": os.environ["PROMOTION_REF"],
              "head_sha": run["head_sha"],
              "workflow_sha": os.environ["PROMOTION_WORKFLOW_SHA"],
              "actor": {"login": run["actor"]["login"], "id": run["actor"]["id"]},
              "triggering_actor": {
                  "login": run["triggering_actor"]["login"],
                  "id": run["triggering_actor"]["id"],
              },
              "captured_at": (
                  datetime.now(UTC)
                  .replace(microsecond=0)
                  .isoformat()
                  .replace("+00:00", "Z")
              ),
              "complete": True,
          }
          registry = json.loads(
              Path("transaction/capsule/release-control-source-registry.json").read_bytes()
          )

          def source(name, raw, *, owner=True):
              value = receipts.capture_source(
                  registry=registry,
                  receipt_schema=receipts.SOURCE_OBSERVATION_SCHEMA,
                  phase="release-control",
                  mode=None,
                  name=name,
                  raw_input=raw,
                  identity_observation=guard_identity_raw if owner else None,
              )
              return value

          run_source = source(
              "promotion-run-observation",
              receipts.canonical_external_json_bytes(run_body),
          )
          root.joinpath("promotion-run-observation.json").write_bytes(
              receipts.canonical_json_bytes(run_source)
          )
          sources = [
              source(
                  "default-branch-workflow-contents",
                  root.joinpath("default-release-workflow.yml").read_bytes(),
              ),
              source(
                  "ingress-ruleset-detail-observation",
                  receipts.canonical_external_json_bytes(lock),
              ),
              source(
                  "workflow-observation",
                  receipts.canonical_external_json_bytes(workflow),
              ),
          ]

          def write_final_observations():
              final = {
                  "schema": "kestrel.release_final_observations.v2",
                  "sources": sorted(sources, key=lambda item: item["name"]),
              }
              root.joinpath("fresh-final-observations.json").write_bytes(
                  receipts.canonical_json_bytes(final)
              )

          # Preserve a complete base lock/ingress observation before any optional
          # product scan can fail. Reconciliation can then emit a canonical,
          # lock-false record without inventing missing product evidence.
          write_final_observations()

          product_available = all(
              input_root.joinpath(name).is_file()
              for name in (
                  "candidate-manifest.json",
                  "release-authorization.json",
                  "recovery-capsule-verification.json",
              )
          )
          if product_available:
              bundle = input_root
              manifest = json.loads(input_root.joinpath("candidate-manifest.json").read_bytes())
              candidate, _repository_id = receipts._candidate_from_manifest(  # noqa: SLF001
                  input_root.joinpath("candidate-manifest.json").read_bytes()
              )
              release_wrapper_raw, release_items = transaction._boundary_paginated_source(  # noqa: SLF001
                  transaction.DirectGitHubReadAPI(
                      token=os.environ["GH_TOKEN"].encode("ascii")
                  ),
                  request_target=(
                      "GET /repos/John-MiracleWorker/Kestrel/releases?per_page=100"
                  ),
                  locator=(
                      "GET /repos/John-MiracleWorker/Kestrel/releases?per_page=100"
                  ),
                  label="final Release listing",
              )
              sources.append(
                  source(
                      "final-release-list-observation",
                      release_wrapper_raw,
                  )
              )

              try:
                  tag_ref = github_get(
                      f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/ref/tags/"
                      + urllib.parse.quote(candidate["tag"], safe="")
                  )
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  tag_observation = {"http_status": 404, "ref": None, "tag": None}
              else:
                  target = tag_ref.get("object", {})
                  tag_object = (
                      github_get(
                          f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/tags/"
                          f"{target.get('sha')}"
                      )
                      if target.get("type") == "tag"
                      else None
                  )
                  tag_observation = {
                      "http_status": 200,
                      "ref": tag_ref,
                      "tag": tag_object,
                  }
              sources.append(
                  source(
                      "tag-observation",
                      receipts.canonical_external_json_bytes(tag_observation),
                  )
              )

              descriptor = json.loads(
                  input_root.joinpath("containers/oci-descriptor.json").read_bytes()
              )
              expected_digests = transaction._expected_oci_object_digests(  # noqa: SLF001
                  input_root
              )
              manifest_digests = {
                  descriptor["index_digest"],
                  *(item["manifest_digest"] for item in descriptor["platforms"]),
              }
              bearer = transaction.fetch_ghcr_pull_token(
                  os.environ["GHCR_READ_TOKEN"].encode("ascii")
              )
              registry_api = transaction.DirectOCIReadAPI(
                  token=bearer.encode("ascii")
              )
              tags_by_digest = transaction._ghcr_tags_by_digest_from_package_versions(  # noqa: SLF001
                  json.loads(root.joinpath("ghcr-package-versions.json").read_bytes())
              )
              package_present = transaction._ghcr_package_is_present(  # noqa: SLF001
                  json.loads(root.joinpath("ghcr-packages.json").read_bytes())
              )
              objects = []
              for digest in expected_digests:
                  kind = "manifests" if digest in manifest_digests else "blobs"
                  observation = registry_api.read_digest(
                      kind=kind,
                      digest=digest,
                      max_bytes=2_147_483_648,
                  )
                  objects.append(
                      {
                          "digest": digest,
                          "http_status": observation.http_status,
                          "tags": tags_by_digest.get(digest, []),
                          "tag_inventory_complete": (
                              observation.http_status == 404
                              or kind == "blobs"
                              or digest in tags_by_digest
                          ),
                          "observed_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                              "+00:00", "Z"
                          ),
                      }
                  )
              ghcr = {
                  "repository": descriptor["repository"],
                  "package_present": package_present,
                  "objects": objects,
              }
              sources.append(
                  source(
                      "final-ghcr-observation",
                      receipts.canonical_external_json_bytes(ghcr),
                  )
              )

              common = [
                  "--repo",
                  os.environ["PROMOTION_REPOSITORY"],
                  "--signer-workflow",
                  f"{os.environ['PROMOTION_REPOSITORY']}/.github/workflows/release.yml",
                  "--signer-digest",
                  candidate["source_sha"],
                  "--source-digest",
                  candidate["source_sha"],
                  "--predicate-type",
                  transaction._RELEASE_PROMOTION_PREDICATE_TYPE,  # noqa: SLF001
                  "--deny-self-hosted-runners",
                  "--format",
                  "json",
              ]
              attestation_subjects = []
              for subject in manifest["attestation_subjects"]:
                  target = (
                      str((input_root / subject["name"]).resolve(strict=True))
                      if subject["kind"] == "file"
                      else f"oci://{subject['name']}@{subject['digest']}"
                  )
                  attestation_subjects.append(
                      transaction._observe_promotion_attestation_subject(  # noqa: SLF001
                          subject=subject,
                          target=target,
                          pinned_gh=Path(os.environ["PINNED_GH"]),
                          repository=os.environ["PROMOTION_REPOSITORY"],
                          expected_repository_id=manifest["source"]["repository_id"],
                          common_arguments=common,
                          token=os.environ["GH_TOKEN"],
                          label="final attestation",
                      )
                  )
              raw_attestations = {"subjects": attestation_subjects}
              transaction_digest = receipts._sha256(  # noqa: SLF001
                  input_root.joinpath("release-authorization.json").read_bytes()
              )
              capsule_digest = json.loads(
                  input_root.joinpath("recovery-capsule-verification.json").read_bytes()
              )["verification"]["capsule_manifest_digest"]
              release_contract = transaction._candidate_product_release_contract(  # noqa: SLF001
                  manifest,
                  transaction_authorization_digest=transaction_digest,
                  recovery_capsule_digest=capsule_digest,
              )
              predicate_context = transaction._release_promotion_predicate_context(  # noqa: SLF001
                  manifest=manifest,
                  transaction_authorization_digest=transaction_digest,
                  release_listing=[release_items],
                  release_contract=release_contract,
                  ghcr_observation=ghcr,
                  expected_oci_digests=expected_digests,
              )
              attestations = transaction.authorize_promotion_attestation_observation(
                  raw_attestations,
                  manifest=manifest,
                  expected_context=predicate_context,
                  recovery_capsule_digest=capsule_digest,
                  api=transaction.DirectGitHubReadAPI(
                      token=os.environ[
                          "RELEASE_RECOVERY_READER_TOKEN_BYTES"
                      ].encode("ascii")
                  ),
              )
              sources.append(
                  source(
                      "final-attestation-observation",
                      receipts.canonical_external_json_bytes(attestations),
                  )
              )

              pypi_opener = urllib.request.build_opener(
                  urllib.request.ProxyHandler({}),
                  urllib.request.HTTPSHandler(context=ssl.create_default_context()),
              )
              with pypi_opener.open(
                  urllib.request.Request(
                      "https://pypi.org/pypi/nested-memvid-agent/json",
                      headers={"Accept": "application/json", "User-Agent": "kestrel/0.6"},
                  ),
                  timeout=30,
              ) as response:
                  project_raw = response.read(receipts.MAX_SOURCE_BODY_BYTES + 1)
              project = receipts.parse_external_json_bytes(
                  project_raw, label="final PyPI project observation"
              )
              expected_files = transaction._candidate_pypi_files(manifest)  # noqa: SLF001
              pypi_state = transaction._classify_pypi_project_observation(  # noqa: SLF001
                  project, version=manifest["version"], expected_files=expected_files
              )
              observed_files = {
                  item["filename"]: item
                  for item in project["releases"].get(manifest["version"], [])
              }
              integrity_files = []
              verification_files = []
              if not pypi_state["missing"]:
                  persisted_root = root / "pypi"
                  persisted_root.mkdir(mode=0o700, exist_ok=True)
                  for filename in pypi_state["present"]:
                      expected = expected_files[filename]
                      local_path = persisted_root / filename
                      with pypi_opener.open(
                          urllib.request.Request(
                              observed_files[filename]["url"],
                              headers={
                                  "Accept": "application/octet-stream",
                                  "User-Agent": "kestrel/0.6",
                              },
                          ),
                          timeout=120,
                      ) as response:
                          distribution_raw = response.read(expected["size_bytes"] + 1)
                      if (
                          len(distribution_raw) != expected["size_bytes"]
                          or "sha256:" + hashlib.sha256(distribution_raw).hexdigest()
                          != expected["sha256"]
                      ):
                          raise SystemExit("final PyPI distribution conflicts with candidate")
                      local_path.write_bytes(distribution_raw)
                      provenance_url = (
                          "https://pypi.org/integrity/nested-memvid-agent/"
                          f"{manifest['version']}/"
                          f"{urllib.parse.quote(filename, safe='')}/provenance"
                      )
                      with pypi_opener.open(
                          urllib.request.Request(
                              provenance_url,
                              headers={
                                  "Accept": "application/json",
                                  "User-Agent": "kestrel/0.6",
                              },
                          ),
                          timeout=30,
                      ) as response:
                          provenance_raw = response.read(
                              receipts.MAX_SOURCE_BODY_BYTES + 1
                          )
                      if len(provenance_raw) > receipts.MAX_SOURCE_BODY_BYTES:
                          raise SystemExit(
                              "final PyPI provenance exceeds the evidence boundary"
                          )
                      provenance = receipts.parse_external_json_bytes(
                          provenance_raw, label="final PyPI provenance"
                      )
                      provenance_path = persisted_root / f"{filename}.provenance.json"
                      provenance_path.write_bytes(provenance_raw)
                      verified = subprocess.run(
                          [
                              os.environ["PYPI_ATTESTATIONS"],
                              "verify",
                              "pypi",
                              "--offline",
                              "--repository",
                              "https://github.com/John-MiracleWorker/Kestrel",
                              "--provenance-file",
                              str(provenance_path),
                              str(local_path),
                          ],
                          capture_output=True,
                          check=False,
                          env={
                              "LANG": "C.UTF-8",
                              "LC_ALL": "C.UTF-8",
                              "PYTHONNOUSERSITE": "1",
                          },
                      )
                      if verified.returncode != 0:
                          raise SystemExit("final PyPI provenance verification failed")
                      transaction._verify_pypi_integrity_provenance(  # noqa: SLF001
                          provenance,
                          filename=filename,
                          expected_digest=expected["sha256"],
                      )
                      integrity_files.append(
                          {
                              "filename": filename,
                              "provenance_response_base64": base64.b64encode(
                                  provenance_raw
                              ).decode("ascii"),
                          }
                      )
                      verification_files.append(
                          {
                              "filename": filename,
                              "distribution_sha256": expected["sha256"],
                              "provenance_sha256": receipts._sha256(  # noqa: SLF001
                                  provenance_raw
                              ),
                              "exit_code": 0,
                          }
                      )
              integrity = {
                  "schema": "pypi.integrity_observations.v1",
                  "files": integrity_files,
              }
              provenance_verifications = {
                  "schema": "pypi.provenance_verifications.v1",
                  "tool": {"name": "pypi-attestations", "version": "0.0.30"},
                  "files": verification_files,
              }
              sources.extend(
                  [
                      source(
                          "final-pypi-integrity-observations",
                          receipts.canonical_external_json_bytes(integrity),
                          owner=False,
                      ),
                      source(
                          "final-pypi-project-observation",
                          receipts.canonical_external_json_bytes(project),
                          owner=False,
                      ),
                      source(
                          "final-pypi-provenance-verifications",
                          receipts.canonical_external_json_bytes(
                              provenance_verifications
                          ),
                          owner=False,
                      ),
                  ]
              )
          write_final_observations()
          PY
          kestrel-final-observation

      - name: Reconcile the transaction without inventing authority
        id: reconcile-transaction
        if: ${{ always() }}
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          IDENTITY_RESULT: ${{ needs.identity-admission.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorize-release.result }}
          PREPARATION_RESULT: ${{ needs.prepare-github-ghcr.result }}
          COMMIT_RESULT: ${{ needs.commit-github-release.result }}
          VERIFICATION_RESULT: ${{ needs.verify-github-ghcr.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
          OBSERVATION_OUTCOME: ${{ steps.observe-final-surfaces.outcome }}
          CAPSULE_BINDING_OUTCOME: ${{ steps.verify-reconciliation-capsule-binding.outcome }}
          FINAL_AUTHORITY_OUTCOME: ${{ steps.revalidate-final-authority.outcome }}
          FINAL_BOUNDARY_OUTCOME: ${{ steps.capture-final-boundary.outcome }}
          FINAL_BINDING_OUTCOME: ${{ steps.verify-final-binding.outcome }}
          FINAL_BOUND: ${{ steps.verify-final-binding.outputs.bound }}
        run: |
          if test "${{ steps.activate-reconciliation-capsule.outputs.active }}" != 1; then
            printf '%s\n' recovery_capsule_unavailable \
              > reconciliation/reconciliation-failure-code.txt
            cp -- \
              reconciliation/reconciliation-fallback.json \
              reconciliation/release-reconciliation.json
            exit 0
          fi
          if test "${{ steps.normalize-reconciliation-inputs.outputs.core_available }}" != 1; then
            printf '%s\n' reconciliation_input_missing \
              > reconciliation/reconciliation-failure-code.txt
            exit 0
          fi
          if ! test -f reconciliation/final/promotion-run-observation.json || \
             ! test -f reconciliation/final/fresh-final-observations.json; then
            printf '%s\n' final_base_observation_missing \
              > reconciliation/reconciliation-failure-code.txt
            exit 0
          fi
          final_freshness_current=1
          if ! "$KESTREL_PYTHON" - <<'PY'
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          transaction.require_final_reconciliation_freshness_budget(
              Path("reconciliation/final-freshness-budget.json")
          )
          PY
          then
            final_freshness_current=0
          fi
          failure_code=none
          for result in \
            "$IDENTITY_RESULT" \
            "$AUTHORIZATION_RESULT" \
            "$PREPARATION_RESULT" \
            "$COMMIT_RESULT" \
            "$VERIFICATION_RESULT" \
            "$PYPI_RESULT"
          do
            if test "$result" != success; then
              failure_code=upstream_stage_failed
            fi
          done
          if test "$OBSERVATION_OUTCOME" != success; then
            failure_code=final_observation_failed
          fi
          if test "${{ steps.normalize-reconciliation-inputs.outputs.product_available }}" = 1 && \
             test "$CAPSULE_BINDING_OUTCOME" != success; then
            failure_code=recovery_capsule_binding_failed
          fi
          if test "$final_freshness_current" != 1 && test "$failure_code" = none; then
            failure_code=final_freshness_budget_exhausted
          fi
          arguments=(
            --run-observation reconciliation/final/promotion-run-observation.json
            --dispatch-identity reconciliation/input/dispatch-identity.json
            --dispatch-intent reconciliation/input/dispatch-intent.json
            --dispatch-reconciliation reconciliation/input/dispatch-reconciliation.json
            --fresh-observations reconciliation/final/fresh-final-observations.json
            --failure-code "$failure_code"
            --output reconciliation/release-reconciliation.json
          )
          if test "$OBSERVATION_OUTCOME" = success && \
             test "${{ steps.normalize-reconciliation-inputs.outputs.product_available }}" = 1; then
            arguments+=(
              --manifest reconciliation/input/candidate-manifest.json
              --transaction-authorization reconciliation/input/release-authorization.json
              --recovery-capsule-verification \
                reconciliation/input/recovery-capsule-verification.json
            )
            if test "${{ steps.normalize-reconciliation-inputs.outputs.execution_available }}" = 1; then
              arguments+=(
                --execution-authorization \
                  reconciliation/input/release-execution-authorization.json
              )
            fi
            if test "${{ steps.normalize-reconciliation-inputs.outputs.stages_available }}" = 1; then
              arguments+=(--stage-records reconciliation/stages)
            fi
          fi
          if test "$failure_code" = none && \
             test "$FINAL_AUTHORITY_OUTCOME" = success && \
             test "$FINAL_BOUNDARY_OUTCOME" = success && \
             test "$FINAL_BINDING_OUTCOME" = success && \
             test "$FINAL_BOUND" = 1 && \
             test "$final_freshness_current" = 1; then
            arguments+=(
              --final-github-authority-verification \
                reconciliation/input/github-commit-authority-verification.json
              --final-boundary-root reconciliation/final-boundary
            )
          fi
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction reconcile "${arguments[@]}"

      - name: Upload final reconciliation and retained-lock evidence
        id: upload-reconciliation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-release-reconciliation-${{ github.run_id }}-1
          path: reconciliation
          if-no-files-found: error
          retention-days: 30

      - name: Require terminal reconciliation after a successful transaction
        if: ${{ always() }}
        shell: bash
        env:
          IDENTITY_RESULT: ${{ needs.identity-admission.result }}
          AUTHORIZATION_RESULT: ${{ needs.authorize-release.result }}
          PREPARATION_RESULT: ${{ needs.prepare-github-ghcr.result }}
          COMMIT_RESULT: ${{ needs.commit-github-release.result }}
          VERIFICATION_RESULT: ${{ needs.verify-github-ghcr.result }}
          PYPI_RESULT: ${{ needs.publish-pypi.result }}
          RECONCILE_OUTCOME: ${{ steps.reconcile-transaction.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-reconciliation.outcome }}
        run: |
          test "$UPLOAD_OUTCOME" = success
          upstream_success=true
          for result in \
            "$IDENTITY_RESULT" \
            "$AUTHORIZATION_RESULT" \
            "$PREPARATION_RESULT" \
            "$COMMIT_RESULT" \
            "$VERIFICATION_RESULT" \
            "$PYPI_RESULT"
          do
            if test "$result" != success; then
              upstream_success=false
            fi
          done
          if test "$upstream_success" = true; then
            test "$RECONCILE_OUTCOME" = success
            test -f reconciliation/release-reconciliation.json
            "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path("reconciliation/release-reconciliation.json").read_bytes()
          )
          if (
              value.get("completed") is not True
              or value.get("lock_release_permitted") is not True
              or value.get("validation_status") != "validated"
          ):
              raise SystemExit("terminal reconciliation did not prove safe lock release")
          PY
          fi
