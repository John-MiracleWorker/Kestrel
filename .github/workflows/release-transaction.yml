      - name: Revalidate preparation authority immediately before mutation
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          "$KESTREL_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          original_path = Path("transaction/release-authorization.json")
          original_raw = original_path.read_bytes()
          original = transaction.validate_server_authorization(
              json.loads(original_raw),
              expected_original_transaction_digest=None,
          )
          if original["authorization_kind"] != "transaction":
              raise SystemExit("preparation lacks the original transaction authorization")
          current_authorization = original
          transaction_digest = None
          capsule_digest = None
          marker_digest = None
          execution_path = Path("transaction/release-execution-authorization.json")
          if os.environ["PROMOTION_MODE"] == "initiate":
              if execution_path.exists():
                  raise SystemExit("initiation preparation has execution authority")
          else:
              transaction_digest = receipts._sha256(original_raw)  # noqa: SLF001
              execution = transaction.validate_server_authorization(
                  json.loads(execution_path.read_bytes()),
                  expected_original_transaction_digest=transaction_digest,
              )
              if execution["authorization_kind"] != "execution":
                  raise SystemExit("recovery preparation lacks execution authority")
              if execution["candidate"] != original["candidate"]:
                  raise SystemExit("recovery execution authority changed candidate")
              if execution["bindings"]["transaction_authorization_digest"] != transaction_digest:
                  raise SystemExit("recovery execution authority changed transaction")
              current_authorization = execution
              capsule_digest = execution["bindings"][
                  "recovery_capsule_manifest_digest"
              ]
              marker_digest = execution["bindings"]["commit_marker_digest"]

          verification = json.loads(
              Path(
                  "transaction/authority-evidence/"
                  "github-admission-authority-verification.json"
              ).read_bytes()
          )
          admission_authority = transaction._verified_authority_from_record(  # noqa: SLF001
              verification,
              verification_schema="kestrel.github_release_authority_verification.v1",
              authority_schema=receipts.GITHUB_AUTHORITY_SCHEMA,
              label="preparation admission authority verification",
          )
          transaction._require_current_authority(  # noqa: SLF001
              admission_authority,
              label="preparation admission authority immediately before mutation",
          )
          admission_summary = {
              "receipt_digest": verification["receipt_digest"],
              "signature_digest": verification["signature_digest"],
              "verification_digest": receipts._sha256(  # noqa: SLF001
                  receipts.canonical_json_bytes(verification)
              ),
          }
          if current_authorization["admission_authority"] != admission_summary:
              raise SystemExit("preparation admission authority changed after authorization")
          transaction._require_authorization_admission_authority(  # noqa: SLF001
              admission_authority,
              candidate=current_authorization["candidate"],
              transaction_authorization_digest=transaction_digest,
              recovery_capsule_digest=capsule_digest,
              commit_marker_digest=marker_digest,
          )
          PY

      - name: Execute only the authorized preparation plan
        id: execute-preparation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_WRITE_TOKEN: ${{ github.token }}
        run: |
          set +e
          "$KESTREL_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.parse
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/stages")
          bundle = Path("transaction/candidate")
          plan = json.loads(root.joinpath("release-preparation-plan.json").read_bytes())
          transaction._validated_stage_plan(plan, stage=1)  # noqa: SLF001
          operations = {item["operation"]: item for item in plan["operations"]}
          attempted = []
          failure = None
          created_release_id = None

          def run_gh(arguments, body=None, token=None):
              completed = subprocess.run(
                  [os.environ["PINNED_GH"], *arguments],
                  input=body,
                  capture_output=True,
                  check=False,
                  env={
                      "GH_TOKEN": token or os.environ["GH_TOKEN"],
                      "GH_PROMPT_DISABLED": "1",
                      "NO_COLOR": "1",
                  },
              )
              if completed.returncode != 0:
                  raise RuntimeError("pinned GitHub CLI mutation failed")
              return completed.stdout

          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          contract = transaction._candidate_product_release_contract(  # noqa: SLF001
              manifest,
              transaction_authorization_digest=plan["transaction_authorization_digest"],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          )
          pre_release_listing = json.loads(root.joinpath("prepare-release-list.json").read_bytes())
          release_state = transaction._classify_product_release_listing(  # noqa: SLF001
              pre_release_listing, contract=contract
          )
          missing_assets = transaction._missing_product_release_assets(  # noqa: SLF001
              pre_release_listing, contract=contract
          )
          pre_ghcr = json.loads(root.joinpath("prepare-ghcr.json").read_bytes())
          expected_digests = transaction._expected_oci_object_digests(bundle)  # noqa: SLF001
          missing_oci_digests = transaction._missing_ghcr_object_digests(  # noqa: SLF001
              pre_ghcr, expected_digests=expected_digests
          )
          create_operation_request_digest = (
              transaction.release_stage_operation_request_digest(
                  candidate=plan["candidate"],
                  operation="create_github_release_draft",
                  request=contract["create_request"],
                  transaction_authorization_digest=plan[
                      "transaction_authorization_digest"
                  ],
                  recovery_capsule_digest=plan["recovery_capsule_digest"],
              )
          )
          requests = {
              "create_github_release_draft": contract["create_request"],
              "upload_github_release_assets": (
                  transaction._product_release_asset_upload_request(  # noqa: SLF001
                      contract=contract,
                      release_state=release_state,
                      missing_assets=missing_assets,
                      create_operation_request_digest=(
                          create_operation_request_digest
                      ),
                  )
              ),
              "publish_ghcr_digests": {
                  "repository": transaction.candidates.OCI_REPOSITORY,
                  "digests": missing_oci_digests,
              },
          }
          for operation, request in requests.items():
              expected_request_digest = transaction.release_stage_operation_request_digest(
                  candidate=plan["candidate"],
                  operation=operation,
                  request=request,
                  transaction_authorization_digest=plan[
                      "transaction_authorization_digest"
                  ],
                  recovery_capsule_digest=plan["recovery_capsule_digest"],
              )
              if expected_request_digest != operations[operation]["request_digest"]:
                  raise SystemExit("preparation mutation request differs from its plan")
          try:
              release_operation = operations["create_github_release_draft"]
              if release_operation["action"] == "create":
                  attempted.append("create_github_release_draft")
                  created_release = json.loads(
                      run_gh(
                          [
                              "api",
                              "--method",
                              "POST",
                              f"repos/{os.environ['PROMOTION_REPOSITORY']}/releases",
                              "--input",
                              "-",
                          ],
                          receipts.canonical_external_json_bytes(
                              contract["create_request"]
                          ),
                      )
                  )
                  created_state = transaction._classify_product_release_listing(  # noqa: SLF001
                      [[created_release]], contract=contract
                  )
                  created_release_id = created_state["release_id"]
                  if not isinstance(created_release_id, int):
                      raise RuntimeError("created draft Release response lacks an exact ID")

              listed = json.loads(
                  run_gh(
                      [
                          "api",
                          "--paginate",
                          "--slurp",
                          f"repos/{os.environ['PROMOTION_REPOSITORY']}/releases?per_page=100",
                      ]
                  )
              )
              state = transaction._classify_product_release_listing(  # noqa: SLF001
                  listed, contract=contract
              )
              authorized_release_id = (
                  transaction._resolve_product_release_asset_upload_target(  # noqa: SLF001
                      requests["upload_github_release_assets"],
                      release_state=state,
                      created_release_id=created_release_id,
                      create_operation_request_digest=(
                          create_operation_request_digest
                      ),
                  )
              )
              if operations["upload_github_release_assets"]["action"] == "create":
                  attempted.append("upload_github_release_assets")
                  for asset in missing_assets:
                      path = bundle / asset["path"]
                      raw = path.read_bytes()
                      if (
                          len(raw) != asset["size_bytes"]
                          or "sha256:" + hashlib.sha256(raw).hexdigest() != asset["sha256"]
                      ):
                          raise RuntimeError("candidate Release asset changed before upload")
                      run_gh(
                          [
                              "api",
                              "--method",
                              "POST",
                              "-H",
                              f"Content-Type: {asset['media_type']}",
                              "--input",
                              "-",
                              (
                                  "https://uploads.github.com/repos/"
                                  f"{os.environ['PROMOTION_REPOSITORY']}/releases/"
                                  f"{authorized_release_id}/assets"
                                  f"?name={urllib.parse.quote(asset['name'], safe='')}"
                              ),
                          ],
                          raw,
                      )
                      observed_release = json.loads(
                          run_gh(
                              [
                                  "api",
                                  f"repos/{os.environ['PROMOTION_REPOSITORY']}/releases/"
                                  f"{authorized_release_id}",
                              ]
                          )
                      )
                      observed_state = transaction._classify_product_release_listing(  # noqa: SLF001
                          [[observed_release]], contract=contract
                      )
                      observed_names = {
                          item["name"] for item in observed_release.get("assets", [])
                      }
                      if (
                          observed_state["release_id"] != authorized_release_id
                          or asset["name"] not in observed_names
                      ):
                          raise RuntimeError(
                              "uploaded Release asset is not exact by Release ID"
                          )

              if operations["publish_ghcr_digests"]["action"] == "create":
                  attempted.append("publish_ghcr_digests")
                  descriptor = json.loads(
                      bundle.joinpath("containers/oci-descriptor.json").read_bytes()
                  )
                  bearer = transaction.fetch_ghcr_push_token(
                      os.environ["GHCR_WRITE_TOKEN"].encode("ascii"),
                      principal=os.environ["PROMOTION_ACTOR"],
                  )
                  registry_writer = transaction.DirectOCIWriteAPI(
                      token=bearer.encode("ascii"),
                      timeout_seconds=120.0,
                  )
                  registry_reader = transaction.DirectOCIReadAPI(
                      token=bearer.encode("ascii"),
                      timeout_seconds=60.0,
                  )
                  blob_root = bundle / "containers/oci-layout/blobs/sha256"
                  manifests = [
                      (item["manifest_digest"], blob_root / item["manifest_digest"].split(":")[1])
                      for item in descriptor["platforms"]
                  ]
                  manifest_digests = {digest for digest, _path in manifests}
                  for path in sorted(blob_root.iterdir()):
                      digest = f"sha256:{path.name}"
                      if digest in manifest_digests or digest not in missing_oci_digests:
                          continue
                      registry_writer.upload_blob(
                          digest=digest,
                          content=path.read_bytes(),
                      )
                      observed = registry_reader.read_digest(
                          kind="blobs", digest=digest, max_bytes=2_147_483_648
                      )
                      if observed.http_status != 200:
                          raise RuntimeError("uploaded GHCR blob is not observable by digest")
                  manifests.append(
                      (
                          descriptor["index_digest"],
                          bundle / "containers/oci-layout/index.json",
                      )
                  )
                  for digest, path in manifests:
                      if digest not in missing_oci_digests:
                          continue
                      raw = path.read_bytes()
                      media_type = json.loads(raw)["mediaType"]
                      registry_writer.put_manifest(
                          digest=digest,
                          media_type=media_type,
                          content=raw,
                      )
                      observed = registry_reader.read_digest(
                          kind="manifests", digest=digest, max_bytes=2_147_483_648
                      )
                      if observed.http_status != 200:
                          raise RuntimeError(
                              "uploaded GHCR manifest is not observable by digest"
                          )
          except Exception as error:  # preserve remote ambiguity for the post-observation
              failure = type(error).__name__
          root.joinpath("prepare-attempt.json").write_bytes(
              receipts.canonical_json_bytes(
                  {
                      "attempted": sorted(attempted),
                      "created_release_id": created_release_id,
                      "failure": failure,
                  }
              )
          )
          if failure is not None:
              raise SystemExit(1)
          PY
          status=$?
          printf '%s\n' "$status" > transaction/stages/prepare-exit-status
          exit "$status"

      - name: Record preparation outcome from fresh post-state
        id: record-preparation
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          if test ! -f transaction/stages/release-preparation-plan.json; then
            exit 1
          fi
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_REPOSITORY}/releases?per_page=100" \
            > transaction/stages/prepare-post-release-list.json
          # A fresh digest inventory is required after every attempt. Reuse of a
          # pre-mutation observation is forbidden even when the plan was a no-op.
          "$KESTREL_PYTHON" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/stages")
          bundle = Path("transaction/candidate")
          descriptor = json.loads((bundle / "containers/oci-descriptor.json").read_bytes())
          expected_digests = transaction._expected_oci_object_digests(bundle)  # noqa: SLF001
          manifest_digests = {
              descriptor["index_digest"],
              *(item["manifest_digest"] for item in descriptor["platforms"]),
          }
          bearer = transaction.fetch_ghcr_pull_token(
              os.environ["GHCR_READ_TOKEN"].encode("ascii")
          )
          registry_api = transaction.DirectOCIReadAPI(
              token=bearer.encode("ascii")
          )

          def run_gh_json(arguments):
              completed = subprocess.run(
                  [os.environ["PINNED_GH"], *arguments],
                  capture_output=True,
                  check=False,
                  env={
                      "GH_TOKEN": os.environ["GH_TOKEN"],
                      "GH_PROMPT_DISABLED": "1",
                      "NO_COLOR": "1",
                  },
              )
              if completed.returncode != 0:
                  raise RuntimeError("pinned GitHub CLI GHCR observation failed")
              return receipts.parse_external_json_bytes(
                  completed.stdout, label="fresh GHCR package API observation"
              )

          def observe_ghcr():
              packages = run_gh_json(
                  [
                      "api",
                      "--paginate",
                      "--slurp",
                      "users/John-MiracleWorker/packages?package_type=container&per_page=100",
                  ]
              )
              package_present = transaction._ghcr_package_is_present(  # noqa: SLF001
                  packages
              )
              versions = (
                  run_gh_json(
                      [
                          "api",
                          "--paginate",
                          "--slurp",
                          "users/John-MiracleWorker/packages/container/kestrel/versions?per_page=100",
                      ]
                  )
                  if package_present
                  else [[]]
              )
              tags_by_digest = transaction._ghcr_tags_by_digest_from_package_versions(  # noqa: SLF001
                  versions
              )
              objects = []
              for digest in expected_digests:
                  kind = "manifests" if digest in manifest_digests else "blobs"
                  observation = registry_api.read_digest(
                      kind=kind,
                      digest=digest,
                      max_bytes=2_147_483_648,
                  )
                  objects.append(
                      {
                          "digest": digest,
                          "http_status": observation.http_status,
                          "tags": tags_by_digest.get(digest, []),
                          "tag_inventory_complete": (
                              observation.http_status == 404
                              or kind == "blobs"
                              or digest in tags_by_digest
                          ),
                          "observed_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                              "+00:00", "Z"
                          ),
                      }
                  )
              return {
                  "repository": descriptor["repository"],
                  "package_present": package_present,
                  "objects": objects,
              }

          post_ghcr = transaction.wait_for_ghcr_digest_convergence(
              observe=observe_ghcr,
              expected_digests=expected_digests,
          )
          root.joinpath("prepare-post-ghcr.json").write_bytes(
              receipts.canonical_json_bytes(post_ghcr)
          )
          attempt = (
              json.loads(root.joinpath("prepare-attempt.json").read_bytes())
              if root.joinpath("prepare-attempt.json").is_file()
              else {"attempted": [], "failure": "stage_not_started"}
          )
          plan = json.loads(root.joinpath("release-preparation-plan.json").read_bytes())
          manifest = json.loads(
              Path("transaction/candidate/candidate-manifest.json").read_bytes()
          )
          contract = transaction._candidate_product_release_contract(  # noqa: SLF001
              manifest,
              transaction_authorization_digest=plan["transaction_authorization_digest"],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          )
          release_raw = root.joinpath("prepare-post-release-list.json").read_bytes()
          release_pages = json.loads(release_raw)
          release_state = transaction._classify_product_release_listing(  # noqa: SLF001
              release_pages, contract=contract
          )
          ghcr_state = transaction._classify_ghcr_digest_observation(  # noqa: SLF001
              post_ghcr, expected_digests=expected_digests
          )
          states = {
              "create_github_release_draft": (
                  "existing_exact" if release_state["release"] != "missing" else "missing"
              ),
              "upload_github_release_assets": release_state["assets"],
              "publish_ghcr_digests": ghcr_state,
          }
          observation_raw = receipts.canonical_json_bytes(
              {"release": release_pages, "ghcr": post_ghcr}
          )
          observation_digest = receipts._sha256(observation_raw)  # noqa: SLF001
          outcomes = []
          for operation in plan["operations"]:
              name = operation["operation"]
              if operation["action"] == "no_op":
                  outcome = (
                      "existing_exact" if states[name] == "existing_exact" else "unknown"
                  )
              elif states[name] == "existing_exact" and attempt["failure"] is None:
                  outcome = "created"
              elif name in attempt["attempted"]:
                  outcome = "unknown"
              else:
                  outcome = "not_attempted"
              outcomes.append(
                  {
                      "operation": name,
                      "request_digest": operation["request_digest"],
                      "response_observation_digest": observation_digest,
                      "outcome": outcome,
                  }
              )
          completed = all(item["outcome"] in {"created", "existing_exact"} for item in outcomes)
          uncertain = any(item["outcome"] == "unknown" for item in outcomes)
          pending = any(item["outcome"] == "not_attempted" for item in outcomes)
          envelope = {
              "schema": receipts.SOURCE_OBSERVATION_SCHEMA,
              "name": "final-release-list-observation",
              "provider": "github.com",
              "locator": "GET /repos/John-MiracleWorker/Kestrel/releases?per_page=100",
              "authenticated_as": "John-MiracleWorker",
              "freshness_class": "current",
              "captured_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                  "+00:00", "Z"
              ),
              "page_count": len(release_pages),
              "record_count": sum(len(page) for page in release_pages),
              "complete": True,
              "body_encoding": "base64",
              "body": base64.b64encode(release_raw).decode("ascii"),
          }
          envelope_raw = receipts.canonical_json_bytes(envelope)
          ghcr_raw = receipts.canonical_json_bytes(post_ghcr)
          ghcr_envelope = {
              "schema": receipts.SOURCE_OBSERVATION_SCHEMA,
              "name": "final-ghcr-observation",
              "provider": "github.com",
              "locator": "GET digest-addressed GHCR objects for candidate inventory",
              "authenticated_as": "John-MiracleWorker",
              "freshness_class": "current",
              "captured_at": envelope["captured_at"],
              "page_count": 1,
              "record_count": len(post_ghcr["objects"]),
              "complete": True,
              "body_encoding": "base64",
              "body": base64.b64encode(ghcr_raw).decode("ascii"),
          }
          ghcr_envelope_raw = receipts.canonical_json_bytes(ghcr_envelope)
          post = {
              "schema": "kestrel.release_stage_execution.v1",
              "stage": 1,
              "observations": sorted(
                  [
                      receipts.source_snapshot(envelope_raw),
                      receipts.source_snapshot(ghcr_envelope_raw),
                  ],
                  key=lambda item: item["name"],
              ),
              "operation_outcomes": outcomes,
              "completed": completed,
              "uncertain": uncertain,
              "pending": pending,
          }
          root.joinpath("prepare-post-observations.json").write_bytes(
              receipts.canonical_json_bytes(post)
          )
          PY
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            record-preparation transaction/stages/release-preparation-plan.json \
            --pre-observations transaction/stages/prepare-pre-observations.json \
            --post-observations transaction/stages/prepare-post-observations.json \
            --output transaction/stages/release-preparation-outcome.json

      - name: Upload preserved preparation evidence
        id: upload-preparation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-release-preparation-${{ github.run_id }}-1
          path: |
            transaction
            !transaction/capsule/**
            transaction/stages/release-preparation-outcome.json
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate the preserved stage result
        if: ${{ always() }}
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute-preparation.outcome }}
          RECORD_OUTCOME: ${{ steps.record-preparation.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-preparation.outcome }}
        run: |
          test "$EXECUTE_OUTCOME" = success
          test "$RECORD_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success

  commit-github-release:
    needs: prepare-github-ghcr
    runs-on: ubuntu-24.04
    environment:
      name: release-commit
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: read
    steps:
      - name: Check out the dispatch-pinned transaction source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify the pinned recovery Python identity
        shell: bash
        run: |
          python_executable="$(readlink -f -- "$(command -v python)")"
          test -f "$python_executable"
          test ! -L "$python_executable"
          test "$(sha256sum "$python_executable" | cut -d ' ' -f 1)" = \
            "dcd2d22a91c5adb37fa3f54a3a16d2ed7616b84931eb606c0fdfbca38395dab8"
          test "$(python --version)" = "Python 3.11.14"

      - name: Install the pinned transaction runtime
        shell: bash
        run: |
          python scripts/bootstrap_uv.py "${RUNNER_TEMP}/kestrel-uv"
          pinned_uv="${RUNNER_TEMP}/kestrel-uv/uv"
          test "$($pinned_uv --version)" = "uv 0.9.21 (0dc9556ad 2025-12-30)"
          python -m venv --copies "${RUNNER_TEMP}/kestrel-transaction-venv"
          "$pinned_uv" export --frozen --no-dev --no-emit-local \
            --extra dev --group release --format requirements.txt \
            --output-file "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --no-build-isolation --no-deps -e '.[dev]'
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip check
          printf 'KESTREL_PYTHON=%s\n' \
            "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" >> "$GITHUB_ENV"

      - name: Restore preserved preparation evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kestrel-release-preparation-${{ github.run_id }}-1
          path: transaction

      - name: Bootstrap pinned GitHub CLI
        shell: bash
        run: |
          scripts/bootstrap_workflow_tools.sh "${RUNNER_TEMP}/kestrel-workflow-tools"
          pinned_gh="${RUNNER_TEMP}/kestrel-workflow-tools/gh"
          test "$($pinned_gh --version | head -n 1)" = \
            "gh version 2.97.0 (2026-02-26)"
          printf 'PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"
          printf 'KESTREL_PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"

      - name: Reverify the immutable recovery capsule before commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          test -f transaction/prepare-authority/recovery-capsule-publication.json
          test -f transaction/prepare-authority/recovery-capsule-verification.json
          test -f transaction/capsule-download/recovery-capsule.tar
          test ! -e transaction/capsule
          readarray -t capsule_inputs < <("$KESTREL_PYTHON" - <<'PY'
          import json
          import re
          from pathlib import Path

          signed = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-verification.json").read_bytes()
          )
          publication = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-publication.json").read_bytes()
          )
          claim = signed["verification"]
          assets = {item["name"]: item for item in claim["assets"]}
          tag = publication["tag"]
          if not isinstance(tag, str) or re.fullmatch(r"recovery-[1-9][0-9]*-1", tag) is None:
              raise SystemExit("recovery capsule publication tag is invalid")
          print(publication["archive_digest"])
          print(claim["capsule_manifest_digest"])
          print(claim["signing_key_fingerprint"])
          print(tag)
          print(assets["recovery-bootstrap.py"]["sha256"])
          PY
          )
          test "${#capsule_inputs[@]}" -eq 5
          cmp --silent scripts/bootstrap_recovery.py \
            "transaction/capsule-download/recovery-bootstrap.py"
          test "$(sha256sum \
            "transaction/capsule-download/recovery-bootstrap.py" | cut -d ' ' -f 1)" = \
            "${capsule_inputs[4]#sha256:}"
          recovery_tcb_python="$(bash scripts/bootstrap_recovery_tcb.sh \
            "${RUNNER_TEMP}/kestrel-recovery-bootstrap-tcb")"
          env -i LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 \
            "$recovery_tcb_python" -I -S -B \
            transaction/capsule-download/recovery-bootstrap.py \
            transaction/capsule-download/recovery-capsule.tar \
            --destination transaction/capsule \
            --expected-archive-digest "${capsule_inputs[0]}" \
            --expected-manifest-digest "${capsule_inputs[1]}" \
            --expected-owner-key-fingerprint "${capsule_inputs[2]}"
          test -f transaction/capsule/recovery-capsule-manifest.json
          install -d -m 0700 transaction/commit-capsule-observation
          recovery_tag="${capsule_inputs[3]}"
          "$PINNED_GH" api "repos/${PROMOTION_RECOVERY_REPOSITORY}" \
            > transaction/commit-capsule-observation/repository.json
          "$PINNED_GH" api \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/tags/${recovery_tag}" \
            > transaction/commit-capsule-observation/release.json
          release_id="$("$KESTREL_PYTHON" -c \
            'import json; print(json.load(open("transaction/commit-capsule-observation/release.json"))["id"])')"
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > transaction/commit-capsule-observation/assets-pages.json
          "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          root = Path("transaction/commit-capsule-observation")
          pages = json.loads(root.joinpath("assets-pages.json").read_bytes())
          root.joinpath("assets.json").write_text(
              json.dumps(
                  [item for page in pages for item in page],
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY
          "$PINNED_GH" release verify "$recovery_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --format json \
            > transaction/commit-capsule-observation/release-attestation.json
          for capsule_asset in \
            recovery-bootstrap.py \
            recovery-capsule-manifest.json \
            recovery-capsule.tar; do
            "$PINNED_GH" release verify-asset "$recovery_tag" \
              "transaction/capsule-download/$capsule_asset" \
              --repo "$PROMOTION_RECOVERY_REPOSITORY" \
              --format json \
              > "transaction/commit-capsule-observation/${capsule_asset}.attestation.json"
          done
          "$KESTREL_PYTHON" - \
            "$PINNED_GH" \
            "$PROMOTION_RECOVERY_REPOSITORY" \
            "$recovery_tag" \
            transaction/commit-capsule-observation/pinned-gh-release-verification.json <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          executable = Path(sys.argv[1])
          repository, tag, output_name = sys.argv[2:]
          digest = "sha256:" + hashlib.sha256(executable.read_bytes()).hexdigest()
          if digest != "sha256:141507c337e8b202ad398550c3b73d72f5af92e86f71665214538a81efd4c409":
              raise SystemExit("pinned GitHub CLI identity changed before observation")
          output = Path(output_name)
          result_specs = [
              ("release:verify", "release-attestation.json"),
              (
                  "release:verify-asset:recovery-bootstrap.py",
                  "recovery-bootstrap.py.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule-manifest.json",
                  "recovery-capsule-manifest.json.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule.tar",
                  "recovery-capsule.tar.attestation.json",
              ),
          ]
          results = []
          for operation, name in result_specs:
              raw = output.parent.joinpath(name).read_bytes()
              json.loads(raw)
              results.append(
                  {
                      "operation": operation,
                      "path": name,
                      "sha256": "sha256:" + hashlib.sha256(raw).hexdigest(),
                      "size_bytes": len(raw),
                  }
              )
          value = {
              "schema": "kestrel.pinned_gh_release_verification.v1",
              "pinned_gh_digest": digest,
              "pinned_gh_version": "gh version 2.97.0 (2026-02-26)",
              "repository": repository,
              "tag": tag,
              "results": results,
              "verified": True,
              "validation_status": "validated",
          }
          if output.exists() or output.is_symlink():
              raise SystemExit("pinned GitHub CLI observation output already exists")
          output.write_bytes(
              json.dumps(value, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode()
          )
          output.chmod(0o600)
          PY
          capsule_root="$GITHUB_WORKSPACE/transaction/capsule"
          capsule_python="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/environment/bin/python")"
          capsule_runtime="$(readlink -f -- "$capsule_root/recovery/runtime")"
          capsule_base_lib="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/base/lib")"
          capsule_loader="$capsule_runtime/ld-linux-x86-64.so.2"
          capsule_library_path="$capsule_runtime:$capsule_base_lib"
          capsule_receipts="$GITHUB_WORKSPACE/transaction/capsule/scripts/release_control_receipt.py"
          test ! -e /etc/ld.so.preload
          test -x "$capsule_python"
          test -x "$capsule_loader"
          test -f "$capsule_receipts"
          test -z "$(find "$capsule_runtime" -mindepth 1 -type d -print -quit)"
          capsule_private_loader() {
            local loader_report loader_line dependency
            loader_report="$(env -i "$capsule_loader" --inhibit-cache \
              --library-path "$capsule_library_path" --list "$capsule_python")"
            case "$loader_report" in *"not found"*) return 1 ;; esac
            while IFS= read -r loader_line; do
              loader_line="${loader_line#"${loader_line%%[![:space:]]*}"}"
              if [[ "$loader_line" == *" => "* ]]; then
                dependency="${loader_line#* => }"
                dependency="${dependency%% *}"
              elif [[ "$loader_line" == /* ]]; then
                dependency="${loader_line%% *}"
              else
                continue
              fi
              case "$dependency" in
                "$capsule_runtime"/*|"$capsule_base_lib"/*) ;;
                *) return 1 ;;
              esac
            done <<< "$loader_report"
            (
              exec -c "$capsule_loader" --inhibit-cache \
                --library-path "$capsule_library_path" "$capsule_python" "$@"
            )
          }
          (
            cd transaction/capsule-download
            capsule_private_loader -I -S -B -c \
              'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
              "$capsule_root" "$capsule_root/scripts/recovery_launcher.py" \
              launch "$capsule_root/recovery-execution-closure.json" \
              --capsule-root "$capsule_root" \
              --executable python -- \
              "$capsule_receipts" verify-recovery-capsule-release \
              "$GITHUB_WORKSPACE/transaction/capsule" \
              --publication-receipt \
                "$GITHUB_WORKSPACE/transaction/prepare-authority/recovery-capsule-publication.json" \
              --fresh-repository-observation \
                "$GITHUB_WORKSPACE/transaction/commit-capsule-observation/repository.json" \
              --fresh-release-observation \
                "$GITHUB_WORKSPACE/transaction/commit-capsule-observation/release.json" \
              --fresh-assets-observation \
                "$GITHUB_WORKSPACE/transaction/commit-capsule-observation/assets.json" \
              --pinned-gh-verification-observation \
                "$GITHUB_WORKSPACE/transaction/commit-capsule-observation/pinned-gh-release-verification.json" \
              --output "$GITHUB_WORKSPACE/transaction/commit-capsule-release-verification.json"
          )
          actuator_input_dir="$GITHUB_WORKSPACE/transaction/host-actuator/commit/inputs"
          install -d -m 0700 "$actuator_input_dir"
          install -m 0500 "$KESTREL_PYTHON" "$actuator_input_dir/python"
          install -m 0500 "$PINNED_GH" "$actuator_input_dir/gh"
          host_binding="$GITHUB_WORKSPACE/transaction/host-actuator/commit/host-actuator-binding.json"
          test ! -e "$host_binding"
          capsule_private_loader -I -S -B -c \
            'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
            "$capsule_root" \
            "$capsule_root/scripts/recovery_launcher.py" \
            launch "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --executable python -- \
            "$capsule_root/scripts/recovery_launcher.py" \
            bind-host-actuator "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --host-root "$GITHUB_WORKSPACE" \
            --host-python "$actuator_input_dir/python" \
            --host-gh "$actuator_input_dir/gh" \
            --output "$host_binding"
          grep -Fq '"method":"offline-authority-host-actuator-binding"' \
            "$host_binding"
          printf 'KESTREL_HOST_ACTUATOR_BINDING=%s\n' \
            "$host_binding" >> "$GITHUB_ENV"

      - name: Download exact owner-signed commit authority
        shell: bash
        env:
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            fetch-github-boundary-authority \
            --boundary commit \
            --run-id "$PROMOTION_RUN_ID" \
            --output-dir transaction/commit-authority

      - name: Verify both injected credentials at the commit boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
          RELEASE_GUARD_TOKEN_BYTES: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          for credential in recovery-reader release-guard; do
            if test "$credential" = recovery-reader; then
              token="$RELEASE_RECOVERY_READER_TOKEN_BYTES"
            else
              token="$RELEASE_GUARD_TOKEN_BYTES"
            fi
            printf '%s' "$token" | \
              "$KESTREL_PYTHON" -m scripts.release_control_receipt \
                verify-runtime-credential \
                --scope-authority \
                  "transaction/commit-authority/${credential}-scope-authority.json" \
                --scope-authority-signature \
                  "transaction/commit-authority/${credential}-scope-authority.json.sig" \
                --owner-signing-keys-observation \
                  transaction/commit-authority/owner-signing-keys-observation.json \
                --identity-probe-observation \
                  "transaction/commit-authority/${credential}-identity-probe.json" \
                --endpoint-probe-observations \
                  "transaction/commit-authority/${credential}-endpoint-probes.json" \
                --output \
                  "transaction/commit-authority/${credential}-runtime-verification.json"
          done

      - name: Verify owner-signed GitHub commit authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          environment_id="$("$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path("transaction/commit-authority/github-commit-authority.json").read_bytes()
          )
          if value.get("phase") != "commit":
              raise SystemExit("GitHub authority phase is not commit")
          print(value["environment"]["id"])
          PY
          )"
          "$KESTREL_PYTHON" -m scripts.release_control_receipt \
            verify-github-authority \
            transaction/commit-authority/github-commit-authority.json \
            --signature transaction/commit-authority/github-commit-authority.json.sig \
            --owner-signing-keys-observation \
              transaction/commit-authority/owner-signing-keys-observation.json \
            --expected-run-id "$PROMOTION_RUN_ID" \
            --expected-candidate-digest "$PROMOTION_CANDIDATE_MANIFEST_DIGEST" \
            --expected-environment-id "$environment_id" \
            --output transaction/commit-authority/github-commit-authority-verification.json
          execution_arguments=()
          if test -f transaction/release-execution-authorization.json; then
            execution_arguments=(
              --execution-authorization transaction/release-execution-authorization.json
            )
          fi
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            verify-github-boundary-binding \
            --phase commit \
            --authority-verification \
              transaction/commit-authority/github-commit-authority-verification.json \
            --manifest transaction/candidate/candidate-manifest.json \
            --transaction-authorization transaction/release-authorization.json \
            "${execution_arguments[@]}" \
            --recovery-capsule-verification \
              transaction/prepare-authority/recovery-capsule-verification.json \
            --output transaction/commit-authority/binding-verification.json

      - name: Require exact cumulative commit approvals
        shell: bash
        run: |
          "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          approval = json.loads(
              Path(
                  "transaction/commit-authority/approval-history-observation.json"
              ).read_bytes()
          )
          transaction._require_cumulative_owner_approvals(  # noqa: SLF001
              approval,
              expected_environments=("release", "release-prepare", "release-commit"),
          )
          PY

      - name: Observe exact commit surfaces and create the commit plan
        id: commit-plan
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_REPOSITORY}/releases?per_page=100" \
            > transaction/stages/commit-release-list.json
          "$PINNED_GH" api --paginate --slurp \
            "users/John-MiracleWorker/packages?package_type=container&per_page=100" \
            > transaction/stages/commit-ghcr-packages.json
          package_present="$("$KESTREL_PYTHON" - \
            transaction/stages/commit-ghcr-packages.json <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts import release_promotion_transaction as transaction
          value = json.loads(Path(sys.argv[1]).read_bytes())
          print("1" if transaction._ghcr_package_is_present(value) else "0")  # noqa: SLF001
          PY
          )"
          if test "$package_present" = 1; then
            "$PINNED_GH" api --paginate --slurp \
              "users/John-MiracleWorker/packages/container/kestrel/versions?per_page=100" \
              > transaction/stages/commit-ghcr-package-versions.json
          else
            printf '[[]]\n' > transaction/stages/commit-ghcr-package-versions.json
          fi
          "$KESTREL_PYTHON" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/stages")
          bundle = Path("transaction/candidate")
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          source_sha = manifest["source"]["commit_sha"]
          tag_name = manifest["version"]
          tag_name = tag_name if tag_name.startswith("v") else f"v{tag_name}"
          if manifest.get("tag") is not None:
              tag_name = manifest["tag"]

          github_context = ssl.create_default_context()
          github_opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=github_context),
          )
          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "kestrel-release-transaction/1",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def github_get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/{path}", headers=github_headers
              )
              with github_opener.open(request, timeout=30) as response:
                  return json.loads(response.read(receipts.MAX_SOURCE_BODY_BYTES + 1))

          if os.environ["PROMOTION_MODE"] == "initiate":
              main = github_get(f"repos/{os.environ['PROMOTION_REPOSITORY']}/branches/main")
              if (
                  main.get("commit", {}).get("sha") != source_sha
                  or os.environ["PROMOTION_SHA"] != source_sha
              ):
                  raise SystemExit("initiate commit no longer targets exact locked main")
          elif os.environ["PROMOTION_REF"] != f"refs/tags/{tag_name}":
              raise SystemExit("recovery commit is not pinned to the candidate tag")

          try:
              tag_ref = github_get(
                  f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/ref/tags/"
                  + urllib.parse.quote(tag_name, safe="")
              )
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              tag_observation = {"http_status": 404, "ref": None, "tag": None}
          else:
              target = tag_ref.get("object", {})
              tag_object = (
                  github_get(
                      f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/tags/"
                      f"{target.get('sha')}"
                  )
                  if target.get("type") == "tag"
                  else None
              )
              tag_observation = {
                  "http_status": 200,
                  "ref": tag_ref,
                  "tag": tag_object,
              }
          root.joinpath("commit-tag.json").write_bytes(
              receipts.canonical_json_bytes(tag_observation)
          )

          descriptor = json.loads(bundle.joinpath("containers/oci-descriptor.json").read_bytes())
          expected_digests = transaction._expected_oci_object_digests(bundle)  # noqa: SLF001
          manifest_digests = {
              descriptor["index_digest"],
              *(item["manifest_digest"] for item in descriptor["platforms"]),
          }
          bearer = transaction.fetch_ghcr_pull_token(
              os.environ["GHCR_READ_TOKEN"].encode("ascii")
          )
          registry_api = transaction.DirectOCIReadAPI(
              token=bearer.encode("ascii")
          )
          tags_by_digest = transaction._ghcr_tags_by_digest_from_package_versions(  # noqa: SLF001
              json.loads(root.joinpath("commit-ghcr-package-versions.json").read_bytes())
          )
          package_present = transaction._ghcr_package_is_present(  # noqa: SLF001
              json.loads(root.joinpath("commit-ghcr-packages.json").read_bytes())
          )
          objects = []
          for digest in expected_digests:
              kind = "manifests" if digest in manifest_digests else "blobs"
              observation = registry_api.read_digest(
                  kind=kind,
                  digest=digest,
                  max_bytes=2_147_483_648,
              )
              status = observation.http_status
              objects.append(
                  {
                      "digest": digest,
                      "http_status": status,
                      "tags": tags_by_digest.get(digest, []),
                      "tag_inventory_complete": (
                          status == 404 or kind == "blobs" or digest in tags_by_digest
                      ),
                      "observed_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                          "+00:00", "Z"
                      ),
                  }
              )
          ghcr = {
              "repository": descriptor["repository"],
              "package_present": package_present,
              "objects": objects,
          }
          root.joinpath("commit-ghcr.json").write_bytes(receipts.canonical_json_bytes(ghcr))

          common = [
              "--repo",
              os.environ["PROMOTION_REPOSITORY"],
              "--signer-workflow",
              f"{os.environ['PROMOTION_REPOSITORY']}/.github/workflows/release.yml",
              "--signer-digest",
              source_sha,
              "--source-digest",
              source_sha,
              "--predicate-type",
              transaction._RELEASE_PROMOTION_PREDICATE_TYPE,  # noqa: SLF001
              "--deny-self-hosted-runners",
              "--format",
              "json",
          ]
          subjects = []
          for subject in manifest["attestation_subjects"]:
              if subject["kind"] == "file":
                  target = str((bundle / subject["name"]).resolve(strict=True))
              elif subject["kind"] == "oci_index":
                  target = f"oci://{subject['name']}@{subject['digest']}"
              else:
                  raise SystemExit("candidate attestation subject kind is invalid")
              subjects.append(
                  transaction._observe_promotion_attestation_subject(  # noqa: SLF001
                      subject=subject,
                      target=target,
                      pinned_gh=Path(os.environ["PINNED_GH"]),
                      repository=os.environ["PROMOTION_REPOSITORY"],
                      expected_repository_id=manifest["source"]["repository_id"],
                      common_arguments=common,
                      token=os.environ["GH_TOKEN"],
                      label="commit attestation",
                  )
              )
          raw_attestations = {"subjects": subjects}
          transaction_digest = receipts._sha256(  # noqa: SLF001
              Path("transaction/release-authorization.json").read_bytes()
          )
          capsule_digest = json.loads(
              Path(
                  "transaction/prepare-authority/recovery-capsule-verification.json"
              ).read_bytes()
          )["verification"]["capsule_manifest_digest"]
          release_contract = transaction._candidate_product_release_contract(  # noqa: SLF001
              manifest,
              transaction_authorization_digest=transaction_digest,
              recovery_capsule_digest=capsule_digest,
          )
          predicate_context = transaction._release_promotion_predicate_context(  # noqa: SLF001
              manifest=manifest,
              transaction_authorization_digest=transaction_digest,
              release_listing=json.loads(
                  root.joinpath("commit-release-list.json").read_bytes()
              ),
              release_contract=release_contract,
              ghcr_observation=ghcr,
              expected_oci_digests=expected_digests,
              allow_exact_draft=True,
          )
          attestations = transaction.authorize_promotion_attestation_observation(
              raw_attestations,
              manifest=manifest,
              expected_context=predicate_context,
              recovery_capsule_digest=capsule_digest,
              api=transaction.DirectGitHubReadAPI(
                  token=os.environ["RELEASE_RECOVERY_READER_TOKEN_BYTES"].encode("ascii")
              ),
          )
          root.joinpath("commit-attestations.json").write_bytes(
              receipts.canonical_json_bytes(attestations)
          )

          captured_at = (
              datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          )

          def envelope(*, name, provider, locator, raw, pages, records):
              return receipts.canonical_json_bytes(
                  {
                      "schema": receipts.SOURCE_OBSERVATION_SCHEMA,
                      "name": name,
                      "provider": provider,
                      "locator": locator,
                      "authenticated_as": "John-MiracleWorker",
                      "freshness_class": "current",
                      "captured_at": captured_at,
                      "page_count": pages,
                      "record_count": records,
                      "complete": True,
                      "body_encoding": "base64",
                      "body": base64.b64encode(raw).decode("ascii"),
                  }
              )

          release_raw = root.joinpath("commit-release-list.json").read_bytes()
          release_pages = json.loads(release_raw)
          source_values = [
              envelope(
                  name="final-release-list-observation",
                  provider="github.com",
                  locator="GET /repos/John-MiracleWorker/Kestrel/releases?per_page=100",
                  raw=release_raw,
                  pages=len(release_pages),
                  records=sum(len(page) for page in release_pages),
              ),
              envelope(
                  name="final-ghcr-observation",
                  provider="github.com",
                  locator="GET digest-addressed GHCR manifests for candidate inventory",
                  raw=receipts.canonical_json_bytes(ghcr),
                  pages=1,
                  records=len(objects),
              ),
              envelope(
                  name="tag-observation",
                  provider="github.com",
                  locator=(
                      "GET /repos/John-MiracleWorker/Kestrel/git/ref/tags/{tag} "
                      "and annotated tag"
                  ),
                  raw=receipts.canonical_json_bytes(tag_observation),
                  pages=1,
                  records=1,
              ),
              envelope(
                  name="final-attestation-observation",
                  provider="github.com",
                  locator="gh attestation verify exact Kestrel candidate subjects",
                  raw=receipts.canonical_json_bytes(attestations),
                  pages=1,
                  records=1,
              ),
          ]
          source_paths = (
              "commit-release-list-source.json",
              "commit-ghcr-source.json",
              "commit-tag-source.json",
              "commit-attestations-source.json",
          )
          for path, raw in zip(source_paths, source_values, strict=True):
              root.joinpath(path).write_bytes(raw)
          pre = {
              "schema": "kestrel.release_stage_observations.v1",
              "stage": 2,
              "observations": sorted(
                  [receipts.source_snapshot(raw) for raw in source_values],
                  key=lambda item: item["name"],
              ),
          }
          root.joinpath("commit-pre-observations.json").write_bytes(
              receipts.canonical_json_bytes(pre)
          )
          PY
          execution_arguments=()
          if test "$PROMOTION_MODE" = recover_committed; then
            execution_arguments=(
              --execution-authorization
              transaction/release-execution-authorization.json
            )
          fi
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            plan-commit transaction/candidate/candidate-manifest.json \
            --bundle-root transaction/candidate \
            --transaction-authorization transaction/release-authorization.json \
            "${execution_arguments[@]}" \
            --recovery-capsule-verification \
              transaction/prepare-authority/recovery-capsule-verification.json \
            --preparation-outcome \
              transaction/stages/release-preparation-outcome.json \
            --commit-authority-verification \
              transaction/commit-authority/github-commit-authority-verification.json \
            --tag-observation transaction/stages/commit-tag-source.json \
            --release-list-observation \
              transaction/stages/commit-release-list-source.json \
            --ghcr-observation transaction/stages/commit-ghcr-source.json \
            --attestation-observations \
              transaction/stages/commit-attestations-source.json \
            --output transaction/stages/release-commit-plan.json
          "$KESTREL_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/stages")
          bundle = Path("transaction/candidate")
          plan = json.loads(root.joinpath("release-commit-plan.json").read_bytes())
          transaction._validated_stage_plan(plan, stage=2)  # noqa: SLF001
          operations = {item["operation"]: item for item in plan["operations"]}
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          prior = json.loads(root.joinpath("commit-attestations.json").read_bytes())
          prior_by_identity = {
              (item["kind"], item["name"], item["digest"]): item["verification"]
              for item in prior["subjects"]
          }
          file_subjects = []
          missing_file_identities = set()
          oci_subject = None
          for subject in manifest["attestation_subjects"]:
              identity = (subject["kind"], subject["name"], subject["digest"])
              if subject["kind"] == "file":
                  path = bundle / subject["name"]
                  raw = path.read_bytes()
                  if "sha256:" + hashlib.sha256(raw).hexdigest() != subject["digest"]:
                      raise SystemExit("attestation subject bytes changed after planning")
                  file_subjects.append(subject)
                  if prior_by_identity.get(identity) is None:
                      missing_file_identities.add(identity)
              elif (
                  subject["kind"] == "oci_index"
                  and prior_by_identity.get(identity) is None
              ):
                  if oci_subject is not None:
                      raise SystemExit("multiple OCI index subjects are forbidden")
                  oci_subject = subject
          if len(file_subjects) != 8:
              raise SystemExit("release payload must have exactly eight file subjects")
          missing_files = [
              subject
              for subject in file_subjects
              if (subject["kind"], subject["name"], subject["digest"])
              in missing_file_identities
          ]
          file_action = operations["attest_github_assets"]["action"]
          oci_action = operations["attest_oci_index_repository"]["action"]
          if (file_action == "create") is not bool(missing_files):
              raise SystemExit("file attestation plan does not match missing subjects")
          if (oci_action == "create") is not (oci_subject is not None):
              raise SystemExit("OCI attestation plan does not match missing subject")
          outputs = Path(os.environ["GITHUB_OUTPUT"])
          with outputs.open("a", encoding="utf-8") as stream:
              stream.write(f"attest_files={file_action}\n")
              stream.write(f"attest_oci={oci_action}\n")
              for index, subject in enumerate(file_subjects):
                  identity = (subject["kind"], subject["name"], subject["digest"])
                  action = "create" if identity in missing_file_identities else "no_op"
                  stream.write(f"file_{index}_action={action}\n")
                  stream.write(f"file_{index}_name={subject['name']}\n")
                  stream.write(f"file_{index}_digest={subject['digest']}\n")
              if oci_subject is not None:
                  stream.write(f"oci_name={oci_subject['name']}\n")
                  stream.write(f"oci_digest={oci_subject['digest']}\n")
          PY

      - name: Capture fresh commit boundary after approval
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            capture-prerequisite-boundary \
            --registry transaction/capsule/release-control-source-registry.json \
            --repository "$PROMOTION_REPOSITORY" \
            --recovery-repository "$PROMOTION_RECOVERY_REPOSITORY" \
            --candidate-ref "$PROMOTION_SHA" \
            --run-id "$PROMOTION_RUN_ID" \
            --output-dir transaction/commit-boundary

      - name: Validate fresh lock and ingress before commit
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            inspect-prerequisites \
            --mode operational \
            --transaction-mode "$PROMOTION_MODE" \
            --repository-observation \
              transaction/commit-boundary/repository-observation.json \
            --repository-collaborators-observation \
              transaction/commit-boundary/repository-collaborators-observation.json \
            --repository-invitations-observation \
              transaction/commit-boundary/repository-invitations-observation.json \
            --deploy-keys-observation \
              transaction/commit-boundary/deploy-keys-observation.json \
            --actions-workflow-permissions-observation \
              transaction/commit-boundary/actions-workflow-permissions-observation.json \
            --owner-signing-keys-observation \
              transaction/commit-boundary/owner-signing-keys-observation.json \
            --workflow-source-root transaction/capsule \
            --main-branch-observation \
              transaction/commit-boundary/main-branch-observation.json \
            --immutable-releases-observation \
              transaction/commit-boundary/immutable-releases-observation.json \
            --rulesets-observation transaction/commit-boundary/rulesets-observation.json \
            --tag-ruleset-detail-observation \
              transaction/commit-boundary/tag-ruleset-detail-observation.json \
            --ingress-ruleset-detail-observation \
              transaction/commit-boundary/ingress-ruleset-detail-observation.json \
            --workflow-observation transaction/commit-boundary/workflow-observation.json \
            --default-branch-workflow-contents \
              transaction/commit-boundary/default-branch-workflow-contents.json \
            --candidate-workflow-contents \
              transaction/commit-boundary/candidate-workflow-contents.json \
            --recovery-repository-observation \
              transaction/commit-boundary/recovery-repository-observation.json \
            --recovery-immutable-releases-observation \
              transaction/commit-boundary/recovery-immutable-releases-observation.json \
            --recovery-authority-verification \
              transaction/authority-evidence/recovery-authority-verification.json \
            --github-authority-verification \
              transaction/commit-authority/github-commit-authority-verification.json \
            --pypi-authority-verification \
              transaction/authority-evidence/pypi-authority-verification.json \
            --expected-repository "$PROMOTION_REPOSITORY" \
            --expected-owner-login John-MiracleWorker \
            --expected-owner-user-id 58918509 \
            --environment-observation \
              release=transaction/commit-boundary/environment-release-observation.json \
            --environment-observation \
              release-prepare=transaction/commit-boundary/environment-release-prepare-observation.json \
            --environment-observation \
              release-commit=transaction/commit-boundary/environment-release-commit-observation.json \
            --environment-observation \
              pypi=transaction/commit-boundary/environment-pypi-observation.json \
            --environment-policies-observation \
              release=transaction/commit-boundary/environment-release-policies-observation.json \
            --environment-policies-observation \
              release-prepare=transaction/commit-boundary/environment-release-prepare-policies-observation.json \
            --environment-policies-observation \
              release-commit=transaction/commit-boundary/environment-release-commit-policies-observation.json \
            --environment-policies-observation \
              pypi=transaction/commit-boundary/environment-pypi-policies-observation.json \
            --output transaction/stages/commit-prerequisites.json

      - name: Revalidate commit authority immediately before marker publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          execution_arguments=()
          if test -f transaction/release-execution-authorization.json; then
            execution_arguments=(
              --execution-authorization transaction/release-execution-authorization.json
            )
          fi
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            verify-github-boundary-binding \
            --phase commit \
            --authority-verification \
              transaction/commit-authority/github-commit-authority-verification.json \
            --manifest transaction/candidate/candidate-manifest.json \
            --transaction-authorization transaction/release-authorization.json \
            "${execution_arguments[@]}" \
            --recovery-capsule-verification \
              transaction/prepare-authority/recovery-capsule-verification.json \
            --output transaction/commit-authority/pre-marker-binding-verification.json

      - name: Atomically create the marker and publish the exact draft
        id: execute-commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_READ_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          set +e
          "$KESTREL_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.parse
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/stages")
          bundle = Path("transaction/candidate")
          plan = json.loads(root.joinpath("release-commit-plan.json").read_bytes())
          transaction._validated_stage_plan(plan, stage=2)  # noqa: SLF001
          operations = {item["operation"]: item for item in plan["operations"]}
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          candidate = plan["candidate"]
          attempted = []
          failure = None

          def run_gh(arguments, body=None, token=None):
              completed = subprocess.run(
                  [os.environ["PINNED_GH"], *arguments],
                  input=body,
                  capture_output=True,
                  check=False,
                  env={
                      "GH_TOKEN": token or os.environ["GH_TOKEN"],
                      "GH_PROMPT_DISABLED": "1",
                      "NO_COLOR": "1",
                  },
              )
              if completed.returncode != 0:
                  raise RuntimeError("pinned GitHub CLI commit operation failed")
              return completed.stdout

          tag_request = {
              "tag": candidate["tag"],
              "message": transaction.build_annotated_tag_message(
                  candidate=candidate,
                  transaction_authorization_digest=plan["transaction_authorization_digest"],
                  recovery_capsule_digest=plan["recovery_capsule_digest"],
              ),
              "object": candidate["source_sha"],
              "type": "commit",
              "ref": f"refs/tags/{candidate['tag']}",
          }
          if transaction.release_stage_operation_request_digest(
              candidate=candidate,
              operation="create_tag",
              request=tag_request,
              transaction_authorization_digest=plan[
                  "transaction_authorization_digest"
              ],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          ) != operations["create_tag"]["request_digest"]:
              raise SystemExit("commit tag request no longer matches its plan")
          release_pages = json.loads(root.joinpath("commit-release-list.json").read_bytes())
          contract = transaction._candidate_product_release_contract(  # noqa: SLF001
              manifest,
              transaction_authorization_digest=plan["transaction_authorization_digest"],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          )
          release_state = transaction._classify_product_release_listing(  # noqa: SLF001
              release_pages, contract=contract
          )
          publish_request = {
              "release_id": release_state["release_id"],
              "tag_name": candidate["tag"],
              "patch": transaction._product_release_publish_patch(),  # noqa: SLF001
          }
          if transaction.release_stage_operation_request_digest(
              candidate=candidate,
              operation="publish_github_release_draft",
              request=publish_request,
              transaction_authorization_digest=plan[
                  "transaction_authorization_digest"
              ],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          ) != operations["publish_github_release_draft"]["request_digest"]:
              raise SystemExit("Release publish request no longer matches its plan")
          precondition_digest = None
          prepublish_digest = None
          try:
              read_api = transaction.DirectGitHubReadAPI(
                  token=os.environ["GH_TOKEN"].encode("ascii")
              )

              def read_github_json(target, label):
                  exchange = read_api(
                      f"GET {target}", accept="application/vnd.github+json"
                  )
                  if exchange.http_status != 200:
                      raise RuntimeError(f"{label} did not return HTTP 200")
                  return receipts.parse_external_json_bytes(
                      exchange.response_body, label=label
                  )

              main_observation = None
              if os.environ["PROMOTION_MODE"] == "initiate":
                  main_observation = read_github_json(
                      f"/repos/{os.environ['PROMOTION_REPOSITORY']}/branches/main",
                      "last-moment main branch",
                  )
                  if (
                      main_observation.get("commit", {}).get("sha")
                      != candidate["source_sha"]
                      or os.environ["PROMOTION_SHA"] != candidate["source_sha"]
                      or os.environ["PROMOTION_REF"] != "refs/heads/main"
                  ):
                      raise RuntimeError(
                          "initiate marker no longer targets exact locked main"
                      )
              elif (
                  os.environ["PROMOTION_MODE"] != "recover_committed"
                  or os.environ["PROMOTION_REF"]
                  != f"refs/tags/{candidate['tag']}"
              ):
                  raise RuntimeError("recovery marker is not candidate-tag pinned")

              tag_target = (
                  f"/repos/{os.environ['PROMOTION_REPOSITORY']}/git/ref/tags/"
                  + urllib.parse.quote(candidate["tag"], safe="")
              )
              tag_exchange = read_api(
                  f"GET {tag_target}", accept="application/vnd.github+json"
              )
              if tag_exchange.http_status == 404:
                  fresh_tag_observation = {
                      "http_status": 404,
                      "ref": None,
                      "tag": None,
                  }
              elif tag_exchange.http_status == 200:
                  fresh_tag_ref = receipts.parse_external_json_bytes(
                      tag_exchange.response_body, label="last-moment tag ref"
                  )
                  fresh_tag_target = fresh_tag_ref.get("object", {})
                  if fresh_tag_target.get("type") != "tag":
                      raise RuntimeError("last-moment tag is not annotated")
                  fresh_tag = read_github_json(
                      (
                          f"/repos/{os.environ['PROMOTION_REPOSITORY']}/git/tags/"
                          f"{fresh_tag_target.get('sha')}"
                      ),
                      "last-moment annotated tag",
                  )
                  fresh_tag_observation = {
                      "http_status": 200,
                      "ref": fresh_tag_ref,
                      "tag": fresh_tag,
                  }
              else:
                  raise RuntimeError("last-moment tag read is neither 200 nor 404")
              fresh_tag_state = transaction._classify_commit_tag_observation(  # noqa: SLF001
                  fresh_tag_observation,
                  candidate=candidate,
                  transaction_authorization_digest=plan[
                      "transaction_authorization_digest"
                  ],
                  recovery_capsule_digest=plan["recovery_capsule_digest"],
              )
              expected_tag_state = (
                  "missing"
                  if operations["create_tag"]["action"] == "create"
                  else "existing_exact"
              )
              if fresh_tag_state != expected_tag_state:
                  raise RuntimeError("last-moment tag state differs from its plan")

              fresh_release_pages = json.loads(
                  run_gh(
                      [
                          "api",
                          "--paginate",
                          "--slurp",
                          (
                              f"repos/{os.environ['PROMOTION_REPOSITORY']}"
                              "/releases?per_page=100"
                          ),
                      ]
                  )
              )
              fresh_release_state = transaction._classify_product_release_listing(  # noqa: SLF001
                  fresh_release_pages, contract=contract
              )
              if (
                  fresh_release_state != release_state
                  or fresh_release_state["assets"] != "existing_exact"
                  or (
                      operations["publish_github_release_draft"]["action"]
                      == "create"
                      and fresh_release_state["release"] != "draft_exact"
                  )
                  or (
                      operations["publish_github_release_draft"]["action"]
                      == "no_op"
                      and fresh_release_state["release"] != "immutable_exact"
                  )
              ):
                  raise RuntimeError(
                      "last-moment product Release state differs from its plan"
                  )

              package_pages = json.loads(
                  run_gh(
                      [
                          "api",
                          "--paginate",
                          "--slurp",
                          (
                              "users/John-MiracleWorker/packages"
                              "?package_type=container&per_page=100"
                          ),
                      ],
                      token=os.environ["GHCR_READ_TOKEN"],
                  )
              )
              package_present = transaction._ghcr_package_is_present(  # noqa: SLF001
                  package_pages
              )
              if not package_present:
                  raise RuntimeError("last-moment GHCR package is absent")
              version_pages = json.loads(
                  run_gh(
                      [
                          "api",
                          "--paginate",
                          "--slurp",
                          (
                              "users/John-MiracleWorker/packages/container/"
                              "kestrel/versions?per_page=100"
                          ),
                      ],
                      token=os.environ["GHCR_READ_TOKEN"],
                  )
              )
              tags_by_digest = (
                  transaction._ghcr_tags_by_digest_from_package_versions(  # noqa: SLF001
                      version_pages
                  )
              )
              descriptor = json.loads(
                  bundle.joinpath("containers/oci-descriptor.json").read_bytes()
              )
              expected_digests = transaction._expected_oci_object_digests(  # noqa: SLF001
                  bundle
              )
              manifest_digests = {
                  descriptor["index_digest"],
                  *(
                      item["manifest_digest"]
                      for item in descriptor["platforms"]
                  ),
              }
              bearer = transaction.fetch_ghcr_pull_token(
                  os.environ["GHCR_READ_TOKEN"].encode("ascii")
              )
              registry_api = transaction.DirectOCIReadAPI(
                  token=bearer.encode("ascii")
              )
              fresh_ghcr_objects = []
              for digest in expected_digests:
                  kind = "manifests" if digest in manifest_digests else "blobs"
                  observed = registry_api.read_digest(
                      kind=kind,
                      digest=digest,
                      max_bytes=2_147_483_648,
                  )
                  fresh_ghcr_objects.append(
                      {
                          "digest": digest,
                          "http_status": observed.http_status,
                          "tags": tags_by_digest.get(digest, []),
                          "tag_inventory_complete": (
                              observed.http_status == 404
                              or kind == "blobs"
                              or digest in tags_by_digest
                          ),
                          "observed_at": datetime.now(UTC)
                          .replace(microsecond=0)
                          .isoformat()
                          .replace("+00:00", "Z"),
                      }
                  )
              fresh_ghcr = {
                  "repository": descriptor["repository"],
                  "package_present": package_present,
                  "objects": fresh_ghcr_objects,
              }
              if transaction._classify_ghcr_digest_observation(  # noqa: SLF001
                  fresh_ghcr, expected_digests=expected_digests
              ) != "existing_exact":
                  raise RuntimeError("last-moment GHCR state is not exact")

              precondition_raw = receipts.canonical_external_json_bytes(
                  {
                      "ghcr": fresh_ghcr,
                      "main": main_observation,
                      "release": fresh_release_pages,
                      "tag": fresh_tag_observation,
                  }
              )
              root.joinpath("commit-last-moment-preconditions.json").write_bytes(
                  precondition_raw
              )
              precondition_digest = receipts._sha256(precondition_raw)  # noqa: SLF001

              if operations["create_tag"]["action"] == "create":
                  attempted.append("create_tag")
                  tag_object = json.loads(
                      run_gh(
                          [
                              "api",
                              "--method",
                              "POST",
                              f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/tags",
                              "--input",
                              "-",
                          ],
                          receipts.canonical_external_json_bytes(
                              {key: tag_request[key] for key in ("tag", "message", "object", "type")}
                          ),
                      )
                  )
                  run_gh(
                      [
                          "api",
                          "--method",
                          "POST",
                          f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/refs",
                          "--input",
                          "-",
                      ],
                      receipts.canonical_external_json_bytes(
                          {"ref": tag_request["ref"], "sha": tag_object["sha"]}
                      ),
                  )
              observed_ref = json.loads(
                  run_gh(
                      [
                          "api",
                          (
                              f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/ref/tags/"
                              + urllib.parse.quote(candidate["tag"], safe="")
                          ),
                      ]
                  )
              )
              observed_target = observed_ref.get("object", {})
              observed_tag = (
                  json.loads(
                      run_gh(
                          [
                              "api",
                              (
                                  f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/tags/"
                                  f"{observed_target.get('sha')}"
                              ),
                          ]
                      )
                  )
                  if observed_target.get("type") == "tag"
                  else None
              )
              tag_observation = {
                  "http_status": 200,
                  "ref": observed_ref,
                  "tag": observed_tag,
              }
              if transaction._classify_commit_tag_observation(  # noqa: SLF001
                  tag_observation,
                  candidate=candidate,
                  transaction_authorization_digest=plan[
                      "transaction_authorization_digest"
                  ],
                  recovery_capsule_digest=plan["recovery_capsule_digest"],
              ) != "existing_exact":
                  raise RuntimeError("annotated transaction tag is not exact after write")
              prepublish_release_raw = run_gh(
                  [
                      "api",
                      "--paginate",
                      "--slurp",
                      (
                          f"repos/{os.environ['PROMOTION_REPOSITORY']}"
                          "/releases?per_page=100"
                      ),
                  ]
              )
              prepublish_release_pages = json.loads(prepublish_release_raw)
              prepublish_release_state = (
                  transaction._classify_product_release_listing(  # noqa: SLF001
                      prepublish_release_pages, contract=contract
                  )
              )
              expected_prepublish_state = (
                  "draft_exact"
                  if operations["publish_github_release_draft"]["action"]
                  == "create"
                  else "immutable_exact"
              )
              if (
                  prepublish_release_state["release"]
                  != expected_prepublish_state
                  or prepublish_release_state["assets"] != "existing_exact"
                  or prepublish_release_state["release_id"]
                  != publish_request["release_id"]
              ):
                  raise RuntimeError(
                      "product Release changed after marker verification"
                  )
              root.joinpath(
                  "commit-last-moment-prepublish-release-list.json"
              ).write_bytes(prepublish_release_raw)
              prepublish_digest = receipts._sha256(  # noqa: SLF001
                  prepublish_release_raw
              )
              if operations["publish_github_release_draft"]["action"] == "create":
                  attempted.append("publish_github_release_draft")
                  run_gh(
                      [
                          "api",
                          "--method",
                          "PATCH",
                          (
                              f"repos/{os.environ['PROMOTION_REPOSITORY']}/releases/"
                              f"{publish_request['release_id']}"
                          ),
                          "--input",
                          "-",
                      ],
                      receipts.canonical_external_json_bytes(publish_request["patch"]),
                  )
              release_verification = run_gh(
                  [
                      "release",
                      "verify",
                      candidate["tag"],
                      "--repo",
                      os.environ["PROMOTION_REPOSITORY"],
                      "--format",
                      "json",
                  ]
              )
              if not release_verification:
                  raise RuntimeError("immutable Release verification produced no evidence")
              for artifact in manifest["artifacts"]:
                  if not artifact["path"].startswith("release/"):
                      continue
                  path = bundle / artifact["path"]
                  raw = path.read_bytes()
                  if (
                      len(raw) != artifact["size_bytes"]
                      or "sha256:" + hashlib.sha256(raw).hexdigest() != artifact["sha256"]
                  ):
                      raise RuntimeError("Release asset bytes changed before verification")
                  verification = run_gh(
                      [
                          "release",
                          "verify-asset",
                          candidate["tag"],
                          str(path.resolve()),
                          "--repo",
                          os.environ["PROMOTION_REPOSITORY"],
                          "--format",
                          "json",
                      ]
                  )
                  if not verification:
                      raise RuntimeError("Release asset verification produced no evidence")
          except Exception as error:  # preserve response-loss ambiguity
              failure = type(error).__name__
          root.joinpath("commit-attempt.json").write_bytes(
              receipts.canonical_json_bytes(
                  {
                      "attempted": sorted(attempted),
                      "failure": failure,
                      "precondition_observation_digest": precondition_digest,
                      "prepublish_release_observation_digest": prepublish_digest,
                  }
              )
          )
          if failure is not None:
              raise SystemExit(1)
          PY
          status=$?
          printf '%s\n' "$status" > transaction/stages/commit-exit-status
          exit "$status"

      - name: Materialize the canonical predicate from fresh published surfaces
        if: >-
          ${{ steps.commit-plan.outputs.attest_files == 'create' ||
              steps.commit-plan.outputs.attest_oci == 'create' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_REPOSITORY}/releases?per_page=100" \
            > transaction/stages/predicate-release-list.json
          "$PINNED_GH" api --paginate --slurp \
            "users/John-MiracleWorker/packages?package_type=container&per_page=100" \
            > transaction/stages/predicate-ghcr-packages.json
          package_present="$("$KESTREL_PYTHON" - \
            transaction/stages/predicate-ghcr-packages.json <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts import release_promotion_transaction as transaction
          value = json.loads(Path(sys.argv[1]).read_bytes())
          print("1" if transaction._ghcr_package_is_present(value) else "0")  # noqa: SLF001
          PY
          )"
          if test "$package_present" = 1; then
            "$PINNED_GH" api --paginate --slurp \
              "users/John-MiracleWorker/packages/container/kestrel/versions?per_page=100" \
              > transaction/stages/predicate-ghcr-package-versions.json
          else
            printf '[[]]\n' > transaction/stages/predicate-ghcr-package-versions.json
          fi
          "$KESTREL_PYTHON" - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/stages")
          bundle = Path("transaction/candidate")
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          plan = json.loads(root.joinpath("release-commit-plan.json").read_bytes())
          transaction._validated_stage_plan(plan, stage=2)  # noqa: SLF001
          operations = {item["operation"]: item for item in plan["operations"]}
          descriptor = json.loads(bundle.joinpath("containers/oci-descriptor.json").read_bytes())
          expected_digests = transaction._expected_oci_object_digests(bundle)  # noqa: SLF001
          manifest_digests = {
              descriptor["index_digest"],
              *(item["manifest_digest"] for item in descriptor["platforms"]),
          }
          bearer = transaction.fetch_ghcr_pull_token(
              os.environ["GHCR_READ_TOKEN"].encode("ascii")
          )
          registry_api = transaction.DirectOCIReadAPI(token=bearer.encode("ascii"))
          tags_by_digest = transaction._ghcr_tags_by_digest_from_package_versions(  # noqa: SLF001
              json.loads(root.joinpath("predicate-ghcr-package-versions.json").read_bytes())
          )
          package_present = transaction._ghcr_package_is_present(  # noqa: SLF001
              json.loads(root.joinpath("predicate-ghcr-packages.json").read_bytes())
          )
          objects = []
          for digest in expected_digests:
              kind = "manifests" if digest in manifest_digests else "blobs"
              observed = registry_api.read_digest(
                  kind=kind,
                  digest=digest,
                  max_bytes=2_147_483_648,
              )
              objects.append(
                  {
                      "digest": digest,
                      "http_status": observed.http_status,
                      "tags": tags_by_digest.get(digest, []),
                      "tag_inventory_complete": (
                          observed.http_status == 404
                          or kind == "blobs"
                          or digest in tags_by_digest
                      ),
                      "observed_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                          "+00:00", "Z"
                      ),
                  }
              )
          ghcr = {
              "repository": descriptor["repository"],
              "package_present": package_present,
              "objects": objects,
          }
          release_listing = json.loads(
              root.joinpath("predicate-release-list.json").read_bytes()
          )
          release_contract = transaction._candidate_product_release_contract(  # noqa: SLF001
              manifest,
              transaction_authorization_digest=plan[
                  "transaction_authorization_digest"
              ],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          )
          predicate_context = transaction._release_promotion_predicate_context(  # noqa: SLF001
              manifest=manifest,
              transaction_authorization_digest=plan[
                  "transaction_authorization_digest"
              ],
              release_listing=release_listing,
              release_contract=release_contract,
              ghcr_observation=ghcr,
              expected_oci_digests=expected_digests,
          )
          authorization_path = (
              Path("transaction/release-execution-authorization.json")
              if plan["execution_authorization_digest"] is not None
              else Path("transaction/release-authorization.json")
          )
          authorization = json.loads(authorization_path.read_bytes())
          predicate = transaction.build_release_promotion_predicate(
              context=predicate_context,
              execution_authorization_digest=plan[
                  "execution_authorization_digest"
              ],
              promotion_run=authorization["promotion_run"],
          )
          prior = json.loads(root.joinpath("commit-attestations.json").read_bytes())
          existing_identities = {
              (item["kind"], item["name"], item["digest"])
              for item in prior["subjects"]
              if item["verification"] is not None
          }
          missing_subjects = [
              item
              for item in manifest["attestation_subjects"]
              if (item["kind"], item["name"], item["digest"])
              not in existing_identities
          ]
          requests = {
              kind: transaction._promotion_attestation_request_identity(  # noqa: SLF001
                  predicate=predicate,
                  subjects=[
                      item for item in missing_subjects if item["kind"] == kind
                  ],
              )
              for kind in ("file", "oci_index")
          }
          for operation, kind in (
              ("attest_github_assets", "file"),
              ("attest_oci_index_repository", "oci_index"),
          ):
              digest = transaction.release_stage_operation_request_digest(
