          FILE_7_OUTCOME: ${{ steps.attest-file-7.outcome }}
          OCI_ATTEST_OUTCOME: ${{ steps.attest-oci.outcome }}
        run: |
          test -f transaction/stages/release-commit-plan.json
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_REPOSITORY}/releases?per_page=100" \
            > transaction/stages/commit-post-release-list.json
          "$PINNED_GH" api --paginate --slurp \
            "users/John-MiracleWorker/packages?package_type=container&per_page=100" \
            > transaction/stages/commit-post-ghcr-packages.json
          package_present="$("$KESTREL_PYTHON" - \
            transaction/stages/commit-post-ghcr-packages.json <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts import release_promotion_transaction as transaction
          value = json.loads(Path(sys.argv[1]).read_bytes())
          print("1" if transaction._ghcr_package_is_present(value) else "0")  # noqa: SLF001
          PY
          )"
          if test "$package_present" = 1; then
            "$PINNED_GH" api --paginate --slurp \
              "users/John-MiracleWorker/packages/container/kestrel/versions?per_page=100" \
              > transaction/stages/commit-post-ghcr-package-versions.json
          else
            printf '[[]]\n' > transaction/stages/commit-post-ghcr-package-versions.json
          fi
          "$KESTREL_PYTHON" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/stages")
          bundle = Path("transaction/candidate")
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          plan = json.loads(root.joinpath("release-commit-plan.json").read_bytes())
          transaction._validated_stage_plan(plan, stage=2)  # noqa: SLF001
          candidate = plan["candidate"]

          github_opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "kestrel-release-transaction/1",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def github_get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/{path}", headers=github_headers
              )
              with github_opener.open(request, timeout=30) as response:
                  return json.loads(response.read(receipts.MAX_SOURCE_BODY_BYTES + 1))

          try:
              tag_ref = github_get(
                  f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/ref/tags/"
                  + urllib.parse.quote(candidate["tag"], safe="")
              )
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              tag_observation = {"http_status": 404, "ref": None, "tag": None}
          else:
              target = tag_ref.get("object", {})
              tag_object = (
                  github_get(
                      f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/tags/"
                      f"{target.get('sha')}"
                  )
                  if target.get("type") == "tag"
                  else None
              )
              tag_observation = {
                  "http_status": 200,
                  "ref": tag_ref,
                  "tag": tag_object,
              }

          descriptor = json.loads(bundle.joinpath("containers/oci-descriptor.json").read_bytes())
          expected_digests = transaction._expected_oci_object_digests(bundle)  # noqa: SLF001
          manifest_digests = {
              descriptor["index_digest"],
              *(item["manifest_digest"] for item in descriptor["platforms"]),
          }
          bearer = transaction.fetch_ghcr_pull_token(
              os.environ["GHCR_READ_TOKEN"].encode("ascii")
          )
          registry_api = transaction.DirectOCIReadAPI(
              token=bearer.encode("ascii")
          )
          tags_by_digest = transaction._ghcr_tags_by_digest_from_package_versions(  # noqa: SLF001
              json.loads(
                  root.joinpath("commit-post-ghcr-package-versions.json").read_bytes()
              )
          )
          package_present = transaction._ghcr_package_is_present(  # noqa: SLF001
              json.loads(root.joinpath("commit-post-ghcr-packages.json").read_bytes())
          )
          objects = []
          for digest in expected_digests:
              kind = "manifests" if digest in manifest_digests else "blobs"
              observation = registry_api.read_digest(
                  kind=kind,
                  digest=digest,
                  max_bytes=2_147_483_648,
              )
              objects.append(
                  {
                      "digest": digest,
                      "http_status": observation.http_status,
                      "tags": tags_by_digest.get(digest, []),
                      "tag_inventory_complete": (
                          observation.http_status == 404
                          or kind == "blobs"
                          or digest in tags_by_digest
                      ),
                      "observed_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                          "+00:00", "Z"
                      ),
                  }
              )
          ghcr = {
              "repository": descriptor["repository"],
              "package_present": package_present,
              "objects": objects,
          }

          common = [
              "--repo",
              os.environ["PROMOTION_REPOSITORY"],
              "--signer-workflow",
              f"{os.environ['PROMOTION_REPOSITORY']}/.github/workflows/release.yml",
              "--signer-digest",
              candidate["source_sha"],
              "--source-digest",
              candidate["source_sha"],
              "--predicate-type",
              transaction._RELEASE_PROMOTION_PREDICATE_TYPE,  # noqa: SLF001
              "--deny-self-hosted-runners",
              "--format",
              "json",
          ]
          subjects = []
          for subject in manifest["attestation_subjects"]:
              target = (
                  str((bundle / subject["name"]).resolve(strict=True))
                  if subject["kind"] == "file"
                  else f"oci://{subject['name']}@{subject['digest']}"
              )
              subjects.append(
                  transaction._observe_promotion_attestation_subject(  # noqa: SLF001
                      subject=subject,
                      target=target,
                      pinned_gh=Path(os.environ["PINNED_GH"]),
                      repository=os.environ["PROMOTION_REPOSITORY"],
                      expected_repository_id=manifest["source"]["repository_id"],
                      common_arguments=common,
                      token=os.environ["GH_TOKEN"],
                      label="post-commit attestation",
                  )
              )
          raw_attestations = {"subjects": subjects}

          release_raw = root.joinpath("commit-post-release-list.json").read_bytes()
          release_pages = json.loads(release_raw)
          contract = transaction._candidate_product_release_contract(  # noqa: SLF001
              manifest,
              transaction_authorization_digest=plan["transaction_authorization_digest"],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          )
          predicate_context = transaction._release_promotion_predicate_context(  # noqa: SLF001
              manifest=manifest,
              transaction_authorization_digest=plan[
                  "transaction_authorization_digest"
              ],
              release_listing=release_pages,
              release_contract=contract,
              ghcr_observation=ghcr,
              expected_oci_digests=expected_digests,
          )
          attestations = transaction.authorize_promotion_attestation_observation(
              raw_attestations,
              manifest=manifest,
              expected_context=predicate_context,
              recovery_capsule_digest=plan["recovery_capsule_digest"],
              api=transaction.DirectGitHubReadAPI(
                  token=os.environ["RELEASE_RECOVERY_READER_TOKEN_BYTES"].encode("ascii")
              ),
          )
          release_state = transaction._classify_product_release_listing(  # noqa: SLF001
              release_pages, contract=contract
          )
          tag_state = transaction._classify_commit_tag_observation(  # noqa: SLF001
              tag_observation,
              candidate=candidate,
              transaction_authorization_digest=plan["transaction_authorization_digest"],
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          )
          ghcr_state = transaction._classify_ghcr_digest_observation(  # noqa: SLF001
              ghcr, expected_digests=expected_digests
          )
          if ghcr_state != "existing_exact":
              raise SystemExit("candidate GHCR objects drifted during commit")
          attestation_states = transaction._classify_promotion_attestation_observation(  # noqa: SLF001
              attestations,
              manifest=manifest,
              expected_context=predicate_context,
              recovery_capsule_digest=plan["recovery_capsule_digest"],
          )
          states = {
              "attest_github_assets": attestation_states["file"],
              "attest_oci_index_repository": attestation_states["oci_index"],
              "create_tag": tag_state,
              "publish_github_release_draft": (
                  "existing_exact"
                  if release_state["release"] == "immutable_exact"
                  else "missing"
              ),
          }
          attempt = (
              json.loads(root.joinpath("commit-attempt.json").read_bytes())
              if root.joinpath("commit-attempt.json").is_file()
              else {
                  "attempted": [],
                  "failure": "stage_not_started",
                  "precondition_observation_digest": None,
                  "prepublish_release_observation_digest": None,
              }
          )
          file_actions = [os.environ[f"FILE_{index}_ACTION"] for index in range(8)]
          file_outcomes = [
              os.environ.get(f"FILE_{index}_OUTCOME", "skipped")
              for index in range(8)
          ]
          expected_file_outcomes = [
              outcome
              for action, outcome in zip(file_actions, file_outcomes, strict=True)
              if action == "create"
          ]
          if expected_file_outcomes and all(
              outcome == "success" for outcome in expected_file_outcomes
          ):
              file_attest_outcome = "success"
          elif any(
              outcome in {"success", "failure"}
              for outcome in expected_file_outcomes
          ):
              file_attest_outcome = "failure"
          else:
              file_attest_outcome = "skipped"
          action_outcomes = {
              "attest_github_assets": file_attest_outcome,
              "attest_oci_index_repository": os.environ.get(
                  "OCI_ATTEST_OUTCOME", "skipped"
              ),
          }
          attempted = set(attempt["attempted"])
          for name, action_outcome in action_outcomes.items():
              if action_outcome in {"success", "failure"}:
                  attempted.add(name)

          combined_raw = receipts.canonical_external_json_bytes(
              {
                  "attestations": attestations,
                  "ghcr": ghcr,
                  "mutation_attempt": attempt,
                  "release": release_pages,
                  "tag": tag_observation,
              }
          )
          observation_digest = receipts._sha256(combined_raw)  # noqa: SLF001
          outcomes = []
          for operation in plan["operations"]:
              name = operation["operation"]
              if operation["action"] == "no_op":
                  outcome = (
                      "existing_exact" if states[name] == "existing_exact" else "unknown"
                  )
              elif (
                  states[name] == "existing_exact"
                  and (
                      (name in action_outcomes and action_outcomes[name] == "success")
                      or (
                          name not in action_outcomes
                          and name in attempted
                          and attempt["failure"] is None
                      )
                  )
              ):
                  outcome = "created"
              elif name in attempted:
                  outcome = "unknown"
              else:
                  outcome = "not_attempted"
              outcomes.append(
                  {
                      "operation": name,
                      "request_digest": operation["request_digest"],
                      "response_observation_digest": observation_digest,
                      "outcome": outcome,
                  }
              )
          completed = all(item["outcome"] in {"created", "existing_exact"} for item in outcomes)
          uncertain = any(item["outcome"] == "unknown" for item in outcomes)
          pending = any(item["outcome"] == "not_attempted" for item in outcomes)

          captured_at = (
              datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          )

          def envelope(*, name, provider, locator, raw, pages, records):
              return receipts.canonical_json_bytes(
                  {
                      "schema": receipts.SOURCE_OBSERVATION_SCHEMA,
                      "name": name,
                      "provider": provider,
                      "locator": locator,
                      "authenticated_as": "John-MiracleWorker",
                      "freshness_class": "current",
                      "captured_at": captured_at,
                      "page_count": pages,
                      "record_count": records,
                      "complete": True,
                      "body_encoding": "base64",
                      "body": base64.b64encode(raw).decode("ascii"),
                  }
              )

          source_values = [
              envelope(
                  name="final-release-list-observation",
                  provider="github.com",
                  locator="GET /repos/John-MiracleWorker/Kestrel/releases?per_page=100",
                  raw=release_raw,
                  pages=len(release_pages),
                  records=sum(len(page) for page in release_pages),
              ),
              envelope(
                  name="final-ghcr-observation",
                  provider="github.com",
                  locator="GET digest-addressed GHCR manifests for candidate inventory",
                  raw=receipts.canonical_json_bytes(ghcr),
                  pages=1,
                  records=len(objects),
              ),
              envelope(
                  name="tag-observation",
                  provider="github.com",
                  locator=(
                      "GET /repos/John-MiracleWorker/Kestrel/git/ref/tags/{tag} "
                      "and annotated tag"
                  ),
                  raw=receipts.canonical_json_bytes(tag_observation),
                  pages=1,
                  records=1,
              ),
              envelope(
                  name="final-attestation-observation",
                  provider="github.com",
                  locator="gh attestation verify exact Kestrel candidate subjects",
                  raw=receipts.canonical_json_bytes(attestations),
                  pages=1,
                  records=1,
              ),
          ]
          post = {
              "schema": "kestrel.release_stage_execution.v1",
              "stage": 2,
              "observations": sorted(
                  [receipts.source_snapshot(raw) for raw in source_values],
                  key=lambda item: item["name"],
              ),
              "operation_outcomes": outcomes,
              "completed": completed,
              "uncertain": uncertain,
              "pending": pending,
          }
          root.joinpath("commit-post-observations.json").write_bytes(
              receipts.canonical_json_bytes(post)
          )
          PY
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            record-commit transaction/stages/release-commit-plan.json \
            --pre-observations transaction/stages/commit-pre-observations.json \
            --post-observations transaction/stages/commit-post-observations.json \
            --output transaction/stages/release-commit-outcome.json

      - name: Upload preserved commit evidence
        id: upload-commit
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-release-commit-${{ github.run_id }}-1
          path: |
            transaction
            !transaction/capsule/**
            transaction/stages/release-commit-outcome.json
          if-no-files-found: warn
          retention-days: 30

      - name: Propagate the preserved stage result
        if: ${{ always() }}
        shell: bash
        env:
          EXECUTE_OUTCOME: ${{ steps.execute-commit.outcome }}
          FILE_ACTION: ${{ steps.commit-plan.outputs.attest_files }}
          FILE_0_ACTION: ${{ steps.commit-plan.outputs.file_0_action }}
          FILE_0_OUTCOME: ${{ steps.attest-file-0.outcome }}
          FILE_1_ACTION: ${{ steps.commit-plan.outputs.file_1_action }}
          FILE_1_OUTCOME: ${{ steps.attest-file-1.outcome }}
          FILE_2_ACTION: ${{ steps.commit-plan.outputs.file_2_action }}
          FILE_2_OUTCOME: ${{ steps.attest-file-2.outcome }}
          FILE_3_ACTION: ${{ steps.commit-plan.outputs.file_3_action }}
          FILE_3_OUTCOME: ${{ steps.attest-file-3.outcome }}
          FILE_4_ACTION: ${{ steps.commit-plan.outputs.file_4_action }}
          FILE_4_OUTCOME: ${{ steps.attest-file-4.outcome }}
          FILE_5_ACTION: ${{ steps.commit-plan.outputs.file_5_action }}
          FILE_5_OUTCOME: ${{ steps.attest-file-5.outcome }}
          FILE_6_ACTION: ${{ steps.commit-plan.outputs.file_6_action }}
          FILE_6_OUTCOME: ${{ steps.attest-file-6.outcome }}
          FILE_7_ACTION: ${{ steps.commit-plan.outputs.file_7_action }}
          FILE_7_OUTCOME: ${{ steps.attest-file-7.outcome }}
          OCI_ACTION: ${{ steps.commit-plan.outputs.attest_oci }}
          OCI_OUTCOME: ${{ steps.attest-oci.outcome }}
          RECORD_OUTCOME: ${{ steps.record-commit.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload-commit.outcome }}
        run: |
          test "$EXECUTE_OUTCOME" = success
          observed_file_create=0
          for index in 0 1 2 3 4 5 6 7; do
            action_name="FILE_${index}_ACTION"
            outcome_name="FILE_${index}_OUTCOME"
            action="${!action_name}"
            outcome="${!outcome_name}"
            if test "$action" = create; then
              observed_file_create=1
              test "$outcome" = success
            else
              test "$action" = no_op
              test "$outcome" = skipped
            fi
          done
          if test "$FILE_ACTION" = create; then
            test "$observed_file_create" = 1
          else
            test "$FILE_ACTION" = no_op
            test "$observed_file_create" = 0
          fi
          if test "$OCI_ACTION" = create; then
            test "$OCI_OUTCOME" = success
          else
            test "$OCI_OUTCOME" = skipped
          fi
          test "$RECORD_OUTCOME" = success
          test "$UPLOAD_OUTCOME" = success

  verify-github-ghcr:
    needs: commit-github-release
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out the dispatch-pinned transaction source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify the pinned recovery Python identity
        shell: bash
        run: |
          python_executable="$(readlink -f -- "$(command -v python)")"
          test -f "$python_executable"
          test ! -L "$python_executable"
          test "$(sha256sum "$python_executable" | cut -d ' ' -f 1)" = \
            "dcd2d22a91c5adb37fa3f54a3a16d2ed7616b84931eb606c0fdfbca38395dab8"
          test "$(python --version)" = "Python 3.11.14"

      - name: Install the pinned transaction runtime
        shell: bash
        run: |
          python scripts/bootstrap_uv.py "${RUNNER_TEMP}/kestrel-uv"
          pinned_uv="${RUNNER_TEMP}/kestrel-uv/uv"
          test "$($pinned_uv --version)" = "uv 0.9.21 (0dc9556ad 2025-12-30)"
          python -m venv --copies "${RUNNER_TEMP}/kestrel-transaction-venv"
          "$pinned_uv" export --frozen --no-dev --no-emit-local \
            --extra dev --group release --format requirements.txt \
            --output-file "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --no-build-isolation --no-deps -e '.[dev]'
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip check
          printf 'KESTREL_PYTHON=%s\n' \
            "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" >> "$GITHUB_ENV"

      - name: Restore preserved commit evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kestrel-release-commit-${{ github.run_id }}-1
          path: transaction

      - name: Bootstrap pinned GitHub CLI
        shell: bash
        run: |
          scripts/bootstrap_workflow_tools.sh "${RUNNER_TEMP}/kestrel-workflow-tools"
          pinned_gh="${RUNNER_TEMP}/kestrel-workflow-tools/gh"
          test "$($pinned_gh --version | head -n 1)" = \
            "gh version 2.97.0 (2026-02-26)"
          printf 'PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"
          printf 'KESTREL_PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"

      - name: Reverify the immutable recovery capsule before surface verification
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          test -f transaction/capsule-download/recovery-capsule.tar
          test ! -e transaction/capsule
          readarray -t capsule_inputs < <("$KESTREL_PYTHON" - <<'PY'
          import json
          import re
          from pathlib import Path

          signed = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-verification.json").read_bytes()
          )
          publication = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-publication.json").read_bytes()
          )
          claim = signed["verification"]
          assets = {item["name"]: item for item in claim["assets"]}
          tag = publication["tag"]
          if not isinstance(tag, str) or re.fullmatch(r"recovery-[1-9][0-9]*-1", tag) is None:
              raise SystemExit("recovery capsule publication tag is invalid")
          print(publication["archive_digest"])
          print(claim["capsule_manifest_digest"])
          print(claim["signing_key_fingerprint"])
          print(tag)
          print(assets["recovery-bootstrap.py"]["sha256"])
          PY
          )
          test "${#capsule_inputs[@]}" -eq 5
          cmp --silent scripts/bootstrap_recovery.py \
            "transaction/capsule-download/recovery-bootstrap.py"
          test "$(sha256sum \
            "transaction/capsule-download/recovery-bootstrap.py" | cut -d ' ' -f 1)" = \
            "${capsule_inputs[4]#sha256:}"
          recovery_tcb_python="$(bash scripts/bootstrap_recovery_tcb.sh \
            "${RUNNER_TEMP}/kestrel-recovery-bootstrap-tcb")"
          env -i LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 \
            "$recovery_tcb_python" -I -S -B \
            transaction/capsule-download/recovery-bootstrap.py \
            transaction/capsule-download/recovery-capsule.tar \
            --destination transaction/capsule \
            --expected-archive-digest "${capsule_inputs[0]}" \
            --expected-manifest-digest "${capsule_inputs[1]}" \
            --expected-owner-key-fingerprint "${capsule_inputs[2]}"
          install -d -m 0700 transaction/verify-capsule-observation
          recovery_tag="${capsule_inputs[3]}"
          "$PINNED_GH" api "repos/${PROMOTION_RECOVERY_REPOSITORY}" \
            > transaction/verify-capsule-observation/repository.json
          "$PINNED_GH" api \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/tags/${recovery_tag}" \
            > transaction/verify-capsule-observation/release.json
          release_id="$("$KESTREL_PYTHON" -c \
            'import json; print(json.load(open("transaction/verify-capsule-observation/release.json"))["id"])')"
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > transaction/verify-capsule-observation/assets-pages.json
          "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          root = Path("transaction/verify-capsule-observation")
          pages = json.loads(root.joinpath("assets-pages.json").read_bytes())
          root.joinpath("assets.json").write_text(
              json.dumps(
                  [item for page in pages for item in page],
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY
          "$PINNED_GH" release verify "$recovery_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --format json \
            > transaction/verify-capsule-observation/release-attestation.json
          for capsule_asset in \
            recovery-bootstrap.py \
            recovery-capsule-manifest.json \
            recovery-capsule.tar; do
            "$PINNED_GH" release verify-asset "$recovery_tag" \
              "transaction/capsule-download/$capsule_asset" \
              --repo "$PROMOTION_RECOVERY_REPOSITORY" \
              --format json \
              > "transaction/verify-capsule-observation/${capsule_asset}.attestation.json"
          done
          "$KESTREL_PYTHON" - \
            "$PINNED_GH" \
            "$PROMOTION_RECOVERY_REPOSITORY" \
            "$recovery_tag" \
            transaction/verify-capsule-observation/pinned-gh-release-verification.json <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          executable = Path(sys.argv[1])
          repository, tag, output_name = sys.argv[2:]
          digest = "sha256:" + hashlib.sha256(executable.read_bytes()).hexdigest()
          if digest != "sha256:141507c337e8b202ad398550c3b73d72f5af92e86f71665214538a81efd4c409":
              raise SystemExit("pinned GitHub CLI identity changed before observation")
          output = Path(output_name)
          result_specs = [
              ("release:verify", "release-attestation.json"),
              (
                  "release:verify-asset:recovery-bootstrap.py",
                  "recovery-bootstrap.py.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule-manifest.json",
                  "recovery-capsule-manifest.json.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule.tar",
                  "recovery-capsule.tar.attestation.json",
              ),
          ]
          results = []
          for operation, name in result_specs:
              raw = output.parent.joinpath(name).read_bytes()
              json.loads(raw)
              results.append(
                  {
                      "operation": operation,
                      "path": name,
                      "sha256": "sha256:" + hashlib.sha256(raw).hexdigest(),
                      "size_bytes": len(raw),
                  }
              )
          value = {
              "schema": "kestrel.pinned_gh_release_verification.v1",
              "pinned_gh_digest": digest,
              "pinned_gh_version": "gh version 2.97.0 (2026-02-26)",
              "repository": repository,
              "tag": tag,
              "results": results,
              "verified": True,
              "validation_status": "validated",
          }
          if output.exists() or output.is_symlink():
              raise SystemExit("pinned GitHub CLI observation output already exists")
          output.write_bytes(
              json.dumps(value, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode()
          )
          output.chmod(0o600)
          PY
          capsule_root="$GITHUB_WORKSPACE/transaction/capsule"
          capsule_python="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/environment/bin/python")"
          capsule_runtime="$(readlink -f -- "$capsule_root/recovery/runtime")"
          capsule_base_lib="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/base/lib")"
          capsule_loader="$capsule_runtime/ld-linux-x86-64.so.2"
          capsule_library_path="$capsule_runtime:$capsule_base_lib"
          capsule_receipts="$GITHUB_WORKSPACE/transaction/capsule/scripts/release_control_receipt.py"
          test ! -e /etc/ld.so.preload
          test -x "$capsule_python"
          test -x "$capsule_loader"
          test -f "$capsule_receipts"
          test -z "$(find "$capsule_runtime" -mindepth 1 -type d -print -quit)"
          capsule_private_loader() {
            local loader_report loader_line dependency
            loader_report="$(env -i "$capsule_loader" --inhibit-cache \
              --library-path "$capsule_library_path" --list "$capsule_python")"
            case "$loader_report" in *"not found"*) return 1 ;; esac
            while IFS= read -r loader_line; do
              loader_line="${loader_line#"${loader_line%%[![:space:]]*}"}"
              if [[ "$loader_line" == *" => "* ]]; then
                dependency="${loader_line#* => }"
                dependency="${dependency%% *}"
              elif [[ "$loader_line" == /* ]]; then
                dependency="${loader_line%% *}"
              else
                continue
              fi
              case "$dependency" in
                "$capsule_runtime"/*|"$capsule_base_lib"/*) ;;
                *) return 1 ;;
              esac
            done <<< "$loader_report"
            (
              exec -c "$capsule_loader" --inhibit-cache \
                --library-path "$capsule_library_path" "$capsule_python" "$@"
            )
          }
          (
            cd transaction/capsule-download
            capsule_private_loader -I -S -B -c \
              'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
              "$capsule_root" "$capsule_root/scripts/recovery_launcher.py" \
              launch "$capsule_root/recovery-execution-closure.json" \
              --capsule-root "$capsule_root" \
              --executable python -- \
              "$capsule_receipts" verify-recovery-capsule-release \
              "$GITHUB_WORKSPACE/transaction/capsule" \
              --publication-receipt \
                "$GITHUB_WORKSPACE/transaction/prepare-authority/recovery-capsule-publication.json" \
              --fresh-repository-observation \
                "$GITHUB_WORKSPACE/transaction/verify-capsule-observation/repository.json" \
              --fresh-release-observation \
                "$GITHUB_WORKSPACE/transaction/verify-capsule-observation/release.json" \
              --fresh-assets-observation \
                "$GITHUB_WORKSPACE/transaction/verify-capsule-observation/assets.json" \
              --pinned-gh-verification-observation \
                "$GITHUB_WORKSPACE/transaction/verify-capsule-observation/pinned-gh-release-verification.json" \
              --output "$GITHUB_WORKSPACE/transaction/verify-capsule-release-verification.json"
          )
          actuator_input_dir="$GITHUB_WORKSPACE/transaction/host-actuator/verify/inputs"
          install -d -m 0700 "$actuator_input_dir"
          install -m 0500 "$KESTREL_PYTHON" "$actuator_input_dir/python"
          install -m 0500 "$PINNED_GH" "$actuator_input_dir/gh"
          host_binding="$GITHUB_WORKSPACE/transaction/host-actuator/verify/host-actuator-binding.json"
          test ! -e "$host_binding"
          capsule_private_loader -I -S -B -c \
            'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
            "$capsule_root" \
            "$capsule_root/scripts/recovery_launcher.py" \
            launch "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --executable python -- \
            "$capsule_root/scripts/recovery_launcher.py" \
            bind-host-actuator "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --host-root "$GITHUB_WORKSPACE" \
            --host-python "$actuator_input_dir/python" \
            --host-gh "$actuator_input_dir/gh" \
            --output "$host_binding"
          grep -Fq '"method":"offline-authority-host-actuator-binding"' \
            "$host_binding"
          printf 'KESTREL_HOST_ACTUATOR_BINDING=%s\n' \
            "$host_binding" >> "$GITHUB_ENV"

      - name: Download the fresh verification authority boundary
        shell: bash
        env:
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            fetch-github-boundary-authority \
            --boundary verify \
            --run-id "$PROMOTION_RUN_ID" \
            --output-dir transaction/verification-authority

      - name: Verify both injected credentials at the verification boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
          RELEASE_GUARD_TOKEN_BYTES: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          for credential in recovery-reader release-guard; do
            if test "$credential" = recovery-reader; then
              token="$RELEASE_RECOVERY_READER_TOKEN_BYTES"
            else
              token="$RELEASE_GUARD_TOKEN_BYTES"
            fi
            printf '%s' "$token" | \
              "$KESTREL_PYTHON" -m scripts.release_control_receipt \
                verify-runtime-credential \
                --scope-authority \
                  "transaction/verification-authority/${credential}-scope-authority.json" \
                --scope-authority-signature \
                  "transaction/verification-authority/${credential}-scope-authority.json.sig" \
                --owner-signing-keys-observation \
                  transaction/verification-authority/owner-signing-keys-observation.json \
                --identity-probe-observation \
                  "transaction/verification-authority/${credential}-identity-probe.json" \
                --endpoint-probe-observations \
                  "transaction/verification-authority/${credential}-endpoint-probes.json" \
                --output \
                  "transaction/verification-authority/${credential}-runtime-verification.json"
          done

      - name: Capture fresh independent verification boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            capture-prerequisite-boundary \
            --registry transaction/capsule/release-control-source-registry.json \
            --repository "$PROMOTION_REPOSITORY" \
            --recovery-repository "$PROMOTION_RECOVERY_REPOSITORY" \
            --candidate-ref "$PROMOTION_SHA" \
            --run-id "$PROMOTION_RUN_ID" \
            --output-dir transaction/verification-boundary

      - name: Validate the independent repository authority boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            inspect-prerequisites \
            --mode operational \
            --transaction-mode "$PROMOTION_MODE" \
            --repository-observation \
              transaction/verification-boundary/repository-observation.json \
            --repository-collaborators-observation \
              transaction/verification-boundary/repository-collaborators-observation.json \
            --repository-invitations-observation \
              transaction/verification-boundary/repository-invitations-observation.json \
            --deploy-keys-observation \
              transaction/verification-boundary/deploy-keys-observation.json \
            --actions-workflow-permissions-observation \
              transaction/verification-boundary/actions-workflow-permissions-observation.json \
            --owner-signing-keys-observation \
              transaction/verification-boundary/owner-signing-keys-observation.json \
            --workflow-source-root transaction/capsule \
            --main-branch-observation \
              transaction/verification-boundary/main-branch-observation.json \
            --immutable-releases-observation \
              transaction/verification-boundary/immutable-releases-observation.json \
            --rulesets-observation transaction/verification-boundary/rulesets-observation.json \
            --tag-ruleset-detail-observation \
              transaction/verification-boundary/tag-ruleset-detail-observation.json \
            --ingress-ruleset-detail-observation \
              transaction/verification-boundary/ingress-ruleset-detail-observation.json \
            --workflow-observation transaction/verification-boundary/workflow-observation.json \
            --default-branch-workflow-contents \
              transaction/verification-boundary/default-branch-workflow-contents.json \
            --candidate-workflow-contents \
              transaction/verification-boundary/candidate-workflow-contents.json \
            --recovery-repository-observation \
              transaction/verification-boundary/recovery-repository-observation.json \
            --recovery-immutable-releases-observation \
              transaction/verification-boundary/recovery-immutable-releases-observation.json \
            --recovery-authority-verification \
              transaction/authority-evidence/recovery-authority-verification.json \
            --github-authority-verification \
              transaction/commit-authority/github-commit-authority-verification.json \
            --pypi-authority-verification \
              transaction/authority-evidence/pypi-authority-verification.json \
            --expected-repository "$PROMOTION_REPOSITORY" \
            --expected-owner-login John-MiracleWorker \
            --expected-owner-user-id 58918509 \
            --environment-observation \
              release=transaction/verification-boundary/environment-release-observation.json \
            --environment-observation \
              release-prepare=transaction/verification-boundary/environment-release-prepare-observation.json \
            --environment-observation \
              release-commit=transaction/verification-boundary/environment-release-commit-observation.json \
            --environment-observation \
              pypi=transaction/verification-boundary/environment-pypi-observation.json \
            --environment-policies-observation \
              release=transaction/verification-boundary/environment-release-policies-observation.json \
            --environment-policies-observation \
              release-prepare=transaction/verification-boundary/environment-release-prepare-policies-observation.json \
            --environment-policies-observation \
              release-commit=transaction/verification-boundary/environment-release-commit-policies-observation.json \
            --environment-policies-observation \
              pypi=transaction/verification-boundary/environment-pypi-policies-observation.json \
            --output transaction/verification-prerequisites.json

      - name: Independently observe and verify every GitHub and GHCR surface
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          GHCR_READ_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          install -d -m 0700 transaction/verification
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_REPOSITORY}/releases?per_page=100" \
            > transaction/verification/release-list.json
          "$PINNED_GH" api --paginate --slurp \
            "users/John-MiracleWorker/packages?package_type=container&per_page=100" \
            > transaction/verification/ghcr-packages.json
          package_present="$("$KESTREL_PYTHON" - \
            transaction/verification/ghcr-packages.json <<'PY'
          import json
          import sys
          from pathlib import Path
          from scripts import release_promotion_transaction as transaction
          value = json.loads(Path(sys.argv[1]).read_bytes())
          print("1" if transaction._ghcr_package_is_present(value) else "0")  # noqa: SLF001
          PY
          )"
          if test "$package_present" = 1; then
            "$PINNED_GH" api --paginate --slurp \
              "users/John-MiracleWorker/packages/container/kestrel/versions?per_page=100" \
              > transaction/verification/ghcr-package-versions.json
          else
            printf '[[]]\n' > transaction/verification/ghcr-package-versions.json
          fi
          "$KESTREL_PYTHON" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import ssl
          import subprocess
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/verification")
          bundle = Path("transaction/candidate")
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          candidate, _repository_id = receipts._candidate_from_manifest(  # noqa: SLF001
              bundle.joinpath("candidate-manifest.json").read_bytes()
          )
          transaction_raw = Path("transaction/release-authorization.json").read_bytes()
          transaction_digest = receipts._sha256(transaction_raw)  # noqa: SLF001
          capsule = json.loads(
              Path(
                  "transaction/prepare-authority/recovery-capsule-verification.json"
              ).read_bytes()
          )
          capsule_digest = capsule["verification"]["capsule_manifest_digest"]

          github_opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          github_headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "User-Agent": "kestrel-release-transaction/1",
              "X-GitHub-Api-Version": "2026-03-10",
          }

          def github_get(path):
              request = urllib.request.Request(
                  f"https://api.github.com/{path}", headers=github_headers
              )
              with github_opener.open(request, timeout=30) as response:
                  return json.loads(response.read(receipts.MAX_SOURCE_BODY_BYTES + 1))

          try:
              tag_ref = github_get(
                  f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/ref/tags/"
                  + urllib.parse.quote(candidate["tag"], safe="")
              )
          except urllib.error.HTTPError as error:
              if error.code != 404:
                  raise
              tag_observation = {"http_status": 404, "ref": None, "tag": None}
          else:
              target = tag_ref.get("object", {})
              tag_object = (
                  github_get(
                      f"repos/{os.environ['PROMOTION_REPOSITORY']}/git/tags/"
                      f"{target.get('sha')}"
                  )
                  if target.get("type") == "tag"
                  else None
              )
              tag_observation = {
                  "http_status": 200,
                  "ref": tag_ref,
                  "tag": tag_object,
              }

          descriptor = json.loads(bundle.joinpath("containers/oci-descriptor.json").read_bytes())
          expected_digests = transaction._expected_oci_object_digests(bundle)  # noqa: SLF001
          manifest_digests = {
              descriptor["index_digest"],
              *(item["manifest_digest"] for item in descriptor["platforms"]),
          }
          bearer = transaction.fetch_ghcr_pull_token(
              os.environ["GHCR_READ_TOKEN"].encode("ascii")
          )
          registry_api = transaction.DirectOCIReadAPI(
              token=bearer.encode("ascii")
          )
          tags_by_digest = transaction._ghcr_tags_by_digest_from_package_versions(  # noqa: SLF001
              json.loads(root.joinpath("ghcr-package-versions.json").read_bytes())
          )
          package_present = transaction._ghcr_package_is_present(  # noqa: SLF001
              json.loads(root.joinpath("ghcr-packages.json").read_bytes())
          )
          objects = []
          for digest in expected_digests:
              kind = "manifests" if digest in manifest_digests else "blobs"
              observation = registry_api.read_digest(
                  kind=kind,
                  digest=digest,
                  max_bytes=2_147_483_648,
              )
              if observation.http_status != 200:
                  raise SystemExit("verification GHCR object is unavailable")
              objects.append(
                  {
                      "digest": digest,
                      "http_status": 200,
                      "tags": tags_by_digest.get(digest, []),
                      "tag_inventory_complete": (
                          kind == "blobs" or digest in tags_by_digest
                      ),
                      "observed_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                          "+00:00", "Z"
                      ),
                  }
              )
          ghcr = {
              "repository": descriptor["repository"],
              "package_present": package_present,
              "objects": objects,
          }

          common = [
              "--repo",
              os.environ["PROMOTION_REPOSITORY"],
              "--signer-workflow",
              f"{os.environ['PROMOTION_REPOSITORY']}/.github/workflows/release.yml",
              "--signer-digest",
              candidate["source_sha"],
              "--source-digest",
              candidate["source_sha"],
              "--predicate-type",
              transaction._RELEASE_PROMOTION_PREDICATE_TYPE,  # noqa: SLF001
              "--deny-self-hosted-runners",
              "--format",
              "json",
          ]
          subjects = []
          for subject in manifest["attestation_subjects"]:
              target = (
                  str((bundle / subject["name"]).resolve(strict=True))
                  if subject["kind"] == "file"
                  else f"oci://{subject['name']}@{subject['digest']}"
              )
              observed_subject = transaction._observe_promotion_attestation_subject(  # noqa: SLF001
                  subject=subject,
                  target=target,
                  pinned_gh=Path(os.environ["PINNED_GH"]),
                  repository=os.environ["PROMOTION_REPOSITORY"],
                  expected_repository_id=manifest["source"]["repository_id"],
                  common_arguments=common,
                  token=os.environ["GH_TOKEN"],
                  label="independent attestation",
              )
              if observed_subject["verification"] is None:
                  raise SystemExit("independent custom attestation is absent")
              subjects.append(observed_subject)
          raw_attestations = {"subjects": subjects}
          release_pages = json.loads(root.joinpath("release-list.json").read_bytes())
          release_contract = transaction._candidate_product_release_contract(  # noqa: SLF001
              manifest,
              transaction_authorization_digest=transaction_digest,
              recovery_capsule_digest=capsule_digest,
          )
          predicate_context = transaction._release_promotion_predicate_context(  # noqa: SLF001
              manifest=manifest,
              transaction_authorization_digest=transaction_digest,
              release_listing=release_pages,
              release_contract=release_contract,
              ghcr_observation=ghcr,
              expected_oci_digests=expected_digests,
          )
          attestations = transaction.authorize_promotion_attestation_observation(
              raw_attestations,
              manifest=manifest,
              expected_context=predicate_context,
              recovery_capsule_digest=capsule_digest,
              api=transaction.DirectGitHubReadAPI(
                  token=os.environ["RELEASE_RECOVERY_READER_TOKEN_BYTES"].encode("ascii")
              ),
          )
          release_state = transaction._classify_product_release_listing(  # noqa: SLF001
              release_pages, contract=release_contract
          )
          ghcr_state = transaction._classify_ghcr_digest_observation(  # noqa: SLF001
              ghcr, expected_digests=expected_digests
          )
          tag_state = transaction._classify_commit_tag_observation(  # noqa: SLF001
              tag_observation,
              candidate=candidate,
              transaction_authorization_digest=transaction_digest,
              recovery_capsule_digest=capsule_digest,
          )
          attestation_state = transaction._classify_promotion_attestation_observation(  # noqa: SLF001
              attestations,
              manifest=manifest,
              expected_context=predicate_context,
              recovery_capsule_digest=capsule_digest,
          )
          completed = (
              release_state["release"] == "immutable_exact"
              and release_state["assets"] == "existing_exact"
              and ghcr_state == "existing_exact"
              and tag_state == "existing_exact"
              and all(value == "existing_exact" for value in attestation_state.values())
          )
          if not completed:
              raise SystemExit("independent GitHub/GHCR surface is incomplete")

          captured_at = (
              datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          )

          def envelope(*, name, locator, raw, pages, records):
              return receipts.canonical_json_bytes(
                  {
                      "schema": receipts.SOURCE_OBSERVATION_SCHEMA,
                      "name": name,
                      "provider": "github.com",
                      "locator": locator,
                      "authenticated_as": "John-MiracleWorker",
                      "freshness_class": "current",
                      "captured_at": captured_at,
                      "page_count": pages,
                      "record_count": records,
                      "complete": True,
                      "body_encoding": "base64",
                      "body": base64.b64encode(raw).decode("ascii"),
                  }
              )

          release_raw = root.joinpath("release-list.json").read_bytes()
          source_values = [
              envelope(
                  name="final-release-list-observation",
                  locator="GET /repos/John-MiracleWorker/Kestrel/releases?per_page=100",
                  raw=release_raw,
                  pages=len(release_pages),
                  records=sum(len(page) for page in release_pages),
              ),
              envelope(
                  name="final-ghcr-observation",
                  locator="GET digest-addressed GHCR manifests for candidate inventory",
                  raw=receipts.canonical_json_bytes(ghcr),
                  pages=1,
                  records=len(objects),
              ),
              envelope(
                  name="tag-observation",
                  locator=(
                      "GET /repos/John-MiracleWorker/Kestrel/git/ref/tags/{tag} "
                      "and annotated tag"
                  ),
                  raw=receipts.canonical_json_bytes(tag_observation),
                  pages=1,
                  records=1,
              ),
              envelope(
                  name="final-attestation-observation",
                  locator="gh attestation verify exact Kestrel candidate subjects",
                  raw=receipts.canonical_json_bytes(attestations),
                  pages=1,
                  records=1,
              ),
          ]
          fresh = {
              "schema": "github.release_surface_observation.v1",
              "observations": sorted(
                  [receipts.source_snapshot(raw) for raw in source_values],
                  key=lambda item: item["name"],
              ),
              "verification_results": [],
              "completed": completed,
              "release_list": release_pages,
              "ghcr": ghcr,
              "tag": tag_observation,
              "attestations": attestations,
          }
          root.joinpath("github-ghcr-fresh-observations.json").write_bytes(
              receipts.canonical_json_bytes(fresh)
          )
          PY
          execution_arguments=()
          if test "$PROMOTION_MODE" = recover_committed; then
            execution_arguments=(
              --execution-authorization
              transaction/release-execution-authorization.json
            )
          fi
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            verify-github-ghcr transaction/candidate/candidate-manifest.json \
            --bundle-root transaction/candidate \
            --transaction-authorization transaction/release-authorization.json \
            "${execution_arguments[@]}" \
            --recovery-capsule-verification \
              transaction/prepare-authority/recovery-capsule-verification.json \
            --preparation-outcome \
              transaction/stages/release-preparation-outcome.json \
            --commit-outcome transaction/stages/release-commit-outcome.json \
            --fresh-observations \
              transaction/verification/github-ghcr-fresh-observations.json \
            --pinned-gh "$PINNED_GH" \
            --output transaction/stages/release-github-ghcr-verification.json

      - name: Upload independent GitHub and GHCR verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-release-github-ghcr-${{ github.run_id }}-1
          path: |
            transaction
            !transaction/capsule/**
          if-no-files-found: error
          retention-days: 30

  publish-pypi:
    needs: verify-github-ghcr
    runs-on: ubuntu-24.04
    environment:
      name: pypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Check out the dispatch-pinned transaction source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify the pinned recovery Python identity
        shell: bash
        run: |
          python_executable="$(readlink -f -- "$(command -v python)")"
          test -f "$python_executable"
          test ! -L "$python_executable"
          test "$(sha256sum "$python_executable" | cut -d ' ' -f 1)" = \
            "dcd2d22a91c5adb37fa3f54a3a16d2ed7616b84931eb606c0fdfbca38395dab8"
          test "$(python --version)" = "Python 3.11.14"

      - name: Install the pinned transaction and PyPI verification runtime
        shell: bash
        run: |
          python scripts/bootstrap_uv.py "${RUNNER_TEMP}/kestrel-uv"
          pinned_uv="${RUNNER_TEMP}/kestrel-uv/uv"
          test "$($pinned_uv --version)" = "uv 0.9.21 (0dc9556ad 2025-12-30)"
          python -m venv --copies "${RUNNER_TEMP}/kestrel-transaction-venv"
          "$pinned_uv" export --frozen --no-dev --no-emit-local \
            --extra dev --group release --format requirements.txt \
            --output-file "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --no-build-isolation --no-deps -e '.[dev]'
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip check
          verifier="${RUNNER_TEMP}/kestrel-transaction-venv/bin/pypi-attestations"
          test -x "$verifier"
          test "$($verifier --version)" = "pypi-attestations 0.0.30"
          printf 'KESTREL_PYTHON=%s\n' \
            "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" >> "$GITHUB_ENV"
          printf 'PYPI_ATTESTATIONS=%s\n' "$verifier" >> "$GITHUB_ENV"

      - name: Restore independent GitHub and GHCR verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kestrel-release-github-ghcr-${{ github.run_id }}-1
          path: transaction

      - name: Bootstrap pinned GitHub CLI
        shell: bash
        run: |
          scripts/bootstrap_workflow_tools.sh "${RUNNER_TEMP}/kestrel-workflow-tools"
          pinned_gh="${RUNNER_TEMP}/kestrel-workflow-tools/gh"
          test "$($pinned_gh --version | head -n 1)" = \
            "gh version 2.97.0 (2026-02-26)"
          printf 'PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"
          printf 'KESTREL_PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"

      - name: Reverify the immutable recovery capsule before PyPI admission
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          test -f transaction/capsule-download/recovery-capsule.tar
          test ! -e transaction/capsule
          readarray -t capsule_inputs < <("$KESTREL_PYTHON" - <<'PY'
          import json
          import re
          from pathlib import Path

          signed = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-verification.json").read_bytes()
          )
          publication = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-publication.json").read_bytes()
          )
          claim = signed["verification"]
          assets = {item["name"]: item for item in claim["assets"]}
          tag = publication["tag"]
          if not isinstance(tag, str) or re.fullmatch(r"recovery-[1-9][0-9]*-1", tag) is None:
              raise SystemExit("recovery capsule publication tag is invalid")
          print(publication["archive_digest"])
          print(claim["capsule_manifest_digest"])
          print(claim["signing_key_fingerprint"])
          print(tag)
          print(assets["recovery-bootstrap.py"]["sha256"])
          PY
          )
          test "${#capsule_inputs[@]}" -eq 5
          cmp --silent scripts/bootstrap_recovery.py \
            "transaction/capsule-download/recovery-bootstrap.py"
          test "$(sha256sum \
            "transaction/capsule-download/recovery-bootstrap.py" | cut -d ' ' -f 1)" = \
            "${capsule_inputs[4]#sha256:}"
          recovery_tcb_python="$(bash scripts/bootstrap_recovery_tcb.sh \
            "${RUNNER_TEMP}/kestrel-recovery-bootstrap-tcb")"
          env -i LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 \
            "$recovery_tcb_python" -I -S -B \
            transaction/capsule-download/recovery-bootstrap.py \
            transaction/capsule-download/recovery-capsule.tar \
            --destination transaction/capsule \
            --expected-archive-digest "${capsule_inputs[0]}" \
            --expected-manifest-digest "${capsule_inputs[1]}" \
            --expected-owner-key-fingerprint "${capsule_inputs[2]}"
          install -d -m 0700 transaction/pypi-capsule-observation
          recovery_tag="${capsule_inputs[3]}"
          "$PINNED_GH" api "repos/${PROMOTION_RECOVERY_REPOSITORY}" \
            > transaction/pypi-capsule-observation/repository.json
          "$PINNED_GH" api \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/tags/${recovery_tag}" \
            > transaction/pypi-capsule-observation/release.json
          release_id="$("$KESTREL_PYTHON" -c \
            'import json; print(json.load(open("transaction/pypi-capsule-observation/release.json"))["id"])')"
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > transaction/pypi-capsule-observation/assets-pages.json
          "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          root = Path("transaction/pypi-capsule-observation")
          pages = json.loads(root.joinpath("assets-pages.json").read_bytes())
          root.joinpath("assets.json").write_text(
              json.dumps(
                  [item for page in pages for item in page],
                  ensure_ascii=False,
                  separators=(",", ":"),
                  sort_keys=True,
              ),
              encoding="utf-8",
          )
          PY
          "$PINNED_GH" release verify "$recovery_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --format json \
            > transaction/pypi-capsule-observation/release-attestation.json
          for capsule_asset in \
            recovery-bootstrap.py \
            recovery-capsule-manifest.json \
            recovery-capsule.tar; do
            "$PINNED_GH" release verify-asset "$recovery_tag" \
              "transaction/capsule-download/$capsule_asset" \
              --repo "$PROMOTION_RECOVERY_REPOSITORY" \
              --format json \
              > "transaction/pypi-capsule-observation/${capsule_asset}.attestation.json"
          done
          "$KESTREL_PYTHON" - \
            "$PINNED_GH" \
            "$PROMOTION_RECOVERY_REPOSITORY" \
            "$recovery_tag" \
            transaction/pypi-capsule-observation/pinned-gh-release-verification.json <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          executable = Path(sys.argv[1])
          repository, tag, output_name = sys.argv[2:]
          digest = "sha256:" + hashlib.sha256(executable.read_bytes()).hexdigest()
          if digest != "sha256:141507c337e8b202ad398550c3b73d72f5af92e86f71665214538a81efd4c409":
              raise SystemExit("pinned GitHub CLI identity changed before observation")
          output = Path(output_name)
          result_specs = [
              ("release:verify", "release-attestation.json"),
              (
                  "release:verify-asset:recovery-bootstrap.py",
                  "recovery-bootstrap.py.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule-manifest.json",
                  "recovery-capsule-manifest.json.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule.tar",
                  "recovery-capsule.tar.attestation.json",
              ),
          ]
          results = []
          for operation, name in result_specs:
              raw = output.parent.joinpath(name).read_bytes()
              json.loads(raw)
              results.append(
                  {
                      "operation": operation,
                      "path": name,
                      "sha256": "sha256:" + hashlib.sha256(raw).hexdigest(),
                      "size_bytes": len(raw),
                  }
              )
          value = {
              "schema": "kestrel.pinned_gh_release_verification.v1",
              "pinned_gh_digest": digest,
              "pinned_gh_version": "gh version 2.97.0 (2026-02-26)",
              "repository": repository,
              "tag": tag,
              "results": results,
              "verified": True,
              "validation_status": "validated",
          }
          if output.exists() or output.is_symlink():
              raise SystemExit("pinned GitHub CLI observation output already exists")
          output.write_bytes(
              json.dumps(value, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode()
          )
          output.chmod(0o600)
          PY
          capsule_root="$GITHUB_WORKSPACE/transaction/capsule"
          capsule_python="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/environment/bin/python")"
          capsule_runtime="$(readlink -f -- "$capsule_root/recovery/runtime")"
          capsule_base_lib="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/base/lib")"
          capsule_loader="$capsule_runtime/ld-linux-x86-64.so.2"
          capsule_library_path="$capsule_runtime:$capsule_base_lib"
          capsule_receipts="$GITHUB_WORKSPACE/transaction/capsule/scripts/release_control_receipt.py"
          test ! -e /etc/ld.so.preload
          test -x "$capsule_python"
          test -x "$capsule_loader"
          test -f "$capsule_receipts"
          test -z "$(find "$capsule_runtime" -mindepth 1 -type d -print -quit)"
          capsule_private_loader() {
            local loader_report loader_line dependency
            loader_report="$(env -i "$capsule_loader" --inhibit-cache \
              --library-path "$capsule_library_path" --list "$capsule_python")"
            case "$loader_report" in *"not found"*) return 1 ;; esac
            while IFS= read -r loader_line; do
              loader_line="${loader_line#"${loader_line%%[![:space:]]*}"}"
              if [[ "$loader_line" == *" => "* ]]; then
                dependency="${loader_line#* => }"
                dependency="${dependency%% *}"
              elif [[ "$loader_line" == /* ]]; then
                dependency="${loader_line%% *}"
              else
                continue
              fi
              case "$dependency" in
                "$capsule_runtime"/*|"$capsule_base_lib"/*) ;;
                *) return 1 ;;
              esac
            done <<< "$loader_report"
            (
              exec -c "$capsule_loader" --inhibit-cache \
                --library-path "$capsule_library_path" "$capsule_python" "$@"
            )
          }
          (
            cd transaction/capsule-download
            capsule_private_loader -I -S -B -c \
              'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
              "$capsule_root" "$capsule_root/scripts/recovery_launcher.py" \
              launch "$capsule_root/recovery-execution-closure.json" \
              --capsule-root "$capsule_root" \
              --executable python -- \
              "$capsule_receipts" verify-recovery-capsule-release \
              "$GITHUB_WORKSPACE/transaction/capsule" \
              --publication-receipt \
                "$GITHUB_WORKSPACE/transaction/prepare-authority/recovery-capsule-publication.json" \
              --fresh-repository-observation \
                "$GITHUB_WORKSPACE/transaction/pypi-capsule-observation/repository.json" \
              --fresh-release-observation \
                "$GITHUB_WORKSPACE/transaction/pypi-capsule-observation/release.json" \
              --fresh-assets-observation \
                "$GITHUB_WORKSPACE/transaction/pypi-capsule-observation/assets.json" \
              --pinned-gh-verification-observation \
                "$GITHUB_WORKSPACE/transaction/pypi-capsule-observation/pinned-gh-release-verification.json" \
              --output "$GITHUB_WORKSPACE/transaction/pypi-capsule-release-verification.json"
          )
          actuator_input_dir="$GITHUB_WORKSPACE/transaction/host-actuator/pypi/inputs"
          install -d -m 0700 "$actuator_input_dir"
          install -m 0500 "$KESTREL_PYTHON" "$actuator_input_dir/python"
          install -m 0500 "$PINNED_GH" "$actuator_input_dir/gh"
          host_binding="$GITHUB_WORKSPACE/transaction/host-actuator/pypi/host-actuator-binding.json"
          test ! -e "$host_binding"
          capsule_private_loader -I -S -B -c \
            'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
            "$capsule_root" \
            "$capsule_root/scripts/recovery_launcher.py" \
            launch "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --executable python -- \
            "$capsule_root/scripts/recovery_launcher.py" \
            bind-host-actuator "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --host-root "$GITHUB_WORKSPACE" \
            --host-python "$actuator_input_dir/python" \
            --host-gh "$actuator_input_dir/gh" \
            --output "$host_binding"
          grep -Fq '"method":"offline-authority-host-actuator-binding"' \
            "$host_binding"
          printf 'KESTREL_HOST_ACTUATOR_BINDING=%s\n' \
            "$host_binding" >> "$GITHUB_ENV"

      - name: Observe public PyPI and stage only missing distributions
        id: pypi-plan
        shell: bash
        run: |
          install -d -m 0700 transaction/pypi transaction/pypi-dist
          "$KESTREL_PYTHON" - <<'PY'
          import base64
          import hashlib
          import json
          import os
          import shutil
          import ssl
          import subprocess
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_control_receipt as receipts
          from scripts import release_promotion_transaction as transaction

          root = Path("transaction/pypi")
          bundle = Path("transaction/candidate")
          manifest = json.loads(bundle.joinpath("candidate-manifest.json").read_bytes())
          expected = transaction._candidate_pypi_files(manifest)  # noqa: SLF001
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          request = urllib.request.Request(
              "https://pypi.org/pypi/nested-memvid-agent/json",
              headers={"Accept": "application/json", "User-Agent": "kestrel/0.6"},
          )
          with opener.open(request, timeout=30) as response:
              project_raw = response.read(receipts.MAX_SOURCE_BODY_BYTES + 1)
          if len(project_raw) > receipts.MAX_SOURCE_BODY_BYTES:
              raise SystemExit("PyPI project observation exceeds the evidence boundary")
          project = receipts.parse_external_json_bytes(
              project_raw, label="PyPI pre-publication project observation"
          )
          state = transaction._classify_pypi_project_observation(  # noqa: SLF001
              project, version=manifest["version"], expected_files=expected
          )
          root.joinpath("pre-project.json").write_bytes(
              receipts.canonical_external_json_bytes(project)
          )
          observed = {
              item["filename"]: item
              for item in project["releases"].get(manifest["version"], [])
          }
          for filename in state["present"]:
              item = expected[filename]
              local_path = root / "existing" / filename
              local_path.parent.mkdir(mode=0o700, parents=True, exist_ok=True)
              download = urllib.request.Request(
                  observed[filename]["url"],
                  headers={"Accept": "application/octet-stream", "User-Agent": "kestrel/0.6"},
              )
              with opener.open(download, timeout=120) as response:
                  raw = response.read(item["size_bytes"] + 1)
              if (
                  len(raw) != item["size_bytes"]
                  or "sha256:" + hashlib.sha256(raw).hexdigest() != item["sha256"]
              ):
                  raise SystemExit("pre-existing PyPI distribution conflicts with candidate")
              local_path.write_bytes(raw)
              provenance_url = (
                  "https://pypi.org/integrity/nested-memvid-agent/"
                  f"{manifest['version']}/{urllib.parse.quote(filename, safe='')}/provenance"
              )
              with opener.open(
                  urllib.request.Request(
                      provenance_url,
                      headers={"Accept": "application/json", "User-Agent": "kestrel/0.6"},
                  ),
                  timeout=30,
              ) as response:
                  provenance_raw = response.read(receipts.MAX_SOURCE_BODY_BYTES + 1)
              if len(provenance_raw) > receipts.MAX_SOURCE_BODY_BYTES:
                  raise SystemExit("PyPI provenance exceeds the evidence boundary")
              provenance = receipts.parse_external_json_bytes(
                  provenance_raw, label="pre-existing PyPI Integrity provenance"
              )
              provenance_path = root / "existing" / f"{filename}.provenance.json"
              provenance_path.write_bytes(provenance_raw)
              # Exact policy command: pypi-attestations verify pypi --offline
              verified = subprocess.run(
                  [
                      os.environ["PYPI_ATTESTATIONS"],
                      "verify",
                      "pypi",
                      "--offline",
                      "--repository",
                      "https://github.com/John-MiracleWorker/Kestrel",
                      "--provenance-file",
                      str(provenance_path),
                      str(local_path),
                  ],
                  capture_output=True,
                  check=False,
                  env={"LANG": "C.UTF-8", "LC_ALL": "C.UTF-8", "PYTHONNOUSERSITE": "1"},
              )
              if verified.returncode != 0:
                  raise SystemExit("pinned PyPI verifier rejected pre-existing provenance")
              transaction._verify_pypi_integrity_provenance(  # noqa: SLF001
                  provenance, filename=filename, expected_digest=item["sha256"]
              )
          for filename in state["missing"]:
              item = expected[filename]
              source = bundle / item["path"]
              raw = source.read_bytes()
              if (
                  len(raw) != item["size_bytes"]
                  or "sha256:" + hashlib.sha256(raw).hexdigest() != item["sha256"]
              ):
                  raise SystemExit("candidate PyPI distribution changed before publication")
              shutil.copyfile(source, Path("transaction/pypi-dist") / filename)

          captured_at = (
              datetime.now(UTC).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          )
          project_canonical = receipts.canonical_external_json_bytes(project)
          envelope_raw = receipts.canonical_json_bytes(
              {
                  "schema": receipts.SOURCE_OBSERVATION_SCHEMA,
                  "name": "final-pypi-project-observation",
                  "provider": "pypi.org",
                  "locator": "GET https://pypi.org/pypi/nested-memvid-agent/json",
                  "authenticated_as": None,
                  "freshness_class": "current",
                  "captured_at": captured_at,
                  "page_count": 1,
                  "record_count": 1,
                  "complete": True,
                  "body_encoding": "base64",
                  "body": base64.b64encode(project_canonical).decode("ascii"),
              }
          )
          pre = {
              "schema": "kestrel.release_stage_observations.v1",
              "stage": 4,
              "observations": [receipts.source_snapshot(envelope_raw)],
              "project": project,
          }
          root.joinpath("pypi-pre-observation.json").write_bytes(
              receipts.canonical_json_bytes(pre)
          )
          root.joinpath("pre-state.json").write_bytes(receipts.canonical_json_bytes(state))
          with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as stream:
              stream.write("publish=create\n" if state["missing"] else "publish=no_op\n")
          PY

