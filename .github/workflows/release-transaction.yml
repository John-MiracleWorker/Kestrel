name: Release transaction

on:
  workflow_call:
    inputs:
      candidate_run_id:
        description: Exact successful release-candidate workflow run ID
        required: true
        type: string
      candidate_manifest_digest:
        description: Exact lowercase sha256 candidate-manifest digest
        required: true
        type: string
      mode:
        description: initiate or recover_committed
        required: true
        type: string
      transaction_nonce:
        description: Unique 64-character lowercase hexadecimal transaction nonce
        required: true
        type: string
      dispatch_binding:
        description: JCS binding of the target ref and complete dispatch inputs
        required: true
        type: string
    secrets:
      RELEASE_GUARD_TOKEN:
        required: true
      RELEASE_RECOVERY_READER_TOKEN:
        required: true

permissions: {}

env:
  PROMOTION_CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
  PROMOTION_CANDIDATE_MANIFEST_DIGEST: ${{ inputs.candidate_manifest_digest }}
  PROMOTION_MODE: ${{ inputs.mode }}
  PROMOTION_TRANSACTION_NONCE: ${{ inputs.transaction_nonce }}
  PROMOTION_DISPATCH_BINDING: ${{ inputs.dispatch_binding }}
  PROMOTION_REPOSITORY: John-MiracleWorker/Kestrel
  PROMOTION_RECOVERY_REPOSITORY: John-MiracleWorker/Kestrel-Release-Recovery
  PROMOTION_REF: ${{ github.ref }}
  PROMOTION_REF_NAME: ${{ github.ref_name }}
  PROMOTION_SHA: ${{ github.sha }}
  PROMOTION_WORKFLOW: ${{ github.workflow }}
  PROMOTION_WORKFLOW_REF: ${{ github.workflow_ref }}
  PROMOTION_WORKFLOW_SHA: ${{ github.workflow_sha }}
  PROMOTION_REPOSITORY_ID: ${{ github.repository_id }}
  PROMOTION_RUN_ID: ${{ github.run_id }}
  PROMOTION_RUN_ATTEMPT: ${{ github.run_attempt }}
  PROMOTION_ACTOR: ${{ github.actor }}
  PROMOTION_ACTOR_ID: ${{ github.actor_id }}
  PROMOTION_TRIGGERING_ACTOR: ${{ github.triggering_actor }}
  PROMOTION_AUTHORIZATION_ARTIFACT_NAME: >-
    ${{ inputs.mode == 'initiate' && format('kestrel-release-transaction-authorization-{0}-1', github.run_id) || format('kestrel-release-execution-authorization-{0}-1', github.run_id) }}
  RECOVERY_READER_AUTHORITY_TAG: ${{ vars.RELEASE_RECOVERY_READER_AUTHORITY_TAG }}
  RELEASE_GUARD_AUTHORITY_TAG: ${{ vars.RELEASE_GUARD_AUTHORITY_TAG }}

jobs:
  identity-admission:
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify the pinned recovery Python identity
        shell: bash
        run: |
          python_executable="$(readlink -f -- "$(command -v python)")"
          test -f "$python_executable"
          test ! -L "$python_executable"
          test "$(sha256sum "$python_executable" | cut -d ' ' -f 1)" = \
            "dcd2d22a91c5adb37fa3f54a3a16d2ed7616b84931eb606c0fdfbca38395dab8"
          test "$(python --version)" = "Python 3.11.14"

      - name: Preflight literal promotion envelope
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          candidate_run_id = os.environ["PROMOTION_CANDIDATE_RUN_ID"]
          candidate_digest = os.environ["PROMOTION_CANDIDATE_MANIFEST_DIGEST"]
          mode = os.environ["PROMOTION_MODE"]
          nonce = os.environ["PROMOTION_TRANSACTION_NONCE"]
          binding = os.environ["PROMOTION_DISPATCH_BINDING"]
          ref = os.environ["PROMOTION_REF"]
          ref_name = os.environ["PROMOTION_REF_NAME"]
          if not re.fullmatch(r"[1-9][0-9]*", candidate_run_id):
              raise SystemExit("candidate run ID is invalid")
          if int(candidate_run_id) > 9_007_199_254_740_991:
              raise SystemExit("candidate run ID exceeds the safe-integer range")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", candidate_digest):
              raise SystemExit("candidate manifest digest is invalid")
          if not re.fullmatch(r"[0-9a-f]{64}", nonce):
              raise SystemExit("transaction nonce is invalid")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", binding):
              raise SystemExit("dispatch binding is invalid")
          if mode == "initiate":
              if ref != "refs/heads/main" or ref_name != "main":
                  raise SystemExit("initiate mode requires the exact main ref")
          elif mode == "recover_committed":
              if not re.fullmatch(r"refs/tags/v[0-9]+\.[0-9]+\.[0-9]+", ref):
                  raise SystemExit("recovery mode requires the exact manifest tag ref")
              if ref != f"refs/tags/{ref_name}":
                  raise SystemExit("recovery tag and ref-name disagree")
          else:
              raise SystemExit("promotion mode is invalid")
          if os.environ["PROMOTION_RUN_ATTEMPT"] != "1":
              raise SystemExit("promotion rerun attempts have no authority")
          if not os.environ["PROMOTION_ACTOR"].endswith("[bot]"):
              raise SystemExit("promotion actor is not the contained dispatcher App bot")
          if os.environ["PROMOTION_TRIGGERING_ACTOR"] != os.environ["PROMOTION_ACTOR"]:
              raise SystemExit("triggering actor differs from the dispatcher App bot")
          inputs = {
              "candidate_manifest_digest": candidate_digest,
              "candidate_run_id": candidate_run_id,
              "mode": mode,
              "transaction_nonce": nonce,
          }
          payload = {"inputs": inputs, "ref": ref_name}
          canonical = json.dumps(
              payload,
              ensure_ascii=False,
              separators=(",", ":"),
              sort_keys=True,
          ).encode("utf-8")
          expected = "sha256:" + hashlib.sha256(canonical).hexdigest()
          if binding != expected:
              raise SystemExit("dispatch binding does not match the complete event envelope")
          if os.environ["PROMOTION_SHA"] != os.environ["PROMOTION_WORKFLOW_SHA"]:
              raise SystemExit("promotion head and workflow SHA differ")
          PY

      - name: Check out the dispatch-pinned transaction source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Install the pinned transaction runtime
        shell: bash
        run: |
          python scripts/bootstrap_uv.py "${RUNNER_TEMP}/kestrel-uv"
          pinned_uv="${RUNNER_TEMP}/kestrel-uv/uv"
          test "$($pinned_uv --version)" = "uv 0.9.21 (0dc9556ad 2025-12-30)"
          python -m venv --copies "${RUNNER_TEMP}/kestrel-transaction-venv"
          "$pinned_uv" export --frozen --no-dev --no-emit-local \
            --extra dev --group release --format requirements.txt \
            --output-file "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --no-build-isolation --no-deps -e '.[dev]'
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip check
          printf 'PINNED_UV=%s\n' "$pinned_uv" >> "$GITHUB_ENV"
          printf 'KESTREL_PYTHON=%s\n' \
            "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" >> "$GITHUB_ENV"

      - name: Create canonical dispatch identity
        shell: bash
        run: |
          install -d -m 0700 transaction-identity
          "$KESTREL_PYTHON" - <<'PY'
          import os
          from pathlib import Path

          from scripts.release_control_receipt import canonical_json_bytes

          context = {
              "schema": "kestrel.github_context_allowlist.v1",
              "event_inputs": {
                  "candidate_run_id": os.environ["PROMOTION_CANDIDATE_RUN_ID"],
                  "candidate_manifest_digest": os.environ[
                      "PROMOTION_CANDIDATE_MANIFEST_DIGEST"
                  ],
                  "mode": os.environ["PROMOTION_MODE"],
                  "transaction_nonce": os.environ["PROMOTION_TRANSACTION_NONCE"],
                  "dispatch_binding": os.environ["PROMOTION_DISPATCH_BINDING"],
              },
              "repository": os.environ["PROMOTION_REPOSITORY"],
              "repository_id": int(os.environ["PROMOTION_REPOSITORY_ID"]),
              "workflow": os.environ["PROMOTION_WORKFLOW"],
              "workflow_ref": os.environ["PROMOTION_WORKFLOW_REF"],
              "workflow_sha": os.environ["PROMOTION_WORKFLOW_SHA"],
              "event_name": "workflow_dispatch",
              "ref": os.environ["PROMOTION_REF"],
              "ref_name": os.environ["PROMOTION_REF_NAME"],
              "sha": os.environ["PROMOTION_SHA"],
              "run_id": int(os.environ["PROMOTION_RUN_ID"]),
              "run_attempt": int(os.environ["PROMOTION_RUN_ATTEMPT"]),
              "actor": os.environ["PROMOTION_ACTOR"],
              "actor_id": int(os.environ["PROMOTION_ACTOR_ID"]),
              "triggering_actor": os.environ["PROMOTION_TRIGGERING_ACTOR"],
          }
          Path("transaction-identity/github-context-allowlist.json").write_bytes(
              canonical_json_bytes(context)
          )
          PY
          "$KESTREL_PYTHON" -m scripts.release_control_receipt \
            create-dispatch-identity \
            --github-context-allowlist transaction-identity/github-context-allowlist.json \
            --output transaction-identity/dispatch-identity.json

      - name: Upload dispatch identity before admission
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-dispatch-identity-${{ github.run_id }}-1
          path: transaction-identity/dispatch-identity.json
          if-no-files-found: error
          retention-days: 30

      - name: Bootstrap pinned GitHub CLI
        shell: bash
        run: |
          scripts/bootstrap_workflow_tools.sh "${RUNNER_TEMP}/kestrel-workflow-tools"
          pinned_gh="${RUNNER_TEMP}/kestrel-workflow-tools/gh"
          test "$($pinned_gh --version | head -n 1)" = \
            "gh version 2.97.0 (2026-02-26)"
          printf 'PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"
          printf 'KESTREL_PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"

      - name: Verify recovery-reader credential scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHCR_READ_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RECOVERY_READER_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          install -d -m 0700 transaction-identity/recovery-reader
          "$KESTREL_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          import re
          import ssl
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          root = Path("transaction-identity/recovery-reader")
          token = os.environ["RECOVERY_READER_TOKEN"]
          tag = os.environ["RECOVERY_READER_AUTHORITY_TAG"]
          if not tag or len(token) < 20:
              raise SystemExit("recovery-reader authority locator or credential is missing")
          repository = os.environ["PROMOTION_RECOVERY_REPOSITORY"]
          context = ssl.create_default_context()
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=context),
          )
          asset_api = transaction.DirectGitHubReadAPI(token=token.encode("ascii"))

          def request_with_headers(path, *, accept="application/vnd.github+json"):
              headers = {
                  "Accept": accept,
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "kestrel-release-transaction/1",
                  "X-GitHub-Api-Version": "2026-03-10",
              }
              req = urllib.request.Request(
                  f"https://api.github.com/{path}", headers=headers, method="GET"
              )
              try:
                  with opener.open(req, timeout=30) as response:
                      response_headers = [
                          [name.lower(), value]
                          for name, value in response.getheaders()
                          if name.lower() == "link"
                      ]
                      return (
                          response.status,
                          response.read(64 * 1024 * 1024),
                          response_headers,
                      )
              except urllib.error.HTTPError as error:
                  response_headers = [
                      [name.lower(), value]
                      for name, value in error.headers.items()
                      if name.lower() == "link"
                  ]
                  return error.code, error.read(4 * 1024 * 1024), response_headers

          def request(path, *, accept="application/vnd.github+json"):
              status, body, _headers = request_with_headers(path, accept=accept)
              return status, body

          def next_page(headers):
              values = [value for name, value in headers if name.lower() == "link"]
              if not values:
                  return None
              if len(values) != 1:
                  raise SystemExit("owner signing-key pagination has duplicate Link headers")
              next_urls = []
              for part in values[0].split(","):
                  match = re.fullmatch(
                      r'\s*<([^<>]+)>\s*;\s*rel="([A-Za-z0-9 -]+)"\s*', part
                  )
                  if match is None:
                      raise SystemExit("owner signing-key pagination Link is invalid")
                  if "next" in match.group(2).split():
                      next_urls.append(match.group(1))
              if len(next_urls) > 1:
                  raise SystemExit("owner signing-key pagination has multiple next links")
              return next_urls[0] if next_urls else None

          release_status, release_raw = request(
              f"repos/{repository}/releases/tags/{urllib.parse.quote(tag, safe='')}"
          )
          if release_status != 200:
              raise SystemExit("recovery-reader authority Release is unavailable")
          release = json.loads(release_raw)
          expected_names = {
              "recovery-reader-scope-authority.json",
              "recovery-reader-scope-authority.json.sig",
          }
          assets = release.get("assets")
          if (
              release.get("tag_name") != tag
              or release.get("draft") is not False
              or release.get("immutable") is not True
              or not isinstance(assets, list)
              or {item.get("name") for item in assets} != expected_names
              or len(assets) != len(expected_names)
          ):
              raise SystemExit("recovery-reader authority Release is not exact and immutable")
          results = []
          probes = [
              ("GET /repos/{repository}", f"repos/{repository}"),
              (
                  "GET /repos/{repository}/releases/tags/{tag}",
                  f"repos/{repository}/releases/tags/{urllib.parse.quote(tag, safe='')}",
              ),
              ("GET /user", "user"),
          ]
          for label, path in probes:
              status, body = request(path)
              results.append(
                  {
                      "endpoint": label,
                      "http_status": status,
                      "response_digest": "sha256:" + hashlib.sha256(body).hexdigest(),
                  }
              )
              if label == "GET /user":
                  user = json.loads(body)
                  identity = {
                      "login": user.get("login"),
                      "id": user.get("id"),
                      "type": user.get("type"),
                  }
                  (root / "identity-probe.json").write_text(
                      json.dumps(identity, separators=(",", ":"), sort_keys=True),
                      encoding="utf-8",
                  )
          asset_probe_recorded = False
          for asset in assets:
              exchange = asset_api(
                  f"GET /repos/{repository}/releases/assets/{asset['id']}",
                  accept="application/octet-stream",
              )
              status, body = exchange.http_status, exchange.response_body
              if not asset_probe_recorded:
                  results.append(
                      {
                          "endpoint": (
                              "GET /repos/{repository}/releases/assets/{asset_id}"
                          ),
                          "http_status": status,
                          "response_digest": (
                              "sha256:" + hashlib.sha256(body).hexdigest()
                          ),
                      }
                  )
                  asset_probe_recorded = True
              if status != 200 or len(body) != asset.get("size"):
                  raise SystemExit("recovery-reader authority asset is unavailable")
              (root / asset["name"]).write_bytes(body)
          forbidden_status, forbidden_body = request(
              "repos/John-MiracleWorker/Kestrel/actions/permissions"
          )
          results.append(
              {
                  "endpoint": "GET /repos/John-MiracleWorker/Kestrel/actions/permissions",
                  "http_status": forbidden_status,
                  "response_digest": (
                      "sha256:" + hashlib.sha256(forbidden_body).hexdigest()
                  ),
              }
          )
          results.sort(key=lambda item: item["endpoint"])
          probes_value = {
              "schema": "kestrel.credential_endpoint_probes.v1",
              "credential_id": json.loads(
                  (root / "recovery-reader-scope-authority.json").read_bytes()
              )["credential_id"],
              "results": results,
              "captured_at": datetime.now(UTC).replace(microsecond=0).isoformat().replace(
                  "+00:00", "Z"
              ),
              "complete": True,
          }
          (root / "endpoint-probes.json").write_text(
              json.dumps(probes_value, separators=(",", ":"), sort_keys=True),
              encoding="utf-8",
          )
          keys_target = "users/John-MiracleWorker/ssh_signing_keys?per_page=100"
          keys_request_url = "GET /users/John-MiracleWorker/ssh_signing_keys?per_page=100"
          keys_pages = []
          keys_seen = set()
          for keys_number in range(1, 101):
              if keys_request_url in keys_seen:
                  raise SystemExit("owner signing-key pagination looped")
              keys_seen.add(keys_request_url)
              keys_status, keys_body, keys_headers = request_with_headers(keys_target)
              if keys_status != 200:
                  raise SystemExit("owner signing-key observation is unavailable")
              keys_value = json.loads(keys_body)
              if not isinstance(keys_value, list):
                  raise SystemExit("owner signing-key response is not an array")
              keys_pages.append(
                  {
                      "number": keys_number,
                      "request_url": keys_request_url,
                      "response_headers": keys_headers,
                      "body": keys_value,
                  }
              )
              keys_next = next_page(keys_headers)
              if keys_next is None:
                  break
              keys_url = urllib.parse.urlsplit(keys_next)
              if (
                  keys_url.scheme != "https"
                  or keys_url.hostname != "api.github.com"
                  or keys_url.port not in (None, 443)
                  or keys_url.username is not None
                  or keys_url.password is not None
                  or keys_url.path
                  != "/users/John-MiracleWorker/ssh_signing_keys"
                  or not keys_url.query
                  or keys_url.fragment
              ):
                  raise SystemExit("owner signing-key pagination left the pinned origin")
              keys_request_url = keys_next
              keys_target = f"{keys_url.path.lstrip('/')}?{keys_url.query}"
          else:
              raise SystemExit("owner signing-key pagination exceeded its page limit")
          (root / "owner-signing-keys-raw.json").write_text(
              json.dumps({"pages": keys_pages}, separators=(",", ":"), sort_keys=True),
              encoding="utf-8",
          )
          PY
          "$KESTREL_PYTHON" -m scripts.release_control_receipt capture-source \
            --registry release-control-source-registry.json \
            --receipt-schema kestrel.source_observation.v1 \
            --phase release-control \
            --mode null \
            --name owner-signing-keys-observation \
            --raw-input \
              transaction-identity/recovery-reader/owner-signing-keys-raw.json \
            --identity-observation \
              transaction-identity/recovery-reader/identity-probe.json \
            --output \
              transaction-identity/recovery-reader/owner-signing-keys-observation.json
          printf '%s' "$RECOVERY_READER_TOKEN" | \
            "$KESTREL_PYTHON" -m scripts.release_control_receipt \
              verify-runtime-credential \
              --scope-authority \
                transaction-identity/recovery-reader/recovery-reader-scope-authority.json \
              --scope-authority-signature \
                transaction-identity/recovery-reader/recovery-reader-scope-authority.json.sig \
              --owner-signing-keys-observation \
                transaction-identity/recovery-reader/owner-signing-keys-observation.json \
              --identity-probe-observation \
                transaction-identity/recovery-reader/identity-probe.json \
              --endpoint-probe-observations \
                transaction-identity/recovery-reader/endpoint-probes.json \
              --output transaction-identity/recovery-reader/runtime-verification.json

      - name: Poll and verify owner-signed dispatch admission
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RECOVERY_READER_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          "$KESTREL_PYTHON" - <<'PY'
          import json
          import os
          import ssl
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import UTC, datetime
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          root = Path("transaction-identity")
          token = os.environ["RECOVERY_READER_TOKEN"]
          repository = os.environ["PROMOTION_RECOVERY_REPOSITORY"]
          nonce = os.environ["PROMOTION_TRANSACTION_NONCE"]
          admission_tag = f"dispatch-admission-{nonce}"
          tombstone_tag = f"dispatch-tombstone-{nonce}"
          opener = urllib.request.build_opener(
              urllib.request.ProxyHandler({}),
              urllib.request.HTTPSHandler(context=ssl.create_default_context()),
          )
          asset_api = transaction.DirectGitHubReadAPI(token=token.encode("ascii"))

          def get_release(tag):
              request = urllib.request.Request(
                  "https://api.github.com/repos/"
                  f"{repository}/releases/tags/{urllib.parse.quote(tag, safe='')}",
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "User-Agent": "kestrel-release-transaction/1",
                      "X-GitHub-Api-Version": "2026-03-10",
                  },
                  method="GET",
              )
              try:
                  with opener.open(request, timeout=20) as response:
                      return response.status, json.loads(response.read(8 * 1024 * 1024))
              except urllib.error.HTTPError as error:
                  if error.code == 404:
                      return 404, None
                  raise

          deadline = time.monotonic() + 240
          release = None
          while time.monotonic() < deadline:
              tombstone_status, _ = get_release(tombstone_tag)
              if tombstone_status == 200:
                  raise SystemExit("dispatch transaction has an immutable tombstone")
              status, candidate = get_release(admission_tag)
              if status == 200:
                  release = candidate
                  break
              time.sleep(2)
          if release is None:
              raise SystemExit("owner-signed dispatch admission was not published in time")
          expected_names = {
              "dispatch-admission.json",
              "dispatch-admission.json.sig",
          }
          assets = release.get("assets")
          if (
              release.get("tag_name") != admission_tag
              or release.get("draft") is not False
              or release.get("immutable") is not True
              or not isinstance(assets, list)
              or len(assets) != 2
              or {item.get("name") for item in assets} != expected_names
          ):
              raise SystemExit("dispatch admission Release is not exact and immutable")
          for asset in assets:
              exchange = asset_api(
                  f"GET /repos/{repository}/releases/assets/{asset['id']}",
                  accept="application/octet-stream",
              )
              body = exchange.response_body
              if exchange.http_status != 200 or len(body) != asset.get("size"):
                  raise SystemExit("dispatch admission asset size is not exact")
              (root / asset["name"]).write_bytes(body)
          PY
          "$KESTREL_PYTHON" - <<'PY'
          from pathlib import Path

          from scripts import release_control_receipt as receipts

          root = Path("transaction-identity")
          recovery = root / "recovery-reader"
          identity = receipts.strict_canonical_json(
              (root / "dispatch-identity.json").read_bytes(),
              label="current dispatch identity",
          )
          verification = receipts.verify_dispatch_admission(
              admission=(root / "dispatch-admission.json").read_bytes(),
              signature=(root / "dispatch-admission.json.sig").read_bytes(),
              owner_signing_keys_observation=(
                  recovery / "owner-signing-keys-observation.json"
              ).read_bytes(),
              current_run_identity=receipts._object(  # noqa: SLF001
                  identity, label="current dispatch identity"
              ),
              recovery_scope_authority=(
                  recovery / "recovery-reader-scope-authority.json"
              ).read_bytes(),
              recovery_scope_signature=(
                  recovery / "recovery-reader-scope-authority.json.sig"
              ).read_bytes(),
              recovery_runtime_verification=(
                  recovery / "runtime-verification.json"
              ).read_bytes(),
          )
          if not receipts.write_once(
              root / "dispatch-admission-verification.json",
              receipts.canonical_json_bytes(verification),
          ):
              raise SystemExit("dispatch admission verification output already exists")
          PY

      - name: Select exact release candidate
        id: candidate
        if: ${{ inputs.mode == 'initiate' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_json="$($PINNED_GH api \
            "repos/${PROMOTION_REPOSITORY}/actions/runs/${PROMOTION_CANDIDATE_RUN_ID}")"
          artifacts_json="$($PINNED_GH api --paginate --slurp \
            "repos/${PROMOTION_REPOSITORY}/actions/runs/${PROMOTION_CANDIDATE_RUN_ID}/artifacts?per_page=100")"
          RUN_JSON="$run_json" ARTIFACTS_JSON="$artifacts_json" \
            "$KESTREL_PYTHON" - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          run = json.loads(os.environ["RUN_JSON"])
          pages = json.loads(os.environ["ARTIFACTS_JSON"])
          run_id = int(os.environ["PROMOTION_CANDIDATE_RUN_ID"])
          if (
              run.get("id") != run_id
              or run.get("run_attempt") != 1
              or run.get("event") != "workflow_dispatch"
              or run.get("status") != "completed"
              or run.get("conclusion") != "success"
              or run.get("path")
              not in {
                  ".github/workflows/release-candidate.yml",
                  ".github/workflows/release-candidate.yml@main",
              }
              or run.get("head_branch") != "main"
              or type(run.get("workflow_id")) is not int
              or run["workflow_id"] <= 0
              or (run.get("repository") or {}).get("full_name")
              != os.environ["PROMOTION_REPOSITORY"]
          ):
              raise SystemExit("candidate run identity is not exact attempt-one success")
          artifacts = [item for page in pages for item in page.get("artifacts", [])]
          matches = [
              item
              for item in artifacts
              if re.fullmatch(
                  r"kestrel-release-candidate-[0-9]+\.[0-9]+\.[0-9]+-[0-9a-f]{40}",
                  str(item.get("name", "")),
              )
              and item.get("expired") is False
              and (item.get("workflow_run") or {}).get("id") == run_id
          ]
          if len(matches) != 1:
              raise SystemExit("candidate run does not expose one exact candidate artifact")
          selected = matches[0]
          Path("transaction-identity/candidate-run.json").write_text(
              json.dumps(run, ensure_ascii=False, separators=(",", ":"), sort_keys=True),
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_name={selected['name']}\n")
          PY

      - name: Download exact release candidate
        if: ${{ inputs.mode == 'initiate' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          run-id: ${{ inputs.candidate_run_id }}
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: candidate

      - name: Restore committed release candidate from the immutable capsule
        if: ${{ inputs.mode == 'recover_committed' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          install -d -m 0700 \
            transaction \
            transaction-identity/recovery \
            transaction-identity/recovery-capsule-download
          authority_tag="release-authority-${PROMOTION_RUN_ID}-1"
          authority_release="$($PINNED_GH api \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/tags/${authority_tag}")"
          AUTHORITY_RELEASE="$authority_release" "$KESTREL_PYTHON" - <<'PY'
          import json
          import os

          release = json.loads(os.environ["AUTHORITY_RELEASE"])
          expected_tag = f"release-authority-{os.environ['PROMOTION_RUN_ID']}-1"
          if (
              release.get("tag_name") != expected_tag
              or release.get("draft") is not False
              or release.get("prerelease") is not False
              or release.get("immutable") is not True
          ):
              raise SystemExit("recovery authorization boundary is not immutable")
          PY
          "$PINNED_GH" release download "$authority_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --pattern release-authorization.json \
            --pattern recovery-capsule-verification.json \
            --dir transaction-identity/recovery
          "$KESTREL_PYTHON" - <<'PY'
          from pathlib import Path

          root = Path("transaction-identity/recovery")
          expected = {
              "recovery-capsule-verification.json",
              "release-authorization.json",
          }
          observed = {
              path.name
              for path in root.iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if observed != expected or len(list(root.iterdir())) != len(expected):
              raise SystemExit("recovery authorization capsule inputs are not exact")
          if any(path.stat().st_size <= 0 for path in root.iterdir()):
              raise SystemExit("recovery authorization capsule input is empty")
          PY
          readarray -t capsule_inputs < <("$KESTREL_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts import release_promotion_transaction as transaction

          root = Path("transaction-identity/recovery")
          original = (root / "release-authorization.json").read_bytes()
          signed = json.loads(
              (root / "recovery-capsule-verification.json").read_bytes()
          )
          capsule_digest = transaction._authorization_capsule_digest(  # noqa: SLF001
              verification=signed,
              candidate_manifest_digest=os.environ[
                  "PROMOTION_CANDIDATE_MANIFEST_DIGEST"
              ],
              transaction_authorization=original,
          )
          claim = signed["verification"]
          if claim["capsule_manifest_digest"] != capsule_digest:
              raise SystemExit("signed recovery capsule digest changed")
          assets = {item["name"]: item for item in claim["assets"]}
          print(claim["release"]["tag"])
          print(assets["recovery-capsule.tar"]["sha256"])
          print(capsule_digest)
          print(claim["signing_key_fingerprint"])
          print(claim["release"]["id"])
          print(assets["recovery-bootstrap.py"]["sha256"])
          PY
          )
          test "${#capsule_inputs[@]}" -eq 6
          capsule_tag="${capsule_inputs[0]}"
          "$PINNED_GH" api \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/tags/${capsule_tag}" \
            > transaction-identity/recovery-capsule-download/release.json
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/${capsule_inputs[4]}/assets?per_page=100" \
            > transaction-identity/recovery-capsule-download/assets-pages.json
          "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          root = Path("transaction-identity/recovery")
          signed = json.loads(
              (root / "recovery-capsule-verification.json").read_bytes()
          )
          claim = signed["verification"]
          observed = Path("transaction-identity/recovery-capsule-download")
          release = json.loads((observed / "release.json").read_bytes())
          expected_tag = claim["release"]["tag"]
          expected_name = f"Kestrel recovery capsule {expected_tag}"
          expected_body = (
              f"{expected_name}\n\nKestrel-Recovery-Capsule: "
              f"{claim['capsule_manifest_digest']}"
          )
          if (
              release.get("id") != claim["release"]["id"]
              or release.get("tag_name") != expected_tag
              or release.get("name") != expected_name
              or release.get("body") != expected_body
              or release.get("draft") is not False
              or release.get("prerelease") is not False
              or release.get("immutable") is not True
          ):
              raise SystemExit("recovery capsule Release differs from the signed claim")
          pages = json.loads((observed / "assets-pages.json").read_bytes())
          assets = [item for page in pages for item in page]
          expected_assets = {
              (item["id"], item["name"], item["size_bytes"], item["sha256"])
              for item in claim["assets"]
          }
          actual_assets = {
              (item.get("id"), item.get("name"), item.get("size"), item.get("digest"))
              for item in assets
          }
          if actual_assets != expected_assets or len(assets) != 3:
              raise SystemExit("recovery capsule asset identity differs from the signed claim")
          PY
          "$PINNED_GH" release download "$capsule_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --pattern recovery-bootstrap.py \
            --pattern recovery-capsule-manifest.json \
            --pattern recovery-capsule.tar \
            --dir transaction-identity/recovery-capsule-download
          cmp --silent scripts/bootstrap_recovery.py \
            "transaction-identity/recovery-capsule-download/recovery-bootstrap.py"
          test "$(sha256sum \
            "transaction-identity/recovery-capsule-download/recovery-bootstrap.py" | \
            cut -d ' ' -f 1)" = "${capsule_inputs[5]#sha256:}"
          recovery_tcb_python="$(bash scripts/bootstrap_recovery_tcb.sh \
            "${RUNNER_TEMP}/kestrel-recovery-bootstrap-tcb")"
          env -i LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 \
            "$recovery_tcb_python" -I -S -B \
            transaction-identity/recovery-capsule-download/recovery-bootstrap.py \
            transaction-identity/recovery-capsule-download/recovery-capsule.tar \
            --destination transaction/capsule \
            --expected-archive-digest "${capsule_inputs[1]}" \
            --expected-manifest-digest "${capsule_inputs[2]}" \
            --expected-owner-key-fingerprint "${capsule_inputs[3]}"
          "$KESTREL_PYTHON" - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path("transaction/capsule")
          manifest = json.loads((root / "recovery-capsule-manifest.json").read_bytes())
          candidate = manifest["candidate"]
          if (
              candidate["candidate_manifest_digest"]
              != os.environ["PROMOTION_CANDIDATE_MANIFEST_DIGEST"]
              or str(candidate["candidate_run_id"])
              != os.environ["PROMOTION_CANDIDATE_RUN_ID"]
              or candidate["tag"] != os.environ["PROMOTION_REF_NAME"]
              or candidate["source_sha"] != os.environ["PROMOTION_SHA"]
          ):
              raise SystemExit("recovery capsule candidate differs from the dispatch")
          workflow_digests = {
              item["path"]: item["sha256"]
              for item in manifest["source_workflow_digests"]
          }
          expected_workflows = {
              ".github/workflows/release-transaction.yml",
              ".github/workflows/release.yml",
          }
          if set(workflow_digests) != expected_workflows:
              raise SystemExit("recovery capsule workflow allowlist is not exact")
          for relative, expected in workflow_digests.items():
              digest = "sha256:" + hashlib.sha256(Path(relative).read_bytes()).hexdigest()
              if digest != expected:
                  raise SystemExit("tagged recovery workflow differs from the capsule")
          original = Path("transaction-identity/recovery/release-authorization.json")
          if original.read_bytes() != (root / "release-authorization.json").read_bytes():
              raise SystemExit("original transaction authorization differs from the capsule")
          PY
          capsule_root="$GITHUB_WORKSPACE/transaction/capsule"
          capsule_python="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/environment/bin/python")"
          capsule_runtime="$(readlink -f -- "$capsule_root/recovery/runtime")"
          capsule_base_lib="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/base/lib")"
          capsule_loader="$capsule_runtime/ld-linux-x86-64.so.2"
          capsule_library_path="$capsule_runtime:$capsule_base_lib"
          test ! -e /etc/ld.so.preload
          test -x "$capsule_python"
          test -x "$capsule_loader"
          test -z "$(find "$capsule_runtime" -mindepth 1 -type d -print -quit)"
          capsule_private_loader() {
            local loader_report loader_line dependency
            loader_report="$(env -i "$capsule_loader" --inhibit-cache \
              --library-path "$capsule_library_path" --list "$capsule_python")"
            case "$loader_report" in *"not found"*) return 1 ;; esac
            while IFS= read -r loader_line; do
              loader_line="${loader_line#"${loader_line%%[![:space:]]*}"}"
              if [[ "$loader_line" == *" => "* ]]; then
                dependency="${loader_line#* => }"
                dependency="${dependency%% *}"
              elif [[ "$loader_line" == /* ]]; then
                dependency="${loader_line%% *}"
              else
                continue
              fi
              case "$dependency" in
                "$capsule_runtime"/*|"$capsule_base_lib"/*) ;;
                *) return 1 ;;
              esac
            done <<< "$loader_report"
            (
              exec -c "$capsule_loader" --inhibit-cache \
                --library-path "$capsule_library_path" "$capsule_python" "$@"
            )
          }
          test -f "$capsule_root/candidate-archive.tar"
          capsule_private_loader -I -S -B -c \
            'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
            "$capsule_root" \
            "$capsule_root/scripts/recovery_launcher.py" \
            launch "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --executable python -- \
            "$capsule_root/scripts/recovery_launcher.py" \
            materialize-candidate "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --destination "$GITHUB_WORKSPACE/candidate"
          actuator_input_dir="$GITHUB_WORKSPACE/transaction-identity/recovery/inputs"
          install -d -m 0700 "$actuator_input_dir"
          install -m 0500 "$KESTREL_PYTHON" "$actuator_input_dir/python"
          install -m 0500 "$PINNED_GH" "$actuator_input_dir/gh"
          host_binding="$GITHUB_WORKSPACE/transaction-identity/recovery/host-actuator-binding.json"
          test ! -e "$host_binding"
          capsule_private_loader -I -S -B -c \
            'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
            "$capsule_root" \
            "$capsule_root/scripts/recovery_launcher.py" \
            launch "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --executable python -- \
            "$capsule_root/scripts/recovery_launcher.py" \
            bind-host-actuator "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --host-root "$GITHUB_WORKSPACE" \
            --host-python "$actuator_input_dir/python" \
            --host-gh "$actuator_input_dir/gh" \
            --output "$host_binding"
          grep -Fq '"method":"offline-authority-host-actuator-binding"' \
            "$host_binding"
          printf 'KESTREL_HOST_ACTUATOR_BINDING=%s\n' \
            "$host_binding" >> "$GITHUB_ENV"

      - name: Verify exact release candidate
        shell: bash
        run: |
          verified_digest="$($KESTREL_PYTHON -m scripts.release_candidate_manifest \
            digest candidate/candidate-manifest.json)"
          test "$verified_digest" = "$PROMOTION_CANDIDATE_MANIFEST_DIGEST"
          "$KESTREL_PYTHON" -m scripts.release_candidate_manifest verify \
            candidate/candidate-manifest.json \
            --bundle-root candidate \
            --source-root . \
            --expected-digest "$PROMOTION_CANDIDATE_MANIFEST_DIGEST"
          "$KESTREL_PYTHON" - <<'PY'
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("candidate/candidate-manifest.json").read_bytes())
          candidate_run = manifest["candidate_run"]
          source_sha = manifest["source"]["commit_sha"]
          mode = os.environ["PROMOTION_MODE"]
          if (
              str(candidate_run["run_id"]) != os.environ["PROMOTION_CANDIDATE_RUN_ID"]
              or candidate_run["run_attempt"] != 1
              or candidate_run["workflow_ref"] != "refs/heads/main"
              or candidate_run["workflow_sha"] != source_sha
          ):
              raise SystemExit("candidate manifest run ID differs from dispatch input")
          if mode == "initiate":
              run = json.loads(Path("transaction-identity/candidate-run.json").read_bytes())
              if (
                  candidate_run["run_id"] != run["id"]
                  or candidate_run["run_attempt"] != run["run_attempt"]
                  or candidate_run["workflow_id"] != run["workflow_id"]
                  or run["head_sha"] != source_sha
                  or run["path"]
                  not in {
                      ".github/workflows/release-candidate.yml",
                      ".github/workflows/release-candidate.yml@main",
                  }
                  or source_sha != os.environ["PROMOTION_SHA"]
              ):
                  raise SystemExit("initiation candidate differs from its live run")
          elif mode == "recover_committed":
              if (
                  manifest["tag"] != os.environ["PROMOTION_REF_NAME"]
                  or source_sha != os.environ["PROMOTION_SHA"]
              ):
                  raise SystemExit("recovery ref is not the exact capsule candidate")
          else:
              raise SystemExit("promotion mode is invalid")
          PY

      - name: Upload admitted transaction inputs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kestrel-release-identity-admission-${{ github.run_id }}-1
          path: |
            candidate
            transaction-identity
            !transaction-identity/recovery-capsule-download/**
          if-no-files-found: error
          retention-days: 30

  authorize-release:
    needs: identity-admission
    runs-on: ubuntu-24.04
    environment:
      name: release
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Check out the dispatch-pinned transaction source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify the pinned recovery Python identity
        shell: bash
        run: |
          python_executable="$(readlink -f -- "$(command -v python)")"
          test -f "$python_executable"
          test ! -L "$python_executable"
          test "$(sha256sum "$python_executable" | cut -d ' ' -f 1)" = \
            "dcd2d22a91c5adb37fa3f54a3a16d2ed7616b84931eb606c0fdfbca38395dab8"
          test "$(python --version)" = "Python 3.11.14"

      - name: Install the pinned transaction runtime
        shell: bash
        run: |
          python scripts/bootstrap_uv.py "${RUNNER_TEMP}/kestrel-uv"
          pinned_uv="${RUNNER_TEMP}/kestrel-uv/uv"
          test "$($pinned_uv --version)" = "uv 0.9.21 (0dc9556ad 2025-12-30)"
          python -m venv --copies "${RUNNER_TEMP}/kestrel-transaction-venv"
          "$pinned_uv" export --frozen --no-dev --no-emit-local \
            --extra dev --group release --format requirements.txt \
            --output-file "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --no-build-isolation --no-deps -e '.[dev]'
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip check
          printf 'PINNED_UV=%s\n' "$pinned_uv" >> "$GITHUB_ENV"
          printf 'KESTREL_PYTHON=%s\n' \
            "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" >> "$GITHUB_ENV"

      - name: Restore admitted transaction inputs
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kestrel-release-identity-admission-${{ github.run_id }}-1
          path: .

      - name: Bootstrap pinned GitHub CLI
        shell: bash
        run: |
          scripts/bootstrap_workflow_tools.sh "${RUNNER_TEMP}/kestrel-workflow-tools"
          pinned_gh="${RUNNER_TEMP}/kestrel-workflow-tools/gh"
          test "$($pinned_gh --version | head -n 1)" = \
            "gh version 2.97.0 (2026-02-26)"
          printf 'PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"
          printf 'KESTREL_PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"

      - name: Download release authorization evidence
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          authority_tag="release-authority-${PROMOTION_RUN_ID}-1"
          release_json="$($PINNED_GH api \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/tags/${authority_tag}")"
          RELEASE_JSON="$release_json" "$KESTREL_PYTHON" - <<'PY'
          import json
          import os

          release = json.loads(os.environ["RELEASE_JSON"])
          if (
              release.get("tag_name")
              != f"release-authority-{os.environ['PROMOTION_RUN_ID']}-1"
              or release.get("draft") is not False
              or release.get("immutable") is not True
          ):
              raise SystemExit("release authorization evidence is not immutable")
          PY
          install -d -m 0700 authority-evidence
          "$PINNED_GH" release download "$authority_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --dir authority-evidence
          "$KESTREL_PYTHON" - <<'PY'
          import os
          from pathlib import Path

          common = {
              "actions-workflow-permissions-observation.json",
              "active-runs-observation.json",
              "approval-history-observation.json",
              "candidate-workflow-contents.json",
              "default-branch-workflow-contents.json",
              "deploy-keys-observation.json",
              "dispatch-intent.json",
              "dispatch-reconciliation.json",
              "environment-pypi-observation.json",
              "environment-pypi-policies-observation.json",
              "environment-release-commit-observation.json",
              "environment-release-commit-policies-observation.json",
              "environment-release-observation.json",
              "environment-release-policies-observation.json",
              "environment-release-prepare-observation.json",
              "environment-release-prepare-policies-observation.json",
              "github-admission-authority.json",
              "github-admission-authority.json.sig",
              "immutable-releases-observation.json",
              "ingress-ruleset-detail-observation.json",
              "main-branch-observation.json",
              "owner-signing-keys-observation.json",
              "promotion-run-observation.json",
              "pypi-authority-verification.json",
              "recovery-authority-verification.json",
              "recovery-immutable-releases-observation.json",
              "recovery-repository-observation.json",
              "release-guard-endpoint-probes.json",
              "release-guard-identity-probe.json",
              "release-guard-scope-authority.json",
              "release-guard-scope-authority.json.sig",
              "repository-collaborators-observation.json",
              "repository-invitations-observation.json",
              "repository-observation.json",
              "rulesets-observation.json",
              "tag-ruleset-detail-observation.json",
              "workflow-observation.json",
          }
          recovery = {
              "commit-marker-observation.json",
              "recovery-capsule-verification.json",
              "release-authorization.json",
          }
          expected = common | (
              recovery if os.environ["PROMOTION_MODE"] == "recover_committed" else set()
          )
          root = Path("authority-evidence")
          observed = {
              path.name
              for path in root.iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if observed != expected or len(list(root.iterdir())) != len(expected):
              raise SystemExit("release authorization evidence inventory is not exact")
          if any(path.stat().st_size <= 0 for path in root.iterdir()):
              raise SystemExit("release authorization evidence contains an empty asset")
          PY

      - name: Verify both injected credentials at the authorization boundary
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
          RELEASE_GUARD_TOKEN_BYTES: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          printf '%s' "$RELEASE_RECOVERY_READER_TOKEN_BYTES" | \
            "$KESTREL_PYTHON" -m scripts.release_control_receipt \
              verify-runtime-credential \
              --scope-authority \
                transaction-identity/recovery-reader/recovery-reader-scope-authority.json \
              --scope-authority-signature \
                transaction-identity/recovery-reader/recovery-reader-scope-authority.json.sig \
              --owner-signing-keys-observation \
                transaction-identity/recovery-reader/owner-signing-keys-observation.json \
              --identity-probe-observation \
                transaction-identity/recovery-reader/identity-probe.json \
              --endpoint-probe-observations \
                transaction-identity/recovery-reader/endpoint-probes.json \
              --output \
                transaction-identity/recovery-reader/authorization-runtime-verification.json
          printf '%s' "$RELEASE_GUARD_TOKEN_BYTES" | \
            "$KESTREL_PYTHON" -m scripts.release_control_receipt \
              verify-runtime-credential \
              --scope-authority \
                authority-evidence/release-guard-scope-authority.json \
              --scope-authority-signature \
                authority-evidence/release-guard-scope-authority.json.sig \
              --owner-signing-keys-observation \
                authority-evidence/owner-signing-keys-observation.json \
              --identity-probe-observation \
                authority-evidence/release-guard-identity-probe.json \
              --endpoint-probe-observations \
                authority-evidence/release-guard-endpoint-probes.json \
              --output \
                authority-evidence/release-guard-authorization-runtime-verification.json

      - name: Verify the exact owner-signed admission authority
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          authority_environment_id="$($KESTREL_PYTHON - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(
              Path("authority-evidence/github-admission-authority.json").read_bytes()
          )
          print(value["environment"]["id"])
          PY
          )"
          "$KESTREL_PYTHON" -m scripts.release_control_receipt \
            verify-github-authority \
            authority-evidence/github-admission-authority.json \
            --signature \
              authority-evidence/github-admission-authority.json.sig \
            --owner-signing-keys-observation \
              authority-evidence/owner-signing-keys-observation.json \
            --expected-run-id "$PROMOTION_RUN_ID" \
            --expected-candidate-digest "$PROMOTION_CANDIDATE_MANIFEST_DIGEST" \
            --expected-environment-id "$authority_environment_id" \
            --output \
              authority-evidence/github-admission-authority-verification.json

      - name: Capture fresh authorization boundary after approval
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
          RELEASE_RECOVERY_READER_TOKEN_BYTES: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          install -d -m 0700 transaction
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            capture-prerequisite-boundary \
            --registry release-control-source-registry.json \
            --repository "$PROMOTION_REPOSITORY" \
            --recovery-repository "$PROMOTION_RECOVERY_REPOSITORY" \
            --candidate-ref "$PROMOTION_SHA" \
            --run-id "$PROMOTION_RUN_ID" \
            --output-dir transaction/authorization-boundary

      - name: Validate fresh lock and ingress before authorization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction \
            inspect-prerequisites \
            --mode operational \
            --transaction-mode "$PROMOTION_MODE" \
            --repository-observation \
              transaction/authorization-boundary/repository-observation.json \
            --repository-collaborators-observation \
              transaction/authorization-boundary/repository-collaborators-observation.json \
            --repository-invitations-observation \
              transaction/authorization-boundary/repository-invitations-observation.json \
            --deploy-keys-observation \
              transaction/authorization-boundary/deploy-keys-observation.json \
            --actions-workflow-permissions-observation \
              transaction/authorization-boundary/actions-workflow-permissions-observation.json \
            --owner-signing-keys-observation \
              transaction/authorization-boundary/owner-signing-keys-observation.json \
            --workflow-source-root . \
            --main-branch-observation \
              transaction/authorization-boundary/main-branch-observation.json \
            --immutable-releases-observation \
              transaction/authorization-boundary/immutable-releases-observation.json \
            --rulesets-observation \
              transaction/authorization-boundary/rulesets-observation.json \
            --tag-ruleset-detail-observation \
              transaction/authorization-boundary/tag-ruleset-detail-observation.json \
            --ingress-ruleset-detail-observation \
              transaction/authorization-boundary/ingress-ruleset-detail-observation.json \
            --workflow-observation \
              transaction/authorization-boundary/workflow-observation.json \
            --default-branch-workflow-contents \
              transaction/authorization-boundary/default-branch-workflow-contents.json \
            --candidate-workflow-contents \
              transaction/authorization-boundary/candidate-workflow-contents.json \
            --recovery-repository-observation \
              transaction/authorization-boundary/recovery-repository-observation.json \
            --recovery-immutable-releases-observation \
              transaction/authorization-boundary/recovery-immutable-releases-observation.json \
            --recovery-authority-verification \
              authority-evidence/recovery-authority-verification.json \
            --github-authority-verification \
              authority-evidence/github-admission-authority-verification.json \
            --pypi-authority-verification \
              authority-evidence/pypi-authority-verification.json \
            --expected-repository "$PROMOTION_REPOSITORY" \
            --expected-owner-login John-MiracleWorker \
            --expected-owner-user-id 58918509 \
            --environment-observation \
              release=transaction/authorization-boundary/environment-release-observation.json \
            --environment-observation \
              release-prepare=transaction/authorization-boundary/environment-release-prepare-observation.json \
            --environment-observation \
              release-commit=transaction/authorization-boundary/environment-release-commit-observation.json \
            --environment-observation \
              pypi=transaction/authorization-boundary/environment-pypi-observation.json \
            --environment-policies-observation \
              release=transaction/authorization-boundary/environment-release-policies-observation.json \
            --environment-policies-observation \
              release-prepare=transaction/authorization-boundary/environment-release-prepare-policies-observation.json \
            --environment-policies-observation \
              release-commit=transaction/authorization-boundary/environment-release-commit-policies-observation.json \
            --environment-policies-observation \
              pypi=transaction/authorization-boundary/environment-pypi-policies-observation.json \
            --output authority-evidence/release-prerequisites.json

      - name: Create role-specific server authorization
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
        run: |
          workflow_id="$($KESTREL_PYTHON - <<'PY'
          import json
          from pathlib import Path

          value = json.loads(Path("transaction-identity/dispatch-admission.json").read_bytes())
          print(value["workflow_id"])
          PY
          )"
          authorization_output=release-authorization.json
          recovery_arguments=()
          if test "$PROMOTION_MODE" = recover_committed; then
            authorization_output=release-execution-authorization.json
            cmp --silent \
              authority-evidence/release-authorization.json \
              transaction-identity/recovery/release-authorization.json
            cmp --silent \
              authority-evidence/recovery-capsule-verification.json \
              transaction-identity/recovery/recovery-capsule-verification.json
            install -m 0600 \
              transaction-identity/recovery/release-authorization.json \
              release-authorization.json
            recovery_arguments=(
              --commit-marker-observation
              authority-evidence/commit-marker-observation.json
              --transaction-authorization
              transaction-identity/recovery/release-authorization.json
              --recovery-capsule-verification
              transaction-identity/recovery/recovery-capsule-verification.json
            )
          fi
          "$KESTREL_PYTHON" -m scripts.release_promotion_transaction authorize \
            candidate/candidate-manifest.json \
            --bundle-root candidate \
            --repository-observation \
              transaction/authorization-boundary/repository-observation.json \
            --repository-collaborators-observation \
              transaction/authorization-boundary/repository-collaborators-observation.json \
            --repository-invitations-observation \
              transaction/authorization-boundary/repository-invitations-observation.json \
            --deploy-keys-observation \
              transaction/authorization-boundary/deploy-keys-observation.json \
            --actions-workflow-permissions-observation \
              transaction/authorization-boundary/actions-workflow-permissions-observation.json \
            --owner-signing-keys-observation \
              transaction/authorization-boundary/owner-signing-keys-observation.json \
            --active-runs-observation \
              transaction/authorization-boundary/active-runs-observation.json \
            --workflow-source-root . \
            --main-branch-observation \
              transaction/authorization-boundary/main-branch-observation.json \
            --immutable-releases-observation \
              transaction/authorization-boundary/immutable-releases-observation.json \
            --rulesets-observation \
              transaction/authorization-boundary/rulesets-observation.json \
            --tag-ruleset-detail-observation \
              transaction/authorization-boundary/tag-ruleset-detail-observation.json \
            --ingress-ruleset-detail-observation \
              transaction/authorization-boundary/ingress-ruleset-detail-observation.json \
            --workflow-observation \
              transaction/authorization-boundary/workflow-observation.json \
            --default-branch-workflow-contents \
              transaction/authorization-boundary/default-branch-workflow-contents.json \
            --candidate-workflow-contents \
              transaction/authorization-boundary/candidate-workflow-contents.json \
            --release-environment-observation \
              transaction/authorization-boundary/environment-release-observation.json \
            --release-deployment-policies-observation \
              transaction/authorization-boundary/environment-release-policies-observation.json \
            --promotion-run-observation \
              transaction/authorization-boundary/promotion-run-observation.json \
            --promotion-dispatch-identity transaction-identity/dispatch-identity.json \
            --approval-history-observation \
              transaction/authorization-boundary/approval-history-observation.json \
            --github-admission-authority-verification \
              authority-evidence/github-admission-authority-verification.json \
            --dispatch-intent authority-evidence/dispatch-intent.json \
            --dispatch-reconciliation authority-evidence/dispatch-reconciliation.json \
            --expected-run-id "$PROMOTION_RUN_ID" \
            --expected-run-attempt 1 \
            --expected-workflow-id "$workflow_id" \
            --expected-workflow-path .github/workflows/release.yml \
            --mode "$PROMOTION_MODE" \
            "${recovery_arguments[@]}" \
            --output "$authorization_output"
          if test "$PROMOTION_MODE" = initiate; then
            test -f release-authorization.json
            test ! -e release-execution-authorization.json
          else
            test -f release-execution-authorization.json
          fi

      - name: Upload role-specific authorization
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ env.PROMOTION_AUTHORIZATION_ARTIFACT_NAME }}
          path: |
            authority-evidence
            candidate
            release-authorization.json
            release-execution-authorization.json
            transaction-identity
          if-no-files-found: warn
          retention-days: 30

  prepare-github-ghcr:
    needs: authorize-release
    runs-on: ubuntu-24.04
    environment:
      name: release-prepare
    permissions:
      actions: read
      contents: write
      packages: write
    steps:
      - name: Check out the dispatch-pinned transaction source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11.14"

      - name: Verify the pinned recovery Python identity
        shell: bash
        run: |
          python_executable="$(readlink -f -- "$(command -v python)")"
          test -f "$python_executable"
          test ! -L "$python_executable"
          test "$(sha256sum "$python_executable" | cut -d ' ' -f 1)" = \
            "dcd2d22a91c5adb37fa3f54a3a16d2ed7616b84931eb606c0fdfbca38395dab8"
          test "$(python --version)" = "Python 3.11.14"

      - name: Install the pinned transaction runtime
        shell: bash
        run: |
          python scripts/bootstrap_uv.py "${RUNNER_TEMP}/kestrel-uv"
          pinned_uv="${RUNNER_TEMP}/kestrel-uv/uv"
          test "$($pinned_uv --version)" = "uv 0.9.21 (0dc9556ad 2025-12-30)"
          python -m venv --copies "${RUNNER_TEMP}/kestrel-transaction-venv"
          "$pinned_uv" export --frozen --no-dev --no-emit-local \
            --extra dev --group release --format requirements.txt \
            --output-file "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/kestrel-transaction-requirements.txt"
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip install \
            --no-build-isolation --no-deps -e '.[dev]'
          "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" -m pip check
          printf 'KESTREL_PYTHON=%s\n' \
            "${RUNNER_TEMP}/kestrel-transaction-venv/bin/python" >> "$GITHUB_ENV"

      - name: Restore role-specific authorization
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PROMOTION_AUTHORIZATION_ARTIFACT_NAME }}
          path: transaction

      - name: Normalize explicit authorization roles
        shell: bash
        run: |
          install -d -m 0700 transaction/stages
          test -f transaction/release-authorization.json
          if test "$PROMOTION_MODE" = initiate; then
            test ! -e transaction/release-execution-authorization.json
          else
            test -f transaction/release-execution-authorization.json
          fi

      - name: Bootstrap pinned GitHub CLI
        shell: bash
        run: |
          scripts/bootstrap_workflow_tools.sh "${RUNNER_TEMP}/kestrel-workflow-tools"
          pinned_gh="${RUNNER_TEMP}/kestrel-workflow-tools/gh"
          test "$($pinned_gh --version | head -n 1)" = \
            "gh version 2.97.0 (2026-02-26)"
          printf 'PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"
          printf 'KESTREL_PINNED_GH=%s\n' "$pinned_gh" >> "$GITHUB_ENV"

      - name: Download signed capsule verification and immutable capsule
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          prepare_tag="release-prepare-authority-${PROMOTION_RUN_ID}-1"
          install -d -m 0700 transaction/prepare-authority transaction/capsule-download
          "$PINNED_GH" release download "$prepare_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --dir transaction/prepare-authority
          recovery_tag="$("$KESTREL_PYTHON" - <<'PY'
          import json
          import re
          from pathlib import Path

          publication = json.loads(
              Path(
                  "transaction/prepare-authority/recovery-capsule-publication.json"
              ).read_bytes()
          )
          tag = publication["tag"]
          if not isinstance(tag, str) or re.fullmatch(r"recovery-[1-9][0-9]*-1", tag) is None:
              raise SystemExit("recovery capsule publication tag is invalid")
          print(tag)
          PY
          )"
          "$PINNED_GH" release download "$recovery_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --dir transaction/capsule-download
          "$KESTREL_PYTHON" - <<'PY'
          import os
          from pathlib import Path

          expected_authority = {
              "approval-history-observation.json",
              "recovery-capsule-publication.json",
              "recovery-capsule-verification.json",
          }
          authority = Path("transaction/prepare-authority")
          observed = {
              path.name
              for path in authority.iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if observed != expected_authority or len(list(authority.iterdir())) != 3:
              raise SystemExit("release-prepare authority inventory is not exact")
          capsule = Path("transaction/capsule-download")
          expected_capsule = {
              "recovery-bootstrap.py",
              "recovery-capsule-manifest.json",
              "recovery-capsule.tar",
          }
          observed_capsule = {
              path.name
              for path in capsule.iterdir()
              if path.is_file() and not path.is_symlink()
          }
          if observed_capsule != expected_capsule or len(list(capsule.iterdir())) != 3:
              raise SystemExit("recovery capsule download inventory is not exact")
          if any(path.stat().st_size <= 0 for path in (*authority.iterdir(), *capsule.iterdir())):
              raise SystemExit("release-prepare authority contains an empty asset")
          PY

      - name: Bootstrap and verify the immutable recovery capsule
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
        run: |
          readarray -t capsule_inputs < <("$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          signed = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-verification.json").read_bytes()
          )
          publication = json.loads(
              Path("transaction/prepare-authority/recovery-capsule-publication.json").read_bytes()
          )
          claim = signed["verification"]
          assets = {item["name"]: item for item in claim["assets"]}
          print(publication["archive_digest"])
          print(claim["capsule_manifest_digest"])
          print(claim["signing_key_fingerprint"])
          print(assets["recovery-bootstrap.py"]["sha256"])
          PY
          )
          test "${#capsule_inputs[@]}" -eq 4
          cmp --silent scripts/bootstrap_recovery.py \
            "transaction/capsule-download/recovery-bootstrap.py"
          test "$(sha256sum \
            "transaction/capsule-download/recovery-bootstrap.py" | cut -d ' ' -f 1)" = \
            "${capsule_inputs[3]#sha256:}"
          recovery_tcb_python="$(bash scripts/bootstrap_recovery_tcb.sh \
            "${RUNNER_TEMP}/kestrel-recovery-bootstrap-tcb")"
          env -i LANG=C.UTF-8 LC_ALL=C.UTF-8 PYTHONNOUSERSITE=1 PYTHONSAFEPATH=1 \
            "$recovery_tcb_python" -I -S -B \
            transaction/capsule-download/recovery-bootstrap.py \
            transaction/capsule-download/recovery-capsule.tar \
            --destination transaction/capsule \
            --expected-archive-digest "${capsule_inputs[0]}" \
            --expected-manifest-digest "${capsule_inputs[1]}" \
            --expected-owner-key-fingerprint "${capsule_inputs[2]}"

          "$PINNED_GH" api "repos/${PROMOTION_RECOVERY_REPOSITORY}" \
            > transaction/capsule-download/repository.json
          recovery_tag="$("$KESTREL_PYTHON" - <<'PY'
          import json
          import re
          from pathlib import Path

          publication = json.loads(
              Path(
                  "transaction/prepare-authority/recovery-capsule-publication.json"
              ).read_bytes()
          )
          tag = publication["tag"]
          if not isinstance(tag, str) or re.fullmatch(r"recovery-[1-9][0-9]*-1", tag) is None:
              raise SystemExit("recovery capsule publication tag is invalid")
          print(tag)
          PY
          )"
          "$PINNED_GH" api \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/tags/${recovery_tag}" \
            > transaction/capsule-download/release.json
          release_id="$("$KESTREL_PYTHON" -c \
            'import json; print(json.load(open("transaction/capsule-download/release.json"))["id"])')"
          "$PINNED_GH" api --paginate --slurp \
            "repos/${PROMOTION_RECOVERY_REPOSITORY}/releases/${release_id}/assets?per_page=100" \
            > transaction/capsule-download/assets-pages.json
          "$KESTREL_PYTHON" - <<'PY'
          import json
          from pathlib import Path

          pages = json.loads(Path("transaction/capsule-download/assets-pages.json").read_bytes())
          assets = [item for page in pages for item in page]
          Path("transaction/capsule-download/assets.json").write_text(
              json.dumps(assets, ensure_ascii=False, separators=(",", ":"), sort_keys=True),
              encoding="utf-8",
          )
          PY
          "$PINNED_GH" release verify "$recovery_tag" \
            --repo "$PROMOTION_RECOVERY_REPOSITORY" \
            --format json \
            > transaction/capsule-download/release-attestation.json
          for capsule_asset in \
            recovery-bootstrap.py \
            recovery-capsule-manifest.json \
            recovery-capsule.tar; do
            "$PINNED_GH" release verify-asset "$recovery_tag" \
              "transaction/capsule-download/$capsule_asset" \
              --repo "$PROMOTION_RECOVERY_REPOSITORY" \
              --format json \
              > "transaction/capsule-download/${capsule_asset}.attestation.json"
          done
          "$KESTREL_PYTHON" - \
            "$PINNED_GH" \
            "$PROMOTION_RECOVERY_REPOSITORY" \
            "$recovery_tag" \
            transaction/capsule-download/pinned-gh-release-verification.json <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          executable = Path(sys.argv[1])
          repository, tag, output_name = sys.argv[2:]
          digest = "sha256:" + hashlib.sha256(executable.read_bytes()).hexdigest()
          if digest != "sha256:141507c337e8b202ad398550c3b73d72f5af92e86f71665214538a81efd4c409":
              raise SystemExit("pinned GitHub CLI identity changed before observation")
          output = Path(output_name)
          result_specs = [
              ("release:verify", "release-attestation.json"),
              (
                  "release:verify-asset:recovery-bootstrap.py",
                  "recovery-bootstrap.py.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule-manifest.json",
                  "recovery-capsule-manifest.json.attestation.json",
              ),
              (
                  "release:verify-asset:recovery-capsule.tar",
                  "recovery-capsule.tar.attestation.json",
              ),
          ]
          results = []
          for operation, name in result_specs:
              raw = output.parent.joinpath(name).read_bytes()
              json.loads(raw)
              results.append(
                  {
                      "operation": operation,
                      "path": name,
                      "sha256": "sha256:" + hashlib.sha256(raw).hexdigest(),
                      "size_bytes": len(raw),
                  }
              )
          value = {
              "schema": "kestrel.pinned_gh_release_verification.v1",
              "pinned_gh_digest": digest,
              "pinned_gh_version": "gh version 2.97.0 (2026-02-26)",
              "repository": repository,
              "tag": tag,
              "results": results,
              "verified": True,
              "validation_status": "validated",
          }
          if output.exists() or output.is_symlink():
              raise SystemExit("pinned GitHub CLI observation output already exists")
          output.write_bytes(
              json.dumps(value, ensure_ascii=False, separators=(",", ":"), sort_keys=True).encode()
          )
          output.chmod(0o600)
          PY
          capsule_root="$GITHUB_WORKSPACE/transaction/capsule"
          capsule_python="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/environment/bin/python")"
          capsule_runtime="$(readlink -f -- "$capsule_root/recovery/runtime")"
          capsule_base_lib="$(readlink -f -- \
            "$capsule_root/../recovery-runtime/base/lib")"
          capsule_loader="$capsule_runtime/ld-linux-x86-64.so.2"
          capsule_library_path="$capsule_runtime:$capsule_base_lib"
          capsule_receipts="$GITHUB_WORKSPACE/transaction/capsule/scripts/release_control_receipt.py"
          test ! -e /etc/ld.so.preload
          test -x "$capsule_python"
          test -x "$capsule_loader"
          test -f "$capsule_receipts"
          test -z "$(find "$capsule_runtime" -mindepth 1 -type d -print -quit)"
          capsule_private_loader() {
            local loader_report loader_line dependency
            loader_report="$(env -i "$capsule_loader" --inhibit-cache \
              --library-path "$capsule_library_path" --list "$capsule_python")"
            case "$loader_report" in *"not found"*) return 1 ;; esac
            while IFS= read -r loader_line; do
              loader_line="${loader_line#"${loader_line%%[![:space:]]*}"}"
              if [[ "$loader_line" == *" => "* ]]; then
                dependency="${loader_line#* => }"
                dependency="${dependency%% *}"
              elif [[ "$loader_line" == /* ]]; then
                dependency="${loader_line%% *}"
              else
                continue
              fi
              case "$dependency" in
                "$capsule_runtime"/*|"$capsule_base_lib"/*) ;;
                *) return 1 ;;
              esac
            done <<< "$loader_report"
            (
              exec -c "$capsule_loader" --inhibit-cache \
                --library-path "$capsule_library_path" "$capsule_python" "$@"
            )
          }
          (
            cd transaction/capsule-download
            capsule_private_loader -I -S -B -c \
              'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
              "$capsule_root" "$capsule_root/scripts/recovery_launcher.py" \
              launch "$capsule_root/recovery-execution-closure.json" \
              --capsule-root "$capsule_root" \
              --executable python -- \
              "$capsule_receipts" verify-recovery-capsule-release \
              "$GITHUB_WORKSPACE/transaction/capsule" \
              --publication-receipt \
                "$GITHUB_WORKSPACE/transaction/prepare-authority/recovery-capsule-publication.json" \
              --fresh-repository-observation \
                "$GITHUB_WORKSPACE/transaction/capsule-download/repository.json" \
              --fresh-release-observation \
                "$GITHUB_WORKSPACE/transaction/capsule-download/release.json" \
              --fresh-assets-observation \
                "$GITHUB_WORKSPACE/transaction/capsule-download/assets.json" \
              --pinned-gh-verification-observation \
                "$GITHUB_WORKSPACE/transaction/capsule-download/pinned-gh-release-verification.json" \
              --output \
                "$GITHUB_WORKSPACE/transaction/capsule-download/capsule-release-verification.json"
          )
          actuator_input_dir="$GITHUB_WORKSPACE/transaction/host-actuator/prepare/inputs"
          install -d -m 0700 "$actuator_input_dir"
          install -m 0500 "$KESTREL_PYTHON" "$actuator_input_dir/python"
          install -m 0500 "$PINNED_GH" "$actuator_input_dir/gh"
          host_binding="$GITHUB_WORKSPACE/transaction/host-actuator/prepare/host-actuator-binding.json"
          test ! -e "$host_binding"
          capsule_private_loader -I -S -B -c \
            'import json,runpy,sys;root=sys.argv.pop(1);target=sys.argv.pop(1);sys.path[:]=json.load(open(root+"/recovery-execution-closure.json"))["sys_path"];runpy.run_path(target,run_name="__main__")' \
            "$capsule_root" \
            "$capsule_root/scripts/recovery_launcher.py" \
            launch "$capsule_root/recovery-execution-closure.json" \
            --capsule-root "$capsule_root" \
            --executable python -- \
            "$capsule_root/scripts/recovery_launcher.py" \
