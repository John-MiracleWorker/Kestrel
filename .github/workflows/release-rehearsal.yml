name: Release rehearsal

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-rehearsal-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rehearse-disposable-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      # Release ordering is enforced by release.yml from the exact-SHA main-push
      # receipt. Keep this disposable lane repeatable after a version is tagged.
      - name: Install hash-locked local build tooling
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r config/python-build-bootstrap.txt
          python -m pip install --no-build-isolation -e '.[dev]'
          python -m pip check
      - name: Rehearse in a disposable repository and package namespace
        run: >-
          python scripts/run_release_rehearsal.py
          --source-root .
          --sandbox-root "${RUNNER_TEMP}/kestrel-release-rehearsal"
          --namespace
          "kestrel-rehearsal-${GITHUB_REPOSITORY_ID}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          --commit "$GITHUB_SHA"
          --output "${RUNNER_TEMP}/kestrel-release-rehearsal-report.json"
      - name: Upload the rehearsal receipt
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-release-rehearsal-${{ github.sha }}
          path: ${{ runner.temp }}/kestrel-release-rehearsal-report.json
          if-no-files-found: warn
          retention-days: 14
