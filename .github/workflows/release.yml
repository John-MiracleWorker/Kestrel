name: Release

run-name: >-
  Kestrel release tx ${{ inputs.transaction_nonce }} bind ${{ inputs.dispatch_binding }}

on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Exact successful release-candidate workflow run ID
        required: true
        type: string
      candidate_manifest_digest:
        description: Exact lowercase sha256 candidate-manifest digest
        required: true
        type: string
      mode:
        description: initiate or recover_committed
        required: true
        type: string
      transaction_nonce:
        description: Unique 64-character lowercase hexadecimal transaction nonce
        required: true
        type: string
      dispatch_binding:
        description: JCS binding of the target ref and complete dispatch inputs
        required: true
        type: string

permissions: {}

concurrency:
  group: kestrel-release-promotion
  cancel-in-progress: false

jobs:
  release-transaction:
    uses: ./.github/workflows/release-transaction.yml
    permissions:
      actions: read
      attestations: write
      contents: write
      id-token: write
      packages: write
    secrets:
      RELEASE_GUARD_TOKEN: ${{ secrets.RELEASE_GUARD_TOKEN }}
      RELEASE_RECOVERY_READER_TOKEN: ${{ secrets.RELEASE_RECOVERY_READER_TOKEN }}
    with:
      candidate_run_id: ${{ inputs.candidate_run_id }}
      candidate_manifest_digest: ${{ inputs.candidate_manifest_digest }}
      mode: ${{ inputs.mode }}
      transaction_nonce: ${{ inputs.transaction_nonce }}
      dispatch_binding: ${{ inputs.dispatch_binding }}
