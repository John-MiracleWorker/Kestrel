name: Everyday golden determinism

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: determinism-${{ github.ref }}
  cancel-in-progress: true

jobs:
  runtime-reliability:
    name: Runtime reliability (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11"]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install runtime reliability dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r config/python-build-bootstrap.txt
          uv export --frozen --no-dev --no-emit-local --extra dev --format requirements.txt --output-file "${RUNNER_TEMP}/requirements-runtime-reliability.txt"
          python -m pip install --require-hashes --only-binary=:all: -r "${RUNNER_TEMP}/requirements-runtime-reliability.txt"
          python -m pip install --no-build-isolation --no-deps -e '.[dev]'
          python -m pip check
      - name: Run twenty fresh-process runtime reliability repetitions
        run: >-
          python scripts/run_runtime_reliability.py
          --repeats 20
          --source-commit "${SOURCE_COMMIT}"
          --run-root "${RUNNER_TEMP}/kestrel-runtime-reliability-runs"
          --output "${RUNNER_TEMP}/kestrel-runtime-reliability-report.json"
          --workspace "."
          --iteration-timeout-seconds 150
      - name: Upload runtime reliability receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-runtime-reliability-${{ runner.os }}-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/kestrel-runtime-reliability-report.json
            ${{ runner.temp }}/kestrel-runtime-reliability-runs/repeat-*/iteration-receipt.json
          if-no-files-found: error
          retention-days: 14

  everyday-golden-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        backend: [memory, memvid]
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "1729"
      RUN_MEMVID_INTEGRATION: "1"
      NEST_AGENT_VALIDATION_CONTAINER_IMAGE: "python@sha256:5c34b355088846dddc8afb7442c20b9433dccdc8d66192dc52c616adeaa106a3"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install deterministic evaluation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r config/python-build-bootstrap.txt
          uv export --frozen --no-dev --no-emit-local \
            --extra dev \
            --extra memvid \
            --format requirements.txt \
            --output-file "${RUNNER_TEMP}/requirements-determinism.txt"
          python -m pip install --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/requirements-determinism.txt"
          python -m pip install --no-build-isolation --no-deps \
            -e '.[dev,memvid]'
          python -m pip check
      - name: Preload the digest-pinned validation image
        run: docker pull "$NEST_AGENT_VALIDATION_CONTAINER_IMAGE"
      - name: Run twenty identical everyday golden evaluations
        run: >-
          python scripts/run_determinism_evals.py
          --backend ${{ matrix.backend }}
          --repeats 20
          --seed 1729
          --source-commit "${SOURCE_COMMIT}"
          --run-root "${RUNNER_TEMP}/kestrel-determinism-runs"
          --output "${RUNNER_TEMP}/kestrel-determinism-report.json"
          --workspace .
          --case-timeout-seconds 60
          --iteration-timeout-seconds 1500
          --max-case-latency-ms 45000
      - name: Upload the machine-readable flake report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-determinism-${{ matrix.backend }}-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/kestrel-determinism-report.json
            ${{ runner.temp }}/kestrel-determinism-runs/repeat-*/iteration-receipt.json
            ${{ runner.temp }}/kestrel-determinism-runs/repeat-*/golden-report.json
          if-no-files-found: error
          retention-days: 14

  runtime-reliability-qualification:
    name: Exact-SHA five-cell runtime reliability qualification
    needs:
      - runtime-reliability
      - everyday-golden-determinism
    if: github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}
      - name: Download Linux runtime reliability evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kestrel-runtime-reliability-Linux-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/kestrel-runtime-reliability-qualification/kestrel-runtime-reliability-Linux-${{ env.SOURCE_COMMIT }}
      - name: Download macOS runtime reliability evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kestrel-runtime-reliability-macOS-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/kestrel-runtime-reliability-qualification/kestrel-runtime-reliability-macOS-${{ env.SOURCE_COMMIT }}
      - name: Download Windows runtime reliability evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kestrel-runtime-reliability-Windows-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/kestrel-runtime-reliability-qualification/kestrel-runtime-reliability-Windows-${{ env.SOURCE_COMMIT }}
      - name: Download memory determinism evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kestrel-determinism-memory-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/kestrel-runtime-reliability-qualification/kestrel-determinism-memory-${{ env.SOURCE_COMMIT }}
      - name: Download Memvid determinism evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: kestrel-determinism-memvid-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/kestrel-runtime-reliability-qualification/kestrel-determinism-memvid-${{ env.SOURCE_COMMIT }}
      - name: Build the five-cell runtime reliability qualification
        run: >-
          python scripts/aggregate_runtime_reliability_receipts.py build
          --artifact-root "${RUNNER_TEMP}/kestrel-runtime-reliability-qualification"
          --source-commit "${SOURCE_COMMIT}"
          --workflow-run-id "${GITHUB_RUN_ID}"
          --workflow-run-attempt "${GITHUB_RUN_ATTEMPT}"
          --output "${RUNNER_TEMP}/kestrel-runtime-reliability-qualification/kestrel-runtime-reliability-qualification.json"
      - name: Upload the five-cell runtime reliability qualification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-runtime-reliability-qualification-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/kestrel-runtime-reliability-qualification
          if-no-files-found: error
          retention-days: 14

  flock-qualification-determinism:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      PYTHONHASHSEED: "1729"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          ref: ${{ env.SOURCE_COMMIT }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
      - name: Install deterministic evaluation dependencies
        run: |
          python -m pip install --require-hashes --only-binary=:all: \
            -r config/python-build-bootstrap.txt
          uv export --frozen --no-dev --no-emit-local \
            --extra dev \
            --format requirements.txt \
            --output-file "${RUNNER_TEMP}/requirements-flock-determinism.txt"
          python -m pip install --require-hashes --only-binary=:all: \
            -r "${RUNNER_TEMP}/requirements-flock-determinism.txt"
          python -m pip install --no-build-isolation --no-deps \
            -e '.[dev]'
          python -m pip check
      - name: Run twenty identical flock qualification journeys
        run: >-
          python scripts/run_flock_qualification_determinism.py
          --repeats 20
          --source-commit "${SOURCE_COMMIT}"
          --run-root "${RUNNER_TEMP}/kestrel-flock-qualification-runs"
          --output "${RUNNER_TEMP}/kestrel-flock-qualification-determinism.json"
      - name: Upload the flock qualification determinism report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kestrel-flock-qualification-determinism-${{ env.SOURCE_COMMIT }}
          path: ${{ runner.temp }}/kestrel-flock-qualification-determinism.json
          if-no-files-found: error
          retention-days: 14
