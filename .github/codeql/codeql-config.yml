# Kestrel Code Scanning configuration
#
# WHY paths-ignore scoped to these five files (and not a rule-wide disable):
#
# The `py/overly-permissive-file` rule fires on the intentional, test-pinned
# 0o644 (world-readable) recovery-capsule / staged-asset write modes in the
# five recovery/staging scripts below. The 0o644 is a deliberate, contract-
# enforced security boundary: the recovery capsule and staged assets must be
# world-readable so the recovery principal (a different, unprivileged user)
# can read them, while the secrets inside the capsule are kept 0o600 by
# construction. Changing the mode to 0o600 is explicitly out of scope
# (test-pinned contract) and would break the recovery flow.
#
# We therefore ignore findings on these five files only. This is file-scoped,
# not rule-wide: the `py/overly-permissive-file` rule stays fully active on
# every other file in the repo (including src/), and it is the only rule that
# currently fires on these five files (verified against the open-alert set).
#
# MECHANISM: this file is the single version-controlled source of truth for
# which paths carry this accepted exception. The workflow references it via
# the `config-file` init input (a file *path*), NOT the `config` input (a
# YAML *string*). The earlier red gate was a wiring bug: the path was passed
# to `config`, so the action tried to set `.queries` on that string and
# crashed at init ("Cannot create property 'queries' on string ...") before
# ever reading this file. That is why the suppression had zero effect and the
# gate failed on the same five sites. Passing it via `config-file` (see
# .github/workflows/ci.yml) is the fix.
#
# The old inline `# codeql[...]` / `# lgtm[...]` comments at these sites have
# been removed so the config file is the one, authoritative mechanism rather
# than two competing ones. The 0o644 write modes themselves are unchanged.
#
# Ignored files (all in scripts/, the recovery/staging tooling):
#   - scripts/bootstrap_recovery.py          (recovery bootstrap; 0o644 archive contract)
#   - scripts/recovery_launcher.py           (launcher; staged recovery assets)
#   - scripts/release_candidate_manifest.py  (manifest builder; staged assets)
#   - scripts/release_control_receipt.py     (receipt writer; staged assets)
#   - scripts/stage_recovery_dependencies.py (dependency staging; staged assets)

name: Kestrel Code Scanning
version: 2

paths-ignore:
  - scripts/bootstrap_recovery.py
  - scripts/recovery_launcher.py
  - scripts/release_candidate_manifest.py
  - scripts/release_control_receipt.py
  - scripts/stage_recovery_dependencies.py
