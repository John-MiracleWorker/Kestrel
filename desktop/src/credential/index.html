<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Kestrel credential</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="credential-card">
      <div class="eyebrow">Private credential entry</div>
      <div class="mark" aria-hidden="true">✦</div>
      <h1 id="provider-label">Provider</h1>
      <p class="lede">
        This value goes straight to Kestrel’s configured local credential
        boundary. It never enters the workbench.
      </p>
      <form id="credential-form">
        <label id="input-label" for="credential-value">API key</label>
        <input
          id="credential-value"
          name="credential"
          type="password"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          required
          autofocus
        >
        <p id="credential-status" class="status" role="status" aria-live="polite"></p>
        <div class="actions">
          <button id="credential-cancel" type="button" class="secondary">
            Cancel
          </button>
          <button id="credential-submit" type="submit" class="primary">
            Store securely
          </button>
        </div>
      </form>
    </main>
    <script type="module" src="./form.js"></script>
  </body>
</html>
